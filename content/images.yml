  - id: learning-1-3-years
    page: learning/1-3-years
    prompt: A toddler and a parent sit on the floor stacking large soft blocks of different sizes, the parent holding up fingers while the toddler adds one more block.
    alt:
      en: A toddler and a parent stack big soft blocks on the floor; the toddler holds up fingers while the parent adds a block.
      zh-hans: 学步儿和家长坐在地上叠大积木，孩子伸出手指比数字，家长再放上一块。
      zh-hant: 學步兒和家長坐在地上疊大積木，孩子伸出手指比數字，家長再放上一塊。
    size: '4:3'
  - id: learning-3-5-years
    page: learning/3-5-years
    prompt: A preschool child about four years old sits on a parent's lap with a large open picture book showing a friendly fox; the child points at the fox and the parent smiles warmly at the child. Both faces relaxed and happy. Exactly one adult and one child.
    alt:
      en: A preschooler on a parent’s lap points at a fox in a picture book while the parent asks a question.
      zh-hans: 孩子坐在家长腿上看绘本，兴奋地指着书里的狐狸，家长好奇地向他提问。
      zh-hant: 孩子坐在家長腿上看繪本，興奮地指著書裡的狐狸，家長好奇地向他提問。
