# Illustrations generated by AI (SPEC §9). One entry per image.
#   id      file name: src/assets/ai/<id>.jpg (an approved illustration); a first-style piece may still exist as
#           <id>.png until it is replaced; the loader prefers the .jpg. Candidates land in image-candidates/
#           on the review branch and never ship.
#   page    where it is used (for review; the first segment picks the placeholder icon)
#   prompt  the scene in English; the shared style below is appended to every prompt
#   alt     alt text in all three languages, describing the finished picture (checked again at review)
#   size    display crop ratio (the generator renders 1024x768 for 4:3)
# Content limits (SPEC §9): no hitting, spanking, injury, crying or frightened children, no distress beyond
# ordinary mild frustration; physical-discipline and safety pages use neutral scenes; no real people.
# To regenerate an image: run the workflow with its id in "ids".

style: >-
  Polished flat editorial illustration in one consistent style: a full-bleed scene that fills the entire
  canvas edge to edge, no frame, no border, no margin, no inset panel, no vignette; flat colour areas
  with a subtle paper-grain texture and no painterly brushwork; a warm limited palette of cream, peach,
  terracotta, muted teal and olive on a pale cream background; soft diffuse daylight and gentle shadows;
  friendly simplified faces with small calm features; an East Asian family with natural proportions,
  correct hands with five fingers and correct faces; a cozy slightly imperfect home or everyday place in
  Taiwan or mainland China; an uncluttered composition with one clear focal action; no text, letters,
  numbers, logos, signs, speech bubbles, symbols or icons anywhere; no watermark, no caption, no
  photorealism, no 3D render.

images:
  # Home and hubs
  - id: home-hero
    page: home
    prompt: "A parent reading an open picture book that shows only a big painted tree to a toddler on their lap on a plain flat-coloured sofa with no texture or pattern in a small Taipei apartment living room in soft afternoon light, an older child building a tower of plain wooden blocks on the tiled floor, a folded blanket on the armrest, the room filling the whole picture."
    alt:
      en: "A parent reads a picture book to a toddler on the sofa while an older child builds with wooden blocks on the floor of a small apartment living room."
      zh-hans: "家长在沙发上给怀里的幼儿读绘本，大一点的孩子在小公寓客厅的地板上搭积木。"
      zh-hant: "家長在沙發上為懷裡的幼兒讀繪本，大一點的孩子在小公寓客廳的地板上堆積木。"
    size: '4:3'
  - id: by-age-hero
    page: by-age
    prompt: "Two school-age children walking a few steps ahead, one parent carrying a baby in a cloth carrier and the other holding a toddler's hand, the whole family walking along a riverside park path in Taichung on a bright afternoon, banyan trees and a plain metal railing, seen from the side, the path and trees running off every edge of the picture."
    alt:
      en: "A family walks along a riverside park path: a parent carries a baby in a carrier and holds a toddler’s hand while two older children walk a few steps ahead."
      zh-hans: "一家人走在河边公园的小路上：家长用背巾抱着宝宝、牵着学步儿，两个大一点的孩子走在前面几步。"
      zh-hant: "一家人走在河邊公園的小路上：家長用背巾抱著寶寶、牽著學步兒，兩個大一點的孩子走在前面幾步。"
    size: '4:3'
  - id: approach-hero
    page: approach
    prompt: "A parent kneeling on the living-room floor of a Shanghai apartment, giving a gentle high five to a four-year-old who has just dropped the last toy into a woven basket, late afternoon window light, a stray sock and a water bottle on the floor."
    alt:
      en: "A parent kneels on the living-room floor and gives a four-year-old a high five beside a basket of tidied toys."
      zh-hans: "家长跪在客厅地板上，和刚把玩具收进篮子的四岁孩子击掌。"
      zh-hant: "家長跪在客廳地板上，和剛把玩具收進籃子的四歲孩子擊掌。"
