      zh-hans: 孩子若有所思地看着窗台上有点蔫的盆栽，家长站在旁边递上浇水壶。
      zh-hant: 孩子若有所思地看著窗台上有點枯萎的盆栽，家長站在旁邊遞上澆水壺。
