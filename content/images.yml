  - id: tool-specific-praise
    page: tool/specific-praise
    prompt: A child puts colorful toys into a woven basket while a parent nearby smiles warmly and gives a thumbs up.
    alt:
      en: A child puts toys into a basket while a parent smiles and gives a thumbs up.
      zh-hans: 孩子把彩色玩具收进篮子，家长在旁边笑着竖起大拇指。
      zh-hant: 孩子把彩色玩具收進籃子，家長在旁邊笑著比讚。
    size: '4:3'
  - id: tool-planned-ignoring
    page: tool/planned-ignoring
    prompt: A child sulks briefly with crossed arms on a sofa while a parent calmly keeps folding laundry nearby with a relaxed, patient expression, the room warm and peaceful.
    alt:
      en: A child sulks on the sofa while a parent calmly keeps folding laundry nearby with a patient expression.
      zh-hans: 孩子抱着手臂在沙发上闹别扭，家长在旁边耐心地继续叠衣服。
      zh-hant: 孩子抱著手臂在沙發上鬧彆扭，家長在旁邊耐心地繼續摺衣服。
    size: '4:3'
  - id: tool-redirection
    page: tool/redirection
    prompt: A single crawling baby on a living room floor reaches toward a power cord near the wall, and a parent kneels and gently turns the baby toward a basket of soft toys. Exactly one baby and one adult.
    alt:
      en: A parent gently lifts a crawling baby away from a cord behind the sofa and turns them toward a basket of soft toys.
      zh-hans: 宝宝爬去够沙发后的电线，家长轻轻抱起他，转向一篮软玩具。
      zh-hant: 寶寶爬去拿沙發後的電線，家長輕輕抱起他，轉向一籃軟玩具。
    size: '4:3'
  - id: tool-choices
    page: tool/choices
    prompt: A parent holds up two small shirts, one red and one blue, for a toddler to choose, and the toddler points at the blue one with a pleased face.
    alt:
      en: A parent holds up a red shirt and a blue shirt; the toddler happily points to the blue one.
      zh-hans: 家长拿着一件红衣服和一件蓝衣服让学步儿选，孩子开心地指着蓝色那件。
      zh-hant: 家長拿著一件紅衣服和一件藍衣服讓學步兒選，孩子開心地指著藍色那件。
