  - id: learning-5-7-years
    page: learning/5-7-years
    prompt: A child and a parent play a simple board game on a low table, a colorful winding path of plain colored squares, the child moving a wooden token and counting dots on a die.
    alt:
      en: A child and a parent play a board game with a winding orange path; the child holds a die while the parent watches.
      zh-hans: 孩子和家长在桌上玩棋盘游戏，棋盘上有一条弯弯的橙色小路，孩子拿着骰子，家长在旁边看。
      zh-hant: 孩子和家長在桌上玩桌遊，棋盤上有一條彎彎的橘色小路，孩子拿著骰子，家長在旁邊看。
    size: '4:3'
  - id: learning-7-10-years
    page: learning/7-10-years
    prompt: An older child sits at a tidy desk by a window quizzing themselves with blank index cards, flipping one over, while a parent nearby looks over with an encouraging smile.
    alt:
      en: An older child holds up a card to quiz themselves at a table while a parent beside them smiles and helps.
      zh-hans: 大一点的孩子在桌前拿着卡片自我测验，家长在旁边笑着帮忙。
      zh-hant: 大一點的孩子在桌前拿著卡片自我測驗，家長在旁邊笑著幫忙。
    size: '4:3'
  - id: learning-10-12-years
    page: learning/10-12-years
    prompt: A preteen studies at a desk by a window with flashcards and a notebook, a parent passing by the open door with a glass of water, bookshelf and a wall calendar behind, evening light.
    alt:
      en: A preteen studies at a desk by a window with flashcards and a notebook while a parent brings a glass of water to the open door.
      zh-hans: 一个十一二岁的孩子在窗边的书桌前用卡片和笔记本复习，家长端着一杯水走到敞开的房门口。
      zh-hant: 一個十一二歲的孩子在窗邊的書桌前用字卡和筆記本複習，家長端著一杯水走到敞開的房門口。
    size: '4:3'

  # Toolbox
  - id: tool-connection-time
    page: tool/connection-time
    prompt: A parent lies on a living room rug playing with toy cars, following a young child's lead along a pretend road made of blocks, both absorbed and happy.
    alt:
      en: A parent lies on the rug playing toy cars with a child, following the child’s lead along a pretend road of blocks.
      zh-hans: 家长趴在地毯上陪孩子玩小汽车，跟着孩子的想法沿着积木搭的小路开车。
      zh-hant: 家長趴在地毯上陪孩子玩小汽車，跟著孩子的想法沿著積木搭的小路開車。
    size: '4:3'
  - id: tool-clear-expectations
    page: tool/clear-expectations
    prompt: In a home entryway, a parent kneels at a young child's eye level, face to face, and calmly points to a pair of small shoes by the door; the child faces the parent, listening and nodding.
    alt:
      en: A parent kneels at a child’s eye level in the entryway and points to the shoes by the door; the child nods.
      zh-hans: 家长在玄关蹲到孩子的高度，平静地指着门边的小鞋，孩子边听边点头。
      zh-hant: 家長在玄關蹲到孩子的高度，平靜地指著門邊的小鞋，孩子邊聽邊點頭。
