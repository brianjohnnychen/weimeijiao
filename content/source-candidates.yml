# Candidate sources for the sources workflow's candidates job (metadata and abstracts before anything
# is added to sources.yml). Batch for INBOX item 8, the situation page on toddlers who keep testing
# limits with off-limits things (2026-10-06). Academic sources only; a claim is used only if the
# abstract or the article page supports it.
- key: "holden-west-1989"
  doi: "10.2307/1131071"
  query: "Holden & West 1989, Proximate regulation by mothers: A demonstration of how differing styles affect young children's behavior, Child Development 60(1) 64-69"
  claim: "With forbidden objects in a playroom, toddlers whose mothers kept them engaged in advance (proactive) went for the forbidden objects less than when mothers only reacted after the child approached."
- key: "holden-1983"
  doi: "10.2307/1129881"
  query: "Holden 1983, Avoiding conflict: Mothers as tacticians in the supermarket, Child Development 54(1) 233-240"
  claim: "Mothers who used preventive tactics (anticipating trouble, keeping the toddler busy) had fewer conflicts with their young children in the supermarket."
- key: "gralinski-kopp-1993"
  doi: "10.1037/0012-1649.29.3.573"
  query: "Gralinski & Kopp 1993, Everyday rules for behavior: Mothers' requests to young children, Developmental Psychology 29(3) 573-584"
  claim: "Mothers' earliest rules for toddlers concern safety and protecting people and property; rules widen with age and toddlers' compliance grows."
- key: "kochanska-tjebkes-forman-1998"
  doi: "10.1111/j.1467-8624.1998.tb06218.x"
  query: "Kochanska, Tjebkes & Forman 1998, Children's emerging regulation of conduct: Restraint, compliance, and internalization from infancy to the second year, Child Development 69(5) 1378-1389"
  claim: "Toddlers' ability to leave prohibited objects alone grows across the second year, including when the adult is not watching."
- key: "morrongiello-2006-supervision"
  doi: "10.1093/jpepsy/jsj073"
  query: "Morrongiello, Corbett, McCourt & Johnston 2006, Understanding unintentional injury risk in young children II. The contribution of caregiver supervision, child attributes, and parent attributes, Journal of Pediatric Psychology 31(6) 540-551"
  claim: "Closer caregiver supervision went with fewer injuries among young children at home."
- key: "morrongiello-2004-toddlers"
  doi: "10.1093/jpepsy/jsh046"
  query: "Morrongiello, Ondejko & Littlejohn 2004, Understanding toddlers' in-home injuries: I. Context, correlates, and determinants, Journal of Pediatric Psychology 29(6) 415-431"
  claim: "Toddlers' injuries at home often happened when they were not being watched and the same kind of injury often recurred; parents changed the environment less than expected."
- key: "morrongiello-2001-rules"
  doi: "10.1093/jpepsy/26.2.105"
  query: "Morrongiello, Midgett & Shields 2001, Don't run with scissors: Young children's knowledge of home safety rules, Journal of Pediatric Psychology 26(2) 105-115"
  claim: "Young children's knowledge of home safety rules grows with age, but knowing a rule does not mean the child follows it when unsupervised."
- key: "reisner-2007-dogs"
  doi: "10.1136/ip.2007.015396"
  query: "Reisner, Shofer & Nance 2007, Behavioral assessment of child-directed canine aggression, Injury Prevention 13(5) 348-351"
  claim: "Most dogs that bit children were familiar dogs; bites to young children were often linked to the child approaching or touching the dog's food, toys or resting place."
- key: "kahn-2003-dogs"
  doi: "10.1007/s00431-002-1130-6"
  query: "Kahn, Bauche & Lamoureux 2003, Child victims of dog bites treated in emergency departments: a prospective survey, European Journal of Pediatrics 162(4) 254-258"
  claim: "Most bites to young children happened at home from a familiar dog, often during interaction with the dog, frequently with an adult nearby but not actively supervising."
- key: "schalamon-2006-dogs"
  doi: "10.1542/peds.2005-1451"
  query: "Schalamon et al. 2006, Analysis of dog bites in children who are younger than 17 years, Pediatrics 117(3) e374-e379"
  claim: "Young children were at the highest risk of dog bites, most often from familiar dogs, with younger children bitten on the head and face."
- key: "arhant-2017-dogs"
  doi: "10.3389/fvets.2017.00130"
  query: "Arhant, Beetz & Troxler 2017, Caregiver reports of interactions between children up to 6 years and their family dog: Implications for dog bite prevention, Frontiers in Veterinary Science 4, 130"
  claim: "Caregivers of children up to 6 often allowed risky interactions with the family dog and supervised passively; active supervision and separation are recommended."
- key: "shen-2017-dog-safety"
  doi: "10.1093/jpepsy/jsv164"
  query: "Shen et al. 2017, Systematic review: Interventions to educate children about dog safety and prevent pediatric dog-bite injuries: A meta-analytic review, Journal of Pediatric Psychology 42(7) 779-791"
  claim: "Dog-safety education raised children's knowledge, but evidence that it changes behavior or prevents bites is limited."
- key: "roberts-1988-room"
  doi: "10.1177/01454455880123002"
  query: "Roberts 1988, Enforcing chair timeouts with room timeouts, Behavior Modification 12(3) 353-370"
  claim: "A brief room time-out used as a back-up when preschoolers left the time-out chair enforced the chair time-out."
- key: "roberts-powers-1990"
  doi: "10.1016/S0005-7894(05)80329-6"
  query: "Roberts & Powers 1990, Adjusting chair timeout enforcement procedures for oppositional children, Behavior Therapy 21(3) 257-271"
  claim: "Compared back-up procedures for children who escape chair time-out; a non-hitting room or barrier back-up was effective."
- key: "mcneil-1994-escape"
  doi: "10.1300/J019v16n03_02"
  query: "McNeil, Clemens-Mowrer, Gurwitch & Funderburk 1994, Assessment of a new procedure to prevent timeout escape in preschoolers, Child & Family Behavior Therapy 16(3) 27-35"
  claim: "A back-up procedure prevented preschoolers from escaping time-out."
- key: "gardner-1989-inconsistency"
  doi: "10.1007/BF00913796"
  query: "Gardner 1989, Inconsistent parenting: Is there evidence for a link with children's conduct problems?, Journal of Abnormal Child Psychology 17(2) 223-233"
  claim: "Mothers of preschoolers with conduct problems were more inconsistent in following through on their own instructions."
- key: "drummond-2017-repair"
  doi: "10.1111/cdev.12653"
  query: "Drummond, Hammond, Satlof-Bedrick, Waugh & Brownell 2017, Helping the one you hurt: Toddlers' rudimentary guilt, shame, and prosocial behavior after harming another, Child Development 88(4) 1382-1397"
  claim: "Toddlers who caused a mishap to an adult tried to repair it, and reparative behavior grew between 18 and 30 months."
- key: "vaish-2016-guilt"
  doi: "10.1111/cdev.12628"
  query: "Vaish, Carpenter & Tomasello 2016, The early emergence of guilt-motivated prosocial behavior, Child Development 87(6) 1772-1782"
  claim: "Young children who believed they had caused an accident showed more reparative behavior than when someone else caused it."
- key: "riley-2017-timeout-survey"
  doi: "10.1016/j.acap.2016.08.004"
  query: "Riley, Wagner, Tudor, Zuckerman & Freeman 2017, A survey of parents' perceptions and use of time-out compared to empirical evidence, Academic Pediatrics 17(2) 168-175"
  claim: "Many parents of young children use time-out but often depart from the evidence-based way of doing it."
- key: "drayton-2014-timeout-guidance"
  doi: "10.1097/DBP.0000000000000059"
  query: "Drayton, Andersen, Knight, Felt, Fredericks & Dore-Stites 2014, Internet guidance on time out: Inaccuracies, omissions, and what to tell parents instead, Journal of Developmental & Behavioral Pediatrics 35(4) 239-246"
  claim: "Online time-out advice often leaves out evidence-based components such as brevity, calm delivery and a plan for leaving time-out."
- key: "lerman-iwata-1995"
  doi: "10.1901/jaba.1995.28-93"
  query: "Lerman & Iwata 1995, Prevalence of the extinction burst and its attenuation during treatment, Journal of Applied Behavior Analysis 28(1) 93-94"
  claim: "A burst of the behavior when it stops working occurred in a minority of cases, and less often when other procedures were combined with extinction."
- key: "wierson-forehand-1994"
  doi: "10.1111/1467-8721.ep10770634"
  query: "Wierson & Forehand 1994, Parent behavioral training for child noncompliance: Rationale, concepts, and effectiveness, Current Directions in Psychological Science 3(5) 146-150"
  claim: "Parent training for young children's noncompliance improves compliance, and the gains generalize and last."
