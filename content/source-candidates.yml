# Candidate sources for the 10-12 phase (pre-adolescence). Looked up by the sources workflow's
# candidates job (metadata and abstracts) before anything is added to sources.yml. Each entry
# has the DOI as remembered (verified against Crossref by the job) and a bibliographic query
# as the fallback. Remove entries once they are added to sources.yml or rejected.
- key: stattin-kerr-2000
  doi: 10.1111/1467-8624.00210
  query: "Stattin Kerr 2000 Parental monitoring: a reinterpretation Child Development"
  claim: what parents know comes mainly from children's own disclosure, not from parental control or solicitation; disclosure is linked with better adjustment
- key: kerr-stattin-2000
  doi: 10.1037/0012-1649.36.3.366
  query: "Kerr Stattin 2000 What parents know, how they know it, and several forms of adolescent adjustment Developmental Psychology"
  claim: child disclosure, not parental control, is the source of parental knowledge linked with adjustment; ages about 14
- key: steinberg-monahan-2007
  doi: 10.1037/0012-1649.43.6.1531
  query: "Steinberg Monahan 2007 Age differences in resistance to peer influence Developmental Psychology"
  claim: resistance to peer influence is flat between ages 10 and 14 and increases between 14 and 18
- key: laursen-coy-collins-1998
  doi: 10.1111/j.1467-8624.1998.tb06245.x
  query: "Laursen Coy Collins 1998 Reconsidering changes in parent-child conflict across adolescence: a meta-analysis Child Development"
  claim: parent-child conflict rate declines from early to late adolescence while conflict affect rises from early to mid adolescence
- key: aap-2016-school-aged-media
  doi: 10.1542/peds.2016-2592
  query: "Council on Communications and Media 2016 Media Use in School-Aged Children and Adolescents Pediatrics"
  claim: AAP policy statement on media use for school-aged children and adolescents: family media use plan, consistent limits, media-free times and places, no screens in bedrooms, sleep
- key: orben-przybylski-2019
  doi: 10.1038/s41562-018-0506-1
  query: "Orben Przybylski 2019 The association between adolescent well-being and digital technology use Nature Human Behaviour"
  claim: the association between digital technology use and adolescent well-being is negative but small, explaining at most 0.4% of the variation
- key: odgers-jensen-2020
  doi: 10.1111/jcpp.13190
  query: "Odgers Jensen 2020 Annual Research Review: Adolescent mental health in the digital age: facts, fears, and future directions Journal of Child Psychology and Psychiatry"
  claim: review: associations between digital technology use and adolescent mental health are small and inconsistent; evidence does not support strong causal claims
- key: evans-lee-2011
  doi: 10.1037/a0023425
  query: "Evans Lee 2011 Verbal deception from late childhood to middle adolescence and its relation to executive functioning skills Developmental Psychology"
  claim: lying ability develops from late childhood to middle adolescence and is related to executive functioning (ages 8 to 16)
- key: ttofi-farrington-2011
  doi: 10.1007/s11292-010-9109-1
  query: "Ttofi Farrington 2011 Effectiveness of school-based programs to reduce bullying: a systematic and meta-analytic review Journal of Experimental Criminology"
  claim: school-based anti-bullying programs reduce bullying by about 20-23% and victimization by about 17-20%; parent training and meetings are among the effective elements
- key: lereya-samara-wolke-2013
  doi: 10.1016/j.chiabu.2013.03.001
  query: "Lereya Samara Wolke 2013 Parenting behavior and the risk of becoming a victim and a bully/victim: a meta-analysis study Child Abuse & Neglect"
  claim: warm, involved parenting and supervision are linked with lower risk of being bullied; harsh or abusive parenting with higher risk
- key: ullsperger-nikolas-2017
  doi: 10.1037/bul0000106
  query: "Ullsperger Nikolas 2017 A meta-analytic review of the association between pubertal timing and psychopathology in adolescence: Are there sex differences in risk? Psychological Bulletin"
  claim: earlier pubertal timing is linked with more psychopathology in adolescence, in girls and boys
- key: pinquart-2017-externalizing
  doi: 10.1037/dev0000295
  query: "Pinquart 2017 Associations of parenting dimensions and styles with externalizing problems of children and adolescents: an updated meta-analysis Developmental Psychology"
  claim: harsh control and psychological control are linked with more externalizing problems; warmth, behavioral control and autonomy granting with fewer; small effects
- key: pinquart-2017-internalizing
  doi: 10.1080/01494929.2016.1247761
  query: "Pinquart 2017 Associations of parenting dimensions and styles with internalizing symptoms in children and adolescents: a meta-analysis Marriage & Family Review"
  claim: psychological control and harsh control linked with more internalizing symptoms; warmth and autonomy support with fewer
- key: mendle-2007
  doi: 10.1016/j.dr.2006.11.001
  query: "Mendle Turkheimer Emery 2007 Detrimental psychological outcomes associated with early pubertal timing in adolescent girls Developmental Review"
  claim: early-maturing girls show more depression, substance use and disruptive behavior
- key: dishion-mccord-poulin-1999
  doi: 10.1037/0003-066X.54.9.755
  query: "Dishion McCord Poulin 1999 When interventions harm: peer groups and problem behavior American Psychologist"
  claim: grouping high-risk young adolescents together in interventions can increase problem behavior (deviancy training)
- key: soenens-vansteenkiste-2010
  doi: 10.1016/j.dr.2009.11.001
  query: "Soenens Vansteenkiste 2010 A theoretical upgrade of the concept of parental psychological control: proposing new insights on the basis of self-determination theory Developmental Review"
  claim: psychological control (guilt induction, love withdrawal) undermines autonomy and is linked with worse adjustment; autonomy support is distinct from permissiveness
- key: racz-mcmahon-2011
  doi: 10.1007/s10567-011-0099-y
  query: "Racz McMahon 2011 The relationship between parental knowledge and monitoring and child and adolescent conduct problems: a 10-year update Clinical Child and Family Psychology Review"
  claim: parental knowledge of whereabouts and activities is consistently linked with fewer conduct problems; knowledge comes largely from child disclosure
- key: wood-2008-screens-sleep
  query: "Cain Gradisar 2010 Electronic media use and sleep in school-aged children and adolescents: a review Sleep Medicine"
  claim: electronic media use is associated with shorter sleep and later bedtimes in school-aged children and adolescents
- key: carskadon-2011
  doi: 10.1016/j.pcl.2011.03.003
  query: "Carskadon 2011 Sleep in adolescents: the perfect storm Pediatric Clinics of North America"
  claim: puberty brings a biological shift toward later sleep timing
- key: fuligni-eccles-1993
  doi: 10.1037/0012-1649.29.4.622
  query: "Fuligni Eccles 1993 Perceived parent-child relationships and early adolescents' orientation toward peers Developmental Psychology"
  claim: early adolescents who saw few chances to join family decisions were more oriented toward peers
- key: yeager-dahl-dweck-2018
  doi: 10.1177/1745691617722620
  query: "Yeager Dahl Dweck 2018 Why interventions to influence adolescent behavior often fail but could succeed Perspectives on Psychological Science"
  claim: adolescents respond to respect for their status and autonomy; nagging and lecturing backfire
- key: eccles-1993-stage-environment
  doi: 10.1037/0003-066X.48.2.90
  query: "Eccles Midgley Wigfield 1993 Development during adolescence: the impact of stage-environment fit on young adolescents' experiences in schools and in families American Psychologist"
  claim: declines in motivation at the move to secondary school reflect a mismatch between adolescents' growing need for autonomy and more controlling environments
