# Word-for-word lookups, run on push by the quotes job in .github/workflows/sources.yml.
#   { id, pattern, urls? }    a sources.yml entry: its abstract and article page(s)
#   { url, pattern, links? }  any page; links lists the page's links matching that pattern
#   { search }                Bing and DuckDuckGo results with snippets
# Remove entries once the question is settled; the job prints matching sentences only.
# Last batch (2026-10-06, run 37489839624, INBOX item 8) is recorded in the verified_via of
# kendrick-2012-cochrane, compliance-plos-2018 and shen-2017-dog-safety.
# The 2026-10-03 domain probes (public DNS answers and .com registry status) are recorded in
# docs/STATUS.md, open issue 1; after DNS changes, smoke.yml is the live check.
# Seventh batch of 2026-10-07 (INBOX item 9). Settled by the sixth batch (run 37564222692): Chao's full text
# (guan, training, the supportive relationship), now recorded in chao-1994. This batch confirms its last page
# (Crossref gives only the first, 1111) from the OpenAlex and Semantic Scholar records.
- url: "https://api.openalex.org/works/doi:10.2307/1131308"
  pattern: "first_page|last_page|1111|1119|biblio"
- url: "https://api.semanticscholar.org/graph/v1/paper/DOI:10.2307/1131308?fields=title,year,journal"
  pattern: "pages|1111|volume"
