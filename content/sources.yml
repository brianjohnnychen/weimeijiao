  venue: Pediatric Reports, 14(2), 244-253
  doi: 10.3390/pediatric14020032
  pmid: "35645369"
  url: https://doi.org/10.3390/pediatric14020032
  lang: en
  finding:
    en: In a small pilot study, mothers of 3- to 5-year-olds who received brief training used time-in over two weeks and rated it easy to use and effective; the authors note there are few empirical studies of the technique.
    zh-hans: 在一项小型试点研究中，3 至 5 岁孩子的母亲接受简短培训后，在两周内使用陪伴冷静（time-in），并认为它容易使用且有效；作者也指出，关于这种方法的实证研究还很少。
    zh-hant: 在一項小型前導研究中，3 至 5 歲孩子的母親接受簡短訓練後，在兩週內使用陪伴冷靜（time-in），並認為它容易使用且有效；作者也指出，關於這種方法的實證研究還很少。
  key_facts:
    - Time-in "is intended to help the child connect to the parent, communicate their feelings, and learn how to self-regulate".
    - Mothers received brief training and reported daily on their use of time-in over a two-week period, followed by a post-intervention interview.
    - 32 mothers of 3- to 5-year-olds took part in the initial interview; 19 had mostly complete data.
    - Based on daily reports and interviews, mothers evaluated the technique as easy to use and effective.
    - Although time-in has been advocated in the positive parenting literature since at least the 1990s, the authors write that there are few empirical studies evaluating it.
