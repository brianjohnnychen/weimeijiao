    zh-hant: 一項納入 24 項研究、對象為照顧者和 3 至 12 歲孩子的文獻回顧與統合分析發現，親子互動治療（PCIT）和 Triple P（3P 正向教養）都減少了家長回報的孩子行為問題和教養問題；依家長回報，PCIT 效果大（簡化版 PCIT 為中等），除媒體版 Triple P 效果小以外，各種形式的 Triple P 效果都在中等到大之間。
