- id: larzelere-kuhn-2005
  evidence_level: meta-analysis
  authors: Larzelere, R. E., & Kuhn, B. R.
  year: 2005
  title: "Comparing Child Outcomes of Physical Punishment and Alternative Disciplinary Tactics: A Meta-Analysis"
  venue: Clinical Child and Family Psychology Review, 8(1), 1-37
  doi: 10.1007/s10567-005-2340-z
  pmid: "15898303"
  url: https://doi.org/10.1007/s10567-005-2340-z
  lang: en
  finding:
    en: In their meta-analysis of 26 studies comparing physical punishment with alternative discipline tactics, Larzelere and Kuhn report that effect sizes significantly favored what they call conditional spanking over 10 of 13 alternative tactics for reducing child noncompliance or antisocial behavior, that customary physical punishment yielded effect sizes equal to the alternatives except in one large study favoring physical punishment, and that only overly severe or predominant use of physical punishment compared unfavorably with the alternatives.
    zh-hans: Larzelere 和 Kuhn 在这项纳入 26 项研究、比较体罚与替代管教方式的荟萃分析中报告：在减少孩子不服从或反社会行为方面，他们所说的“有条件打屁股”的效应量显著优于 13 种替代方式中的 10 种；惯常体罚的效应量与替代方式相当，只有一项大型研究偏向体罚；只有过于严厉或以体罚为主的做法，结果比替代方式差。
    zh-hant: Larzelere 與 Kuhn 在這項納入 26 項研究、比較體罰與替代管教方式的統合分析中指出：在減少孩子不服從或反社會行為方面，他們所稱的「有條件打屁股」，效果量顯著優於 13 種替代方式中的 10 種；慣常體罰的效果量與替代方式相當，只有一項大型研究結果偏向體罰；只有過於嚴厲或以體罰為主的做法，結果比替代方式差。
