    - '"At week 24, the Aberrant Behavior Checklist-Irritability subscale declined 47.7% in parent training (from 23.7 to 12.4) compared with 31.8% for parent education (23.9 to 16.3)"'
    - '"a 24-week parent training program was superior to parent education for reducing disruptive behavior on parent-reported outcomes, although the clinical significance of the improvement is unclear"'
    - '"The rate of positive response judged by a blinded clinician was greater for parent training vs parent education."'
