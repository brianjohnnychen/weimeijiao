    - '"A similar pattern of adverse effects was shown for grounding and psychotherapy and partially for the other two disciplinary tactics."'
    - '"All of these effects became non-significant after controlling for latent comprehensive measures of externalizing behavior problems."'
    - '"How and when disciplinary tactics are used may be more important than which type of tactic is used."'
