  finding:
    en: In a national probability sample of 3599 children and youth, those aged 0 to 9 and 10 to 17 who had experienced sibling aggression in the past year (psychological, property, or mild or severe physical assault) reported greater mental health distress, and in general sibling and peer aggression each independently predicted worse mental health.
    zh-hans: 一项全国概率样本研究（n = 3599）发现，过去一年遭受过兄弟姐妹攻击（包括心理攻击、财物侵犯以及轻度或严重的身体攻击）的 0 至 9 岁儿童和 10 至 17 岁青少年，心理健康困扰更严重；而且总体来看，兄弟姐妹攻击和同伴攻击各自独立地预测了更差的心理健康。
