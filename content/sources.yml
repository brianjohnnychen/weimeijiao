- id: macnamara-burgoyne-2023
  evidence_level: meta-analysis
  authors: Macnamara, B. N., & Burgoyne, A. P.
  year: 2023
  title: Do growth mindset interventions impact students’ academic achievement? A systematic review and meta-analysis with recommendations for best practices
  venue: Psychological Bulletin, 149(3-4), 133-173
  doi: 10.1037/bul0000352
  pmid: "36326645"
  url: https://doi.org/10.1037/bul0000352
  lang: en
  finding:
    en: A systematic review and meta-analysis of 63 studies (N = 97,672) found a small overall effect of growth mindset interventions on academic achievement (average d = 0.05) that was nonsignificant after correcting for potential publication bias, and nonsignificant effects in studies showing the intervention changed students' mindsets as intended (d = 0.04) and in the highest-quality studies (d = 0.02); the authors conclude that apparent effects are likely due to inadequate study design, reporting flaws and bias.
    zh-hans: 这项系统综述和荟萃分析纳入 63 项研究（N = 97,672），发现成长型思维干预对学业成绩的总体效果很小（平均 d = 0.05），校正可能的发表偏倚后不再显著；在确认干预确实按预期改变了学生思维模式的研究中（d = 0.04），以及质量最高的研究中（d = 0.02），效果也都不显著；作者认为，看似存在的效果很可能源于研究设计不足、报告缺陷和偏倚。
    zh-hant: 這項系統性回顧與統合分析納入 63 項研究（N = 97,672），發現成長型思維介入對學業成就的整體效果很小（平均 d = 0.05），校正可能的發表偏誤後即不顯著；在確認介入確實如預期改變學生思維模式的研究中（d = 0.04），以及品質最高的研究中（d = 0.02），效果也都不顯著；作者認為，看似存在的效果很可能來自研究設計不足、報告缺失與偏誤。
  key_facts:
    - '"When examining all studies (63 studies, N = 97,672), we found major shortcomings in study design, analysis, and reporting, and suggestions of researcher and publication bias"'
    - '"Authors with a financial incentive to report positive findings published significantly larger effects than authors without this incentive."'
    - '"Across all studies, we observed a small overall effect: d ¯ = 0.05, 95% CI = [0.02, 0.09], which was nonsignificant after correcting for potential publication bias."'
    - '"No theoretically meaningful moderators were significant."'
    - "\"When examining only studies demonstrating the intervention influenced students' mindsets as intended (13 studies, N = 18,355), the effect was nonsignificant: d ¯ = 0.04, 95% CI = [-0.01, 0.10].\""
    - '"When examining the highest-quality evidence (6 studies, N = 13,571), the effect was nonsignificant: d ¯ = 0.02, 95% CI = [-0.06, 0.10]."'
  ages: students (ages and grade levels not stated in the abstract)
  strength: mixed
  topics:
