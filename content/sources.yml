    zh-hans: 一项现场实验发现，对某项活动本来就有兴趣的孩子，如果是为了得到外在奖励而答应去做这项活动，之后对它的内在兴趣会低于事后才意外得到奖励或完全没有奖励的孩子。
    zh-hant: 一項實地實驗發現，對某項活動原本就有興趣的孩子，如果是為了得到外在獎勵而答應去做這項活動，之後對它的內在興趣會低於事後才意外得到獎勵或完全沒有獎勵的孩子。
  key_facts:
    - '"Children showing intrinsic interest in a target activity during base-line observations were exposed to one of three conditions"'
    - '"In the expected-award condition, subjects agreed to engage in the target activity in order to obtain an extrinsic reward; in the unexpected-award condition, subjects had no knowledge of the reward until after they had finished with the activity; and in the no-award condition, subjects neither expected nor received the reward."'
