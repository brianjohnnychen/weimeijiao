- id: dunlosky-2013
  evidence_level: review
  authors: Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T.
  year: 2013
  title: "Improving Students’ Learning With Effective Learning Techniques: Promising Directions From Cognitive and Educational Psychology"
  venue: Psychological Science in the Public Interest, 14(1), 4-58
  doi: 10.1177/1529100612453266
  pmid: "26173288"
  url: https://doi.org/10.1177/1529100612453266
  lang: en
  finding:
    en: A review of 10 learning techniques gave practice testing and distributed practice high utility ratings, because they benefit learners of different ages and abilities and have been shown to boost students' performance across many criterion tasks.
    zh-hans: 这篇综述评估了 10 种学习方法，给予练习测试和间隔练习“高实用性”的评价，因为它们对不同年龄和能力的学习者都有益，并且已被证明能在多种评估任务中提升学生的表现。
    zh-hant: 這篇回顧文章評估了 10 種學習方法，給予練習測驗和間隔練習「高實用性」的評價，因為它們對不同年齡和能力的學習者都有幫助，並且已證實能在多種評量任務中提升學生的表現。
  key_facts:
