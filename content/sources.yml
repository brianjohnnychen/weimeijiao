  url: https://doi.org/10.1371/journal.pone.0204929
  lang: en
  finding:
    en: A multilevel meta-analysis of 19 studies that experimentally manipulated single parenting behaviors found that time-out for noncompliance (ds = 0.84-1.72) and briefly ignoring the child after noncompliance (ds = 0.36-1.77) robustly increased child compliance, verbal reprimands did so only when observed and parent-reported outcomes were combined (d = 0.72), and praise did not increase compliance.
    zh-hans: 一项针对 19 项以实验方式检验单一教养行为的研究所做的多层次荟萃分析发现，孩子不听从时使用暂停法（ds = 0.84 至 1.72）或短暂忽略孩子（ds = 0.36 至 1.77）都能稳定提高孩子的配合度；口头责备只有在合并观察和家长报告结果时才有效（d = 0.72）；表扬则没有提高配合度。
    zh-hant: 一項針對 19 項以實驗方式檢驗單一教養行為的研究所做的多層次統合分析發現，孩子不聽從時使用暫停法（ds = 0.84 至 1.72）或短暫忽略孩子（ds = 0.36 至 1.77）都能穩定提高孩子的配合度；口頭責備只有在合併觀察與家長回報結果時才有效（d = 0.72）；讚美則沒有提高配合度。
  key_facts:
