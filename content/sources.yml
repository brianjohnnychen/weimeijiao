  finding:
    en: In a randomized controlled trial with 54 grandparents caring for grandchildren aged 2 to 9, Grandparent Triple P significantly improved grandparent-reported child behavior problems, parenting confidence, grandparent depression, anxiety and stress, and the grandparent-parent relationship in the short term; parents, who did not take part, also reported fewer child behavior problems, and effects were mostly maintained at six months.
    zh-hans: 一项纳入 54 位祖父母（照顾 2 至 9 岁孙辈）的随机对照试验发现，Grandparent Triple P（祖父母版 3P 正向教养）在短期内显著改善了祖父母报告的孩子行为问题、教养信心，以及祖父母的抑郁、焦虑和压力，并改善了祖父母与孩子父母的关系；没有参加课程的父母也报告孩子行为问题减少，大部分效果在 6 个月追踪时仍然维持。
    zh-hant: 一項納入 54 位祖父母（照顧 2 至 9 歲孫子女）的隨機對照試驗發現，Grandparent Triple P（祖父母版 3P 正向教養）在短期內顯著改善了祖父母回報的孩子行為問題、教養信心，以及祖父母的憂鬱、焦慮和壓力，並改善了祖父母與孩子父母的關係；沒有參加課程的父母也回報孩子行為問題減少，大部分效果在 6 個月追蹤時仍然維持。
  key_facts:
