- id: ollendick-2016
  evidence_level: rct
  authors: Ollendick, T. H., Greene, R. W., Austin, K. E., Fraire, M. G., Halldorsdottir, T., Allen, K. B., Jarrett, M. A., Lewis, K. M., Whitmore Smith, M., Cunningham, N. R., Noguchi, R. J. P., Canavera, K., & Wolff, J. C.
