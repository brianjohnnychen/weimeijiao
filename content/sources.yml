  pmid: "16507066"
  url: https://doi.org/10.1111/j.1467-9280.2006.01693.x
  lang: en
  finding:
    en: In two experiments, students who took free-recall tests on prose passages (without feedback) retained substantially more than students who restudied them when the final test came 2 days or 1 week later, although restudying gave better recall after 5 minutes and increased students' confidence in their ability to remember.
    zh-hans: 两项实验让学生阅读短文，结果显示，与重复阅读相比，做自由回忆测试（不给反馈）的学生在 2 天或 1 周后的最终测试中记住的内容多得多；不过 5 分钟后测试时，重复阅读的效果更好，而且重复阅读会让学生对自己的记忆更有信心。
    zh-hant: 兩項實驗讓學生閱讀短文，結果顯示，與重複閱讀相比，做自由回憶測驗（不提供回饋）的學生在 2 天或 1 週後的最終測驗中記住的內容多得多；不過 5 分鐘後測驗時，重複閱讀的效果較好，而且重複閱讀會讓學生對自己的記憶更有信心。
  key_facts:
    - '"students studied prose passages and took one or three immediate free-recall tests, without feedback, or restudied the material the same number of times as the students who received tests"'
    - '"When the final test was given after 5 min, repeated studying improved recall relative to repeated testing."'
    - "\"on the delayed tests, prior testing produced substantially greater retention than studying, even though repeated studying increased students' confidence in their ability to remember the material\""
    - "Note: the abstract does not state the students' ages or the sample size."
