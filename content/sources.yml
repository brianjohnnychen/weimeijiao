- id: joussemet-2008
  evidence_level: review
  authors: Joussemet, M., Landry, R., & Koestner, R.
  year: 2008
  title: A self-determination theory perspective on parenting
  venue: Canadian Psychology / Psychologie canadienne, 49(3), 194-200
  doi: 10.1037/a0012754
  url: https://doi.org/10.1037/a0012754
  lang: en
  finding:
    en: "A review distinguishes parental autonomy support from permissiveness and independence promotion and reports clear and consistent positive effects across different types of studies: autonomy support was associated with infants' motivation and toddlers' internalization in observation studies, related to children's adjustment at school in parent interview studies, and, as perceived by adolescents, linked to their psychosocial functioning in self-report studies."
    zh-hans: 这篇综述把家长的自主支持与放任或单纯促进独立区分开来，并指出不同类型的研究都显示出清楚一致的正面效果：观察研究发现自主支持与婴儿的动机和幼儿的内化有关，家长访谈研究发现它与孩子在学校的适应有关，自评研究则发现青少年感受到的自主支持与其心理社会功能有关。
    zh-hant: 這篇回顧文章把家長的自主支持與放任或單純促進獨立區分開來，並指出不同類型的研究都顯示清楚一致的正面效果：觀察研究發現自主支持與嬰兒的動機和幼兒的內化有關，家長訪談研究發現它與孩子在學校的適應有關，自陳研究則發現青少年感受到的自主支持與其心理社會功能有關。
  key_facts:
    - '"the authors define parental autonomy support and distinguish it from permissiveness or independence promotion"'
    - '"clear and consistent positive effects arise from different types of studies, conducted with children of various ages"'
    - "\"Parent observation studies suggest that parental autonomy support is associated with infants' motivation and toddlers' internalization.\""
    - "\"Parent interview studies reveal that an autonomy-supportive parental attitude relates to children's adjustment at school.\""
    - '"Children self-report studies demonstrate a clear link between perceptions of parental autonomy support and psychosocial functioning amongst adolescents."'
    - "Note: narrative review; the studies it summarizes report associations, and the abstract gives no study counts or effect sizes."
