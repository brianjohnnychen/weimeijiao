- id: weisleder-fernald-2013
  evidence_level: longitudinal
  authors: Weisleder, A., & Fernald, A.
  year: 2013
  title: "Talking to Children Matters: Early Language Experience Strengthens Processing and Builds Vocabulary"
  venue: Psychological Science, 24(11), 2143-2152
  doi: 10.1177/0956797613488145
  pmid: "24022649"
  url: https://doi.org/10.1177/0956797613488145
  lang: en
  finding:
    en: In Spanish-speaking families low in socioeconomic status, infants who heard more speech addressed directly to them in all-day home recordings became more efficient at processing familiar words in real time and had larger expressive vocabularies by 24 months, while speech they merely overheard was unrelated to vocabulary, and their processing efficiency explained the link between child-directed speech and expressive vocabulary.
    zh-hans: 在社会经济地位较低的西班牙语家庭中，全天家庭录音显示，听到更多直接对自己说的话的婴儿，到 24 个月大时实时处理熟悉词语的效率更高，表达性词汇也更多；而只是在旁边听到的话与词汇发展无关；中介分析显示，直接对孩子说的话与表达性词汇之间的关系，可以用孩子的语言加工效率来解释。
    zh-hant: 在社經地位較低的西班牙語家庭中，全天居家錄音顯示，聽到較多直接對自己說的話的嬰兒，到 24 個月大時即時處理熟悉字詞的效率較高，表達性詞彙也較多；而只是在旁邊聽到的話與詞彙發展無關；中介分析顯示，直接對孩子說的話與表達性詞彙之間的關係，可以用孩子的語言處理效率來解釋。
