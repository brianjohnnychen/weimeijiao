  finding:
    en: Mothers of 5- to 8-year-olds who were trained to mediate their children's disputes were able to use mediation, which both mothers and children favored; compared with control families, children reasoned, discussed emotions and showed understanding of motivations more often, and mediation empowered children, especially younger siblings, to solve conflicts.
