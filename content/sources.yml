- id: tremblay-2004
  evidence_level: longitudinal
  authors: Tremblay, R. E., Nagin, D. S., Séguin, J. R., Zoccolillo, M., Zelazo, P. D., Boivin, M., Pérusse, D., & Japel, C.
  year: 2004
  title: "Physical Aggression During Early Childhood: Trajectories and Predictors"
  venue: Pediatrics, 114(1), e43-e50
  pmid: "15231972"
  url: https://publications.aap.org/pediatrics/article-abstract/114/1/e43/64728/Physical-Aggression-During-Early-Childhood
  lang: en
  finding:
    en: In a population sample of 572 families, mothers' reports at 17, 30 and 42 months showed that most toddlers used some physical aggression on rising trajectories (about 58% modest, 14% high), while 28% showed little or none.
    zh-hans: 在一个包含 572 个家庭的人口样本中，母亲在孩子 17、30 和 42 个月时的报告显示，大多数学步儿会有一些肢体攻击，而且呈上升趋势（约 58% 程度中等，14% 程度较高），只有 28% 很少或没有。
    zh-hant: 在一個包含 572 個家庭的人口樣本中，母親在孩子 17、30 和 42 個月時的回報顯示，大多數學步兒會有一些肢體攻擊，而且呈上升趨勢（約 58% 程度中等，14% 程度較高），只有 28% 很少或沒有。
  key_facts:
    - 572 families recruited when the baby was 5 months old; physical aggression frequency reported by mothers at 17, 30 and 42 months.
    - "Three trajectories: little or no physical aggression (28%), a rising trajectory of modest aggression (about 58%), and a rising trajectory of high physical aggression (14%)."
    - Boys were more at risk than girls of being on the high trajectory.
    - '"Children who are at highest risk of not learning to regulate physical aggression in early childhood have mothers with a history of antisocial behaviour during their school years, mothers who start childbearing early and who smoke during pregnancy, and parents who have low income and have serious problems living together."'
    - The study ends at 42 months, so it shows the rise of physical aggression in toddlerhood, not its later decline (see cote-2006).
  topics:
    - aggression
  accessed: 2026-10-04
  verified_via: "WebSearch (PubMed/PMC/AAP) results: https://pubmed.ncbi.nlm.nih.gov/15231972/, https://pmc.ncbi.nlm.nih.gov/articles/PMC2538721/ and https://publications.aap.org/pediatrics/article-abstract/114/1/e43/64728/Physical-Aggression-During-Early-Childhood confirmed title, Pediatrics 114(1), July 2004, design, trajectories, sex difference and conclusion sentence. The full author list and pages e43-e50 came from a bibliographic record (https://crdcn.ca/publication/physical-aggression-during-early-childhood-trajectories-and-predictors/). DOI not shown, so the AAP page is the url."
- id: cote-2006
  evidence_level: longitudinal
  authors: Côté, S. M., Vaillancourt, T., LeBlanc, J. C., Nagin, D. S., & Tremblay, R. E.
  year: 2006
  title: "The development of physical aggression from toddlerhood to pre-adolescence: a nation wide longitudinal study of Canadian children"
  venue: Journal of Abnormal Child Psychology, 34(1), 71-85
  pmid: "16565888"
  url: https://pubmed.ncbi.nlm.nih.gov/16565888/
  lang: en
  finding:
    en: Following 10,658 Canadian children between ages 2 and 11, most used physical aggression occasionally or infrequently as toddlers and infrequently or almost never by pre-adolescence, while about one in six (16.6%) stayed on a high, stable trajectory.
    zh-hans: 追踪 10,658 名 2 至 11 岁加拿大儿童的研究发现，大多数孩子在学步期偶尔或很少出现肢体攻击，到青春期前很少或几乎不再出现；约六分之一（16.6%）的孩子则一直维持在较高水平。
    zh-hant: 追蹤 10,658 名 2 至 11 歲加拿大兒童的研究發現，大多數孩子在學步期偶爾或很少出現肢體攻擊，到青春期前很少或幾乎不再出現；約六分之一（16.6%）的孩子則一直維持在較高程度。
  key_facts:
    - Ten cohorts of about 1,000 children each (n = 10,658) from a nationally representative Canadian sample, followed over 6 years, covering ages 2 to 11.
    - "Low desisting trajectory (31.1%): infrequent physical aggression in toddlerhood and virtually none by pre-adolescence."
    - "Moderate desisting trajectory (52.2%): occasional physical aggression in toddlerhood and infrequent use by pre-adolescence."
    - "High stable trajectory: 16.6% of children."
  topics:
