- id: moffitt-2011
  evidence_level: longitudinal
  authors: Moffitt, T. E., Arseneault, L., Belsky, D., Dickson, N., Hancox, R. J., Harrington, H., Houts, R., Poulton, R., Roberts, B. W., Ross, S., Sears, M. R., Thomson, W. M., & Caspi, A.
  year: 2011
  title: A gradient of childhood self-control predicts health, wealth, and public safety
  venue: Proceedings of the National Academy of Sciences, 108(7), 2693-2698
  doi: 10.1073/pnas.1010076108
  pmid: "21262822"
  url: https://doi.org/10.1073/pnas.1010076108
  lang: en
  finding:
    en: In a cohort of 1,000 children followed from birth to age 32, childhood self-control predicted physical health, substance dependence, personal finances and criminal offending outcomes along a gradient, independent of intelligence and social class; in a second cohort of 500 sibling pairs, the sibling with lower self-control had poorer outcomes despite shared family background.
    zh-hans: 一项从出生追踪到 32 岁、涵盖 1,000 名儿童的队列研究发现，童年时期的自我控制能力呈梯度地预测日后的身体健康、物质依赖、个人财务和犯罪情况，且这一关联独立于智力和社会阶层；在另一个包含 500 对兄弟姐妹的队列中，尽管家庭背景相同，自我控制较差的一方结果也较差。
    zh-hant: 一項從出生追蹤到 32 歲、涵蓋 1,000 名兒童的世代研究發現，童年時期的自我控制能力呈梯度地預測日後的身體健康、物質依賴、個人財務和犯罪情形，且這項關聯獨立於智力和社會階級；在另一個包含 500 對手足的世代中，儘管家庭背景相同，自我控制較差的一方結果也較差。
  key_facts:
    - '"Following a cohort of 1,000 children from birth to the age of 32 y, we show that childhood self-control predicts physical health, substance dependence, personal finances, and criminal offending outcomes, following a gradient of self-control."'
    - "\"Effects of children's self-control could be disentangled from their intelligence and social class as well as from mistakes they made as adolescents.\""
    - '"In another cohort of 500 sibling-pairs, the sibling with lower self-control had poorer outcomes, despite shared family background."'
    - "Note: the abstract does not state the ages at which childhood self-control was measured."
  ages: cohort of 1,000 children followed from birth to age 32, plus a cohort of 500 sibling pairs (outcomes measured into adulthood)
  strength: single-study
  topics:
    - executive-function
    - development
