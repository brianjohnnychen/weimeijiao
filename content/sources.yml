    zh-hant: 在上海進行的一項隨機試驗中，81 位中國家長被分為介入組和候補對照組。參加團體版 3P 正向教養課程（Group Triple P）的家長表示，孩子的適應問題減少，教養方式、家長自身狀態和教養自信都有改善，對孩子的學業表現更滿意，孩子與學習有關的問題行為也減少了；所有效果在 6 個月追蹤時仍然維持。
