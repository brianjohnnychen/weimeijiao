  finding:
    en: A review and meta-analysis of 24 studies of caregivers and 3- to 12-year-olds found that both Parent-Child Interaction Therapy (PCIT) and Triple P reduced parent-reported child behavior and parenting problems, with large parent-reported effects for PCIT (moderate for Abbreviated PCIT) and moderate to large effects for all forms of Triple P except Media Triple P (small).
