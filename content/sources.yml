  finding:
    en: This review describes PMTO, a set of parenting programs tested in efficacy and effectiveness trials across contexts, cultures and formats, in which parents learn skill encouragement, limit setting, monitoring and supervision, interpersonal problem solving and positive involvement; the programs prevent and reduce children's behavior problems by replacing coercive interactions with positive parenting.
    zh-hans: 这篇综述介绍了俄勒冈家长管理训练（PMTO）：这套家长课程已在不同环境、文化和形式下接受过效力和实效试验，家长在课程中学习鼓励技能、设定界限、监督照看、人际问题解决和积极参与；课程通过以积极教养取代强制性互动，预防并减少孩子的行为问题。
    zh-hant: 這篇回顧介紹了奧勒岡親職管理訓練（PMTO）：這套親職課程已在不同環境、文化和形式下接受過效能與成效試驗，家長在課程中學習鼓勵技能、設定界線、監督照看、人際問題解決和正向參與；課程透過以正向教養取代強制性互動，預防並減少孩子的行為問題。
  key_facts:
