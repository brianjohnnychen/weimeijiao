  lang: en
  finding:
    en: In interviews with 336 mother-child pairs in China, India, Italy, Kenya, the Philippines and Thailand (children aged 6-17), physical discipline was less strongly linked to adverse child outcomes where it was perceived as more normal, but it was linked to more adverse outcomes regardless of perceived normativeness, and in all countries higher use was associated with more aggression and anxiety.
    zh-hans: 研究访谈了中国、印度、意大利、肯尼亚、菲律宾和泰国的 336 对母亲和孩子（孩子 6 至 17 岁），发现在体罚被视为较普遍、较正常的情况下，体罚与儿童不良结果的关联较弱，但不论被视为多正常，体罚仍与更多不良结果相关；在所有国家中，更多使用体罚都与孩子更多的攻击性和焦虑相关。
    zh-hant: 研究訪談了中國、印度、義大利、肯亞、菲律賓和泰國的 336 對母親與孩子（孩子 6 至 17 歲），發現在體罰被認為較普遍、較正常的情況下，體罰與兒童不良結果的關聯較弱，但不論被認為多正常，體罰仍與較多不良結果有關；在所有國家中，較常使用體罰都與孩子較多的攻擊性和焦慮有關。
