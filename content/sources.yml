- id: wardle-2003
  evidence_level: rct
  authors: Wardle, J., Herrera, M.-L., Cooke, L., & Gibson, E. L.
  year: 2003
  title: "Modifying children's food preferences: the effects of exposure and reward on acceptance of an unfamiliar vegetable"
  venue: European Journal of Clinical Nutrition, 57(2), 341-348
  doi: 10.1038/sj.ejcn.1601541
  pmid: "12571670"
  url: https://doi.org/10.1038/sj.ejcn.1601541
  lang: en
  finding:
    en: In a randomized controlled trial in three London primary schools (49 children with parental consent), eight daily tastes of sweet red pepper over two weeks significantly increased children's liking for it and how much they ate compared with no treatment, while a sticker reward for eating at least one piece gave intermediate results that did not differ significantly from either exposure or control.
    zh-hans: 一项在伦敦三所小学进行的随机对照试验（49 名孩子获得家长同意）发现，两周内每天一次、共 8 次品尝红甜椒，与不做干预相比，显著提高了孩子对红甜椒的喜爱程度和食用量；而吃至少一块就能挑一张贴纸的奖励做法效果居中，与品尝组和对照组都没有显著差异。
    zh-hant: 一項在倫敦三所國小進行的隨機對照試驗（49 名孩子取得家長同意）發現，兩週內每天一次、共 8 次品嚐紅甜椒，與不做介入相比，顯著提高了孩子對紅甜椒的喜愛程度和食用量；而吃至少一塊就能挑一張貼紙的獎勵做法效果居中，與品嚐組和對照組都沒有顯著差異。
  key_facts:
    - '"Using a randomized controlled design, participants were assigned to one of two intervention groups (exposure or reward) or to a no-treatment control condition, for a 2 week period."'
    - '"The study was conducted in three primary schools in London."'
    - '"Parental consent was obtained for 49 out of a possible 72 children."'
    - '"Interventions comprised eight daily sessions during which participants in the exposure group were offered a taste of sweet red pepper and told that they could eat as much as they liked."'
    - '"Participants in the reward group were shown a sheet of cartoon stickers and told that they could choose one of them on condition that they ate at least one piece of the pepper."'
    - '"The exposure-based intervention significantly increased both liking (P=0.006) and consumption (P=0.03) compared with the control group."'
    - '"The outcome of the reward intervention was intermediate and did not differ significantly from the exposure or control conditions."'
  topics:
