  finding:
    en: In 53 families observed at home, parents' praise of their child's effort at 14-38 months predicted the child's incremental motivational framework (believing ability is malleable, attributing success to hard work, enjoying challenges) at 7-8 years, whereas parents' praise of inherent characteristics was not associated with later fixed-ability frameworks.
    zh-hans: 研究在家中观察了 53 个家庭，发现父母在孩子 14 至 38 个月大时对孩子努力的表扬，可以预测孩子 7 至 8 岁时的成长型思维（相信能力可以改变、把成功归因于努力、喜欢挑战）；而父母对孩子天生特质的表扬，与孩子日后的固定型思维并无关联。
    zh-hant: 研究在家中觀察了 53 個家庭，發現父母在孩子 14 至 38 個月大時對孩子努力的讚美，可以預測孩子 7 至 8 歲時的成長型思維（相信能力可以改變、把成功歸因於努力、喜歡挑戰）；而父母對孩子天生特質的讚美，與孩子日後的固定型思維並無關聯。
  key_facts:
