    - "\"exhibited greater left inferior frontal (Broca's area) activation, which significantly explained the relation between children's language exposure and verbal skill\""
    - '"conversational experience impacts neural language processing over and above SES or the sheer quantity of words heard"'
    - "Note: correlational design (home recordings and one fMRI task); the causal wording in the last quote is the authors' interpretation."
