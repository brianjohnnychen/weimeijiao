- id: day-roberts-1983
  evidence_level: experiment
  authors: Day, D. E., & Roberts, M. W.
  year: 1983
  title: An analysis of the physical punishment component of a parent training program
  venue: Journal of Abnormal Child Psychology, 11(1), 141-152
  doi: 10.1007/bf00912184
  pmid: "6853876"
  url: https://doi.org/10.1007/bf00912184
  lang: en
  finding:
    en: In a clinic analog study of 16 noncompliant, clinic-referred preschoolers, a no-spank "barrier" procedure and spanking, used when children escaped from time-out, were equally effective at increasing compliance, so physical punishment did not appear to be a critical component; the authors concluded that enforcing a minimum time-out duration is critical for compliance in that setting.
    zh-hans: 一项在诊所模拟情境中针对 16 名转介来诊、不听从指令的学龄前儿童的研究发现，孩子擅自离开暂停时，用不打的“阻隔”方式和打屁股在提高配合度上同样有效，体罚看来并非关键；作者认为，在该情境中，确保暂停达到最短时长才是让孩子学会配合的关键。
    zh-hant: 一項在診所模擬情境中針對 16 名轉介就診、不聽從指令的學齡前兒童的研究發現，孩子擅自離開暫停時，用不打的「阻隔」方式和打屁股在提高配合度上同樣有效，體罰看來並非關鍵；作者認為，在該情境中，確保暫停達到最短時間才是讓孩子學會配合的關鍵。
  key_facts:
    - '"One component of a well-researched, standardized parent training program is to spank children for escape from time-out."'
    - '"Time-out duration and child disruption at time-out release were balanced across spank and no-spank ("barrier") conditions."'
    - '"Sixteen noncompliant, clinic-referred pre-school children participated."'
    - '"both spank and barrier procedures were equally effective at increasing compliance ratios. Physical punishment did not appear to be a critical component."'
    - '"the enforcement of a minimum time-out duration is critical for compliance acquisition within the analog setting"'
