    zh-hans: 一项系统综述分析了 8 个对 4 至 13 岁破坏性行为问题儿童已证实有效的治疗项目，找出至少一半项目共有的 21 个要素，例如正强化原则、问题解决技能训练、角色扮演和布置家庭作业，并经全国专家调查确认。
    zh-hant: 一項系統性回顧分析了 8 個對 4 至 13 歲干擾行為問題兒童已證實有效的治療方案，找出至少一半方案共有的 21 個要素，例如正增強原則、問題解決技巧訓練、角色扮演和指派家庭作業，並經全國專家調查確認。
  key_facts:
    - '"We identified eight individual treatment programs with established efficacy for children ages 4 to 13 with disruptive behavior problems"'
