  finding:
    en: A meta-analysis of 32 randomized controlled trials of behavioral interventions for children and adolescents with ADHD found that, on probably blinded assessments, they improved parenting (SMD 0.63 for positive and 0.43 for negative parenting) and reduced conduct problems (SMD 0.31), while blinded evidence of fewer ADHD symptoms was lacking.
    zh-hans: 一项纳入 32 项随机对照试验的荟萃分析发现，在可能为盲评的评估中，针对注意缺陷多动障碍（ADHD）儿童青少年的行为干预改善了父母教养（正向教养 SMD 0.63，负面教养 SMD 0.43），也减少了品行问题（SMD 0.31），但缺乏盲评证据显示 ADHD 症状减少。
    zh-hant: 一項納入 32 項隨機對照試驗的統合分析發現，在可能為盲評的評估中，針對注意力不足過動症（ADHD）兒童青少年的行為介入改善了親職教養（正向教養 SMD 0.63，負面教養 SMD 0.43），也減少了行為規範問題（SMD 0.31），但缺乏盲評證據顯示 ADHD 症狀減少。
  key_facts:
    - '"Thirty-two of 2,057 nonduplicate screened records were analyzed."'
    - '"For assessments made by individuals closest to the treatment setting (usually unblinded), there were significant improvements in parenting quality (standardized mean difference [SMD] for positive parenting 0.68; SMD for negative parenting 0.57), parenting self-concept (SMD 0.37), and child ADHD (SMD 0.35), conduct problems (SMD 0.26), social skills (SMD 0.47), and academic performance (SMD 0.28)."'
    - '"With probably blinded assessments, significant effects persisted for parenting (SMD for positive parenting 0.63; SMD for negative parenting 0.43) and conduct problems (SMD 0.31)."'
    - '"In contrast to the lack of blinded evidence of ADHD symptom decrease, behavioral interventions have positive effects on a range of other outcomes when used with patients with ADHD."'
