- id: larzelere-2010-bmc
  evidence_level: longitudinal
  authors: Larzelere, R. E., Cox, R. B., & Smith, G. L.
  year: 2010
  title: Do nonphysical punishments reduce antisocial behavior more than spanking? a comparison using the strongest previous causal evidence against spanking
  venue: BMC Pediatrics, 10(1), 10
  doi: 10.1186/1471-2431-10-10
  pmid: "20175902"
  url: https://doi.org/10.1186/1471-2431-10-10
  lang: en
  finding:
    en: Re-analyzing data on 785 children aged 6-9 from the 1988 cohort of the US National Longitudinal Survey of Youth, Larzelere and colleagues replicated an apparently adverse effect of spanking on antisocial behavior when using the original study's three-category measure of initial antisocial behavior, found a similar pattern of adverse effects for grounding and psychotherapy and partially for privilege removal and sending children to their room, and found that all of these effects became non-significant after controlling for comprehensive measures of earlier externalizing problems, which they interpret as consistent with residual confounding.
    zh-hans: 作者重新分析了美国全国青年纵向调查 1988 年队列中 785 名 6 至 9 岁儿童的数据：沿用原研究对孩子原有反社会行为的三级测量时，重现了打屁股看似会增加反社会行为的结果，禁足和心理治疗也呈现类似的不良影响模式，取消特权和让孩子回自己房间则部分呈现；但在更全面地控制孩子原有的外化问题后，这些影响全部不再显著，作者认为这与残余混杂的解释相符。
    zh-hant: 作者重新分析美國全國青年縱貫調查 1988 年世代中 785 名 6 至 9 歲兒童的資料：沿用原研究對孩子原有反社會行為的三級測量時，重現了打屁股看似會增加反社會行為的結果，禁足和心理治療也呈現類似的不良影響模式，取消特權和叫孩子回自己房間則部分呈現；但在更全面地控制孩子原有的外化問題後，這些影響全都不再顯著，作者認為這與殘餘干擾的解釋相符。
  key_facts:
