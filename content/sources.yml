  finding:
    en: In a randomized prevention trial with 238 divorcing mothers of sons in grades 1 to 3, a parent-training program reduced observed coercive parenting and prevented a decline in positive parenting; improved parenting was linked with better child adjustment, and the program helped children indirectly, through parenting, rather than directly.
    zh-hans: 在一项针对 238 位正在离婚、儿子读小学一至三年级的母亲的随机预防试验中，家长培训课程减少了观察到的强制性教养行为，并防止了积极教养的减退；教养的改善与孩子适应变好有关，课程对孩子的帮助是通过改善教养间接实现的，而不是直接作用于孩子。
    zh-hant: 在一項針對 238 位正在離婚、兒子就讀國小一至三年級的母親的隨機預防試驗中，親職訓練課程減少了觀察到的強制性教養行為，並防止正向教養減退；教養的改善與孩子適應變好有關，課程對孩子的幫助是透過改善教養間接達成，而不是直接作用在孩子身上。
  key_facts:
