- id: ferguson-2013
  evidence_level: meta-analysis
  authors: Ferguson, C. J.
  year: 2013
  title: "Spanking, corporal punishment and negative long-term outcomes: A meta-analytic review of longitudinal studies"
  venue: Clinical Psychology Review, 33(1), 196-208
  doi: 10.1016/j.cpr.2012.11.002
  pmid: "23274727"
  url: https://doi.org/10.1016/j.cpr.2012.11.002
  lang: en
  finding:
    en: This meta-analysis of longitudinal studies found small but non-trivial simple correlations between spanking or corporal punishment and later externalizing problems, internalizing problems and lower cognitive performance, but once children's earlier levels of each outcome were controlled, links with externalizing and internalizing problems were statistically significant but trivial (partial r of .07 to .10) and the link with cognitive performance was near the threshold of trivial (-.11, corporal punishment only), and the author concludes the impact is minimal.
    zh-hans: 这项针对纵向研究的荟萃分析发现，打屁股或体罚与日后的外化问题、内化问题及较低的认知表现之间存在虽小但不可忽视的简单相关；然而在控制孩子此前在同一指标上的水平后，与外化和内化问题的关联虽有统计显著性，却小到可以忽略（偏相关 .07 至 .10），与认知表现的关联则接近可忽略的门槛（-.11，仅有体罚的数据），作者据此认为其影响极小。
    zh-hant: 這項針對縱貫研究的統合分析發現，打屁股或體罰與日後的外化問題、內化問題及較低的認知表現之間，有雖小但不可忽視的簡單相關；然而在控制孩子先前在同一指標上的程度後，與外化和內化問題的關聯雖達統計顯著，卻小到可以忽略（偏相關 .07 至 .10），與認知表現的關聯則接近可忽略的門檻（-.11，僅有體罰的資料），作者因此認為其影響極小。
  key_facts:
    - '"Spanking and CP correlated .14 and .18 respectively with externalizing problems, .12 and .21 with internalizing problems and -.09 and -.18 with cognitive performance."'
    - '"results were statistically significant but trivial (at or below pr = .10) for externalizing (.07 for spanking, .08 for CP) and internalizing behaviors (.10 for spanking, insufficient studies for CP)"'
    - '"near the threshold of trivial for cognitive performance (-.11 for CP, insufficient studies for spanking)"'
    - '"It is concluded that the impact of spanking and CP on the negative outcomes evaluated here (externalizing, internalizing behaviors and low cognitive performance) are minimal."'
    - '"It is advised that psychologists take a more nuanced approach in discussing the effects of spanking/CP with the general public"'
  side: minority
  topics:
    - physical-punishment
    - development
  accessed: 2026-10-04
