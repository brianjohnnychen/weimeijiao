  finding:
    en: "This review of 52 treatment studies, published by the American Academy of Sleep Medicine, found behavioral interventions effective for bedtime problems and night wakings in infants and young children: 94% of studies reported efficacy, and more than 80% of treated children showed clinically significant improvement lasting 3 to 6 months."
    zh-hans: 这篇由美国睡眠医学会发表、回顾 52 项治疗研究的综述发现，行为干预对婴幼儿的就寝问题和夜醒有效：94% 的研究报告有效，超过 80% 接受干预的孩子出现具有临床意义的改善，并维持 3 至 6 个月。
    zh-hant: 這篇由美國睡眠醫學會發表、回顧 52 項治療研究的文獻回顧發現，行為介入對嬰幼兒的就寢問題和夜醒有效：94% 的研究回報有效，超過 80% 接受介入的孩子出現具有臨床意義的改善，並維持 3 至 6 個月。
  key_facts:
