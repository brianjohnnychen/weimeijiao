- id: reynolds-kelley-1997
  evidence_level: experiment
  authors: Reynolds, L. K., & Kelley, M. L.
  year: 1997
  title: The efficacy of a response cost-based treatment package for managing aggressive behavior in preschoolers
  venue: Behavior Modification, 21(2), 216-230
  doi: 10.1177/01454455970212005
  pmid: "9086867"
  url: https://doi.org/10.1177/01454455970212005
  lang: en
  finding:
    en: In a small classroom study of four aggressive preschoolers, a response cost system (teachers removed a smiley face, with a reprimand, after each aggressive act, and children who kept at least one face chose a reward) substantially decreased aggressive behavior and was highly acceptable to teachers and parents.
    zh-hans: 一项只有 4 名有攻击行为的学龄前儿童的小型课堂研究中，老师采用“扣分”制度：孩子每出现一次攻击行为，就拿走一个笑脸并简短批评，到时段结束时至少还剩一个笑脸的孩子可以挑选奖励。结果攻击行为大幅减少，老师和家长也都很能接受这种做法。
    zh-hant: 一項只有 4 名有攻擊行為的學齡前兒童的小型課堂研究中，老師採用「扣點」制度：孩子每出現一次攻擊行為，就拿走一個笑臉並簡短糾正，到時段結束時至少還剩一個笑臉的孩子可以挑選獎勵。結果攻擊行為大幅減少，老師和家長也都很能接受這種做法。
  key_facts:
    - '"The present study examined the effectiveness of a response cost treatment package for improving the classroom behavior of four aggressive preschoolers."'
    - '"The system required teachers to remove smiley faces contingent on aggressive behavior. Each face loss was accompanied by a reprimand."'
    - '"If the child retained at least one smiley face at the end of the observation period, he was allowed to choose from a list of rewards."'
    - '"the response cost treatment package substantially decreased aggressive behavior and was a highly acceptable classroom treatment to teachers and parents"'
  topics:
    - response-cost
    - aggression
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI candidate lookup (sources workflow run 37142476308): Crossref metadata and abstract (Europe PMC, PMID 9086867) read in full. Classroom setting, teacher-delivered."
