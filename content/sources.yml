  finding:
    en: A meta-analysis of 50 studies found that Incredible Years parent training reduced disruptive child behavior (d = .27 across informants), with larger effects in treatment studies and for children with more severe problems.
    zh-hans: 一项纳入 50 项研究的荟萃分析发现，Incredible Years（不可思议的岁月）家长培训减少了孩子的破坏性行为（各类报告人综合效果量 d = .27），在治疗性研究和问题较严重的孩子中效果更大。
    zh-hant: 一項納入 50 項研究的統合分析發現，Incredible Years（不可思議的歲月）親職訓練減少了孩子的干擾行為（各類報告者綜合效果量 d = .27），在治療性研究和問題較嚴重的孩子中效果較大。
