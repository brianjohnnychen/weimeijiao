- id: bearss-2015
  evidence_level: rct
  authors: Bearss, K., Johnson, C., Smith, T., Lecavalier, L., Swiezy, N., Aman, M., McAdam, D. B., Butter, E., Stillitano, C., Minshawi, N., Sukhodolsky, D. G., Mruzek, D. W., Turner, K., Neal, T., Hallett, V., Mulick, J. A., Green, B., Handen, B., Deng, Y., . . . Scahill, L.
