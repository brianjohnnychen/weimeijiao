- id: tamis-lemonda-2014
  evidence_level: review
  authors: Tamis-LeMonda, C. S., Kuchirko, Y., & Song, L.
  year: 2014
  title: Why Is Infant Language Learning Facilitated by Parental Responsiveness?
  venue: Current Directions in Psychological Science, 23(2), 121-126
  doi: 10.1177/0963721414522813
  url: https://doi.org/10.1177/0963721414522813
  lang: en
  finding:
    en: A review reports that parents' responsiveness to infants' exploratory and communicative behaviors predicts infant word learning, and proposes that responsiveness helps infants understand that language is a tool for sharing intentions and, through its close timing, contingency and multimodal and didactic content, helps them map words to their referents and grow their vocabulary.
    zh-hans: 这篇综述指出，家长对婴儿探索和沟通行为的回应性可以预测婴儿的词汇学习；作者提出，回应能帮助婴儿理解语言是分享意图的工具，而且回应在时间上紧随孩子的行为、与孩子的行为相关联，并带有多感官和教导性的内容，有助于婴儿把词语和所指的事物对应起来，从而扩大词汇量。
    zh-hant: 這篇回顧文章指出，家長對嬰兒探索和溝通行為的回應性可以預測嬰兒的詞彙學習；作者提出，回應能幫助嬰兒理解語言是分享意圖的工具，而且回應在時間上緊接著孩子的行為、與孩子的行為相呼應，並帶有多感官與教導性的內容，有助於嬰兒把字詞和所指的事物連結起來，進而擴充詞彙量。
  key_facts:
    - '"Parents’ responsiveness to infants’ exploratory and communicative behaviors predicts infant word learning during early periods of language development."'
