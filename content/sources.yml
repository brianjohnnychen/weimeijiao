  lang: en
  finding:
    en: "In a randomized trial of 134 youth aged 7-14 with oppositional defiant disorder (ODD), Collaborative & Proactive Solutions (CPS) and Parent Management Training (PMT) both outperformed a waitlist and did not differ from each other: about 50% of youth in each treatment were diagnosis free and much or very much improved after treatment (0% on the waitlist), and gains held at the 6-month follow-up."
    zh-hans: 一项随机对照试验纳入 134 名 7 至 14 岁、患有对立违抗障碍的孩子，发现协作与主动解决方案（CPS）和家长管理培训（PMT）都优于等待名单对照组，两者效果没有差异：治疗结束时，两组各约 50% 的孩子不再符合诊断，并被评为明显或非常明显改善，等待组则为 0%；6 个月随访时疗效仍然保持。
    zh-hant: 一項隨機對照試驗納入 134 名 7 至 14 歲、患有對立反抗症的孩子，發現合作與主動解決方案（CPS）和親職管理訓練（PMT）都優於等待名單對照組，兩者效果沒有差異：治療結束時，兩組各約 50% 的孩子不再符合診斷，並被評為明顯或非常明顯改善，等待組則為 0%；6 個月追蹤時療效仍然維持。
  key_facts:
