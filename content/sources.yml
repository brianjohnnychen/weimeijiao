  lang: en
  finding:
    en: In a nationally representative sample of US secondary school students, a short (under one hour) online growth mindset intervention improved grades among lower-achieving students and increased overall enrollment in advanced mathematics courses, and it changed grades in schools where peer norms aligned with its messages.
    zh-hans: 在一个具有全国代表性的美国中学生样本中，一次不到一小时的在线成长型思维干预提高了成绩较差学生的成绩，也让整体上有更多学生选修高阶数学课程；研究还发现，在同伴规范与干预理念一致的学校里，干预改变了学生的成绩。
