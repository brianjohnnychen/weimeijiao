- id: gershoff-2018-causal
  evidence_level: review
  authors: Gershoff, E. T., Goodman, G. S., Miller-Perrin, C. L., Holden, G. W., Jackson, Y., & Kazdin, A. E.
  year: 2018
  title: The strength of the causal evidence against physical punishment of children and its implications for parents, psychologists, and policymakers
  venue: American Psychologist, 73(5), 626-638
  doi: 10.1037/amp0000327
  pmid: "29999352"
  url: https://doi.org/10.1037/amp0000327
  lang: en
  finding:
    en: Summarizing how far research on physical punishment meets accepted criteria for causal inference, the authors review research showing that physical punishment is linked with the same harms to children as physical abuse and that its links with detrimental outcomes are consistent across cultural, family and neighborhood contexts, and on that basis recommend that parents avoid physical punishment, psychologists advise and advocate against it, and policymakers develop ways to educate the public about its harms and alternatives.
    zh-hans: 作者梳理了体罚研究在多大程度上符合公认的因果推断标准，并回顾研究指出：体罚所关联的儿童伤害与身体虐待相同，且体罚与不良结果的关联在不同文化、家庭和社区环境中都一致；基于这些关联的强度和一致性，作者建议家长避免体罚，心理学家劝导并倡导反对体罚，政策制定者设法让公众了解体罚的危害和替代方法。
    zh-hant: 作者整理了體罰研究在多大程度上符合公認的因果推論標準，並回顧研究指出：體罰所關聯的兒童傷害與身體虐待相同，而且體罰與不良結果的關聯在不同文化、家庭與社區環境中都一致；基於這些關聯的強度與一致性，作者建議家長避免體罰，心理學家勸導並倡議反對體罰，政策制定者設法讓大眾了解體罰的危害與替代方式。
  key_facts:
