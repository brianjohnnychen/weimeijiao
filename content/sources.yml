- id: deci-1999
  evidence_level: meta-analysis
  authors: Deci, E. L., Koestner, R., & Ryan, R. M.
  year: 1999
  title: A meta-analytic review of experiments examining the effects of extrinsic rewards on intrinsic motivation
  venue: Psychological Bulletin, 125(6), 627-668
  doi: 10.1037/0033-2909.125.6.627
  pmid: "10589297"
  url: https://doi.org/10.1037/0033-2909.125.6.627
  lang: en
  finding:
    en: A meta-analysis of 128 studies found that rewards given for engaging in, completing or performing well on a task significantly undermined free-choice intrinsic motivation (d = -0.40, -0.36 and -0.28), as did rewards overall, tangible rewards and expected rewards, while positive feedback enhanced free-choice behavior (d = 0.33) and self-reported interest (d = 0.31); tangible rewards tended to be more detrimental for children than for college students.
    zh-hans: 这项荟萃分析汇总了 128 项研究，发现因参与、完成或表现好而给予的奖励，都会显著削弱自由选择情境下的内在动机（d 分别为 -0.40、-0.36 和 -0.28），整体奖励、物质奖励和事先预期的奖励也是如此；积极反馈则能提升自由选择时的行为投入（d = 0.33）和自评兴趣（d = 0.31）；物质奖励对儿童的负面影响往往比对大学生更大。
    zh-hant: 這項統合分析彙整了 128 項研究，發現因參與、完成或表現良好而給予的獎勵，都會顯著削弱自由選擇情境下的內在動機（d 分別為 -0.40、-0.36 和 -0.28），整體獎勵、實質獎勵和事先預期的獎勵也是如此；正向回饋則能提升自由選擇時的行為投入（d = 0.33）和自評興趣（d = 0.31）；實質獎勵對兒童的負面影響往往比對大學生更大。
  key_facts:
    - '"A meta-analysis of 128 studies examined the effects of extrinsic rewards on intrinsic motivation."'
    - '"engagement-contingent, completion-contingent, and performance-contingent rewards significantly undermined free-choice intrinsic motivation (d = -0.40, -0.36, and -0.28, respectively), as did all rewards, all tangible rewards, and all expected rewards"'
    - '"Positive feedback enhanced both free-choice behavior (d = 0.33) and self-reported interest (d = 0.31)."'
    - '"Tangible rewards tended to be more detrimental for children than college students, and verbal rewards tended to be less enhancing for children than college students."'
    - "Note: Cameron, Banko and Pierce 2001 (same batch) dispute that the negative effects are pervasive; both abstracts report negative effects of expected tangible rewards on interesting tasks and positive effects of verbal rewards."
  ages: experiments with children and college students (ages not otherwise stated; includes adults)
  strength: mixed
  topics:
    - motivation
