- id: donaldson-vollmer-2011
  evidence_level: experiment
  authors: Donaldson, J. M., & Vollmer, T. R.
  year: 2011
  title: An Evaluation and Comparison of Time-Out Procedures With and Without Release Contingencies
  venue: Journal of Applied Behavior Analysis, 44(4), 693-705
  doi: 10.1901/jaba.2011.44-693
  pmid: "22219523"
  url: https://doi.org/10.1901/jaba.2011.44-693
  lang: en
  finding:
    en: In a study of four 3- and 4-year-olds, a fixed-duration time-out and a time-out with a release contingency (the child could not leave until there had been no problem behavior for a set time) were both effective at reducing problem behavior outside time-out, and problem behavior during time-out did not predict problem behavior outside it.
    zh-hans: 一项针对 4 名 3 至 4 岁幼儿的研究发现，固定时长的暂停和附带解除条件的暂停（孩子须在一段时间内没有问题行为才能离开）都能有效减少暂停以外的问题行为，而孩子在暂停期间的问题行为并不能预测暂停以外的问题行为。
    zh-hant: 一項針對 4 名 3 至 4 歲幼兒的研究發現，固定時間的暫停和附帶解除條件的暫停（孩子須在一段時間內沒有問題行為才能離開）都能有效減少暫停以外的問題行為，而孩子在暫停期間的問題行為並不能預測暫停以外的問題行為。
  key_facts:
