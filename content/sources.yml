- id: michelson-2013
  evidence_level: meta-analysis
  authors: Michelson, D., Davenport, C., Dretzke, J., Barlow, J., & Day, C.
  year: 2013
  title: Do Evidence-Based Interventions Work When Tested in the “Real World?” A Systematic Review and Meta-analysis of Parent Management Training for the Treatment of Child Disruptive Behavior
  venue: Clinical Child and Family Psychology Review, 16(1), 18-34
  doi: 10.1007/s10567-013-0128-0
  pmid: "23420407"
  url: https://doi.org/10.1007/s10567-013-0128-0
  lang: en
  finding:
    en: A meta-analysis of 28 randomized controlled trials found a significant overall advantage for parent management training (PMT) over waitlist control for child disruptive behavior, with no clear evidence that delivering it under real-world conditions (non-specialist therapists, clinic-referred children, routine settings and services) reduced its effect.
    zh-hans: 一项纳入 28 项随机对照试验的荟萃分析发现，在改善孩子破坏性行为方面，家长管理训练（PMT）总体上明显优于候补对照组；也没有明确证据表明，在真实世界条件下实施（由非专科治疗师执行、对象为转介来诊的孩子、在常规机构和服务中开展）会削弱其效果。
    zh-hant: 一項納入 28 項隨機對照試驗的統合分析發現，在改善孩子干擾行為方面，親職管理訓練（PMT）整體上明顯優於候補對照組；也沒有明確證據顯示，在真實世界條件下實施（由非專科治療師執行、對象為轉介就診的孩子、在一般機構和服務中進行）會削弱其效果。
  key_facts:
    - '"We identified 28 relevant randomized controlled trials"'
    - '"Meta-analysis revealed a significant overall advantage for PMT compared with waitlist control conditions."'
    - '"Subgroup analyses did not demonstrate significant differences in effect size estimates according to the total number of real-world practice criteria met by studies."'
    - '"There was no clear evidence that conducting PMT in real-world practice contexts is a deterrent to achieving effective child behavior outcomes"'
    - '"relative advantage to "usual care" was not directly examined and the power of the analysis was limited as a result of significant heterogeneity"'
  topics:
    - parenting-programs
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC) read in full."
