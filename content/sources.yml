- id: white-1972
  evidence_level: experiment
  authors: White, G. D., Nielsen, G., & Johnson, S. M.
  year: 1972
  title: Timeout Duration and the Suppression of Deviant Behavior in Children
  venue: Journal of Applied Behavior Analysis, 5(2), 111-120
