  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 21884318) read in full. The title omits the Crossref subtitle field 'Types of parent number talk', which is the article's running head."
- id: ramani-siegler-2008
  evidence_level: experiment
  authors: Ramani, G. B., & Siegler, R. S.
  year: 2008
  title: Promoting Broad and Stable Improvements in Low-Income Children’s Numerical Knowledge Through Playing Number Board Games
  venue: Child Development, 79(2), 375-394
  doi: 10.1111/j.1467-8624.2007.01131.x
  pmid: "18366429"
  url: https://doi.org/10.1111/j.1467-8624.2007.01131.x
  lang: en
  finding:
    en: Low-income preschoolers (mean age 5.4 years) who played a linear number board game for roughly 1 hour improved on numerical magnitude comparison, number line estimation, counting and numeral identification, with gains still present 9 weeks later, while classmates who played the same game with squares varying in color rather than number did not improve on any measure.
    zh-hans: 低收入家庭的学龄前儿童（平均 5.4 岁）玩线性数字棋盘游戏约 1 小时后，在数量大小比较、数轴估计、数数和数字识别四项任务上都有进步，9 周后进步依然存在；而玩同样游戏、但格子以颜色而非数字区分的同班同学，在各项测量上都没有进步。
    zh-hant: 低收入家庭的學齡前兒童（平均 5.4 歲）玩線性數字棋盤遊戲約 1 小時後，在數量大小比較、數線估計、數數和數字辨識四項任務上都有進步，9 週後進步依然存在；而玩同樣遊戲、但格子以顏色而非數字區分的同班同學，在各項測量上都沒有進步。
  key_facts:
    - "\"playing such a game for roughly 1 hr increased low-income preschoolers' (mean age = 5.4 years) proficiency on 4 diverse numerical tasks: numerical magnitude comparison, number line estimation, counting, and numeral identification\""
    - '"The gains remained 9 weeks later."'
    - '"Classmates who played an identical game, except for the squares varying in color rather than number, did not improve on any measure."'
    - '"home experience playing number board games correlated positively with numerical knowledge"'
    - "Note: the abstract gives no sample size."
  ages: low-income preschoolers (mean age = 5.4 years)
  strength: single-study
  topics:
    - numeracy
    - play
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 18366429) read in full."
- id: daucourt-2021
  evidence_level: meta-analysis
  authors: Daucourt, M. C., Napoli, A. R., Quinn, J. M., Wood, S. G., & Hart, S. A.
  year: 2021
  title: "The home math environment and math achievement: A meta-analysis"
  venue: Psychological Bulletin, 147(6), 565-596
  doi: 10.1037/bul0000330
  pmid: "34843299"
  url: https://doi.org/10.1037/bul0000330
  lang: en
  finding:
    en: A preregistered meta-analysis of 64 studies (68 independent samples, 631 effect sizes) found a positive, statistically significant average correlation between the home math environment and children's math achievement (r = .13), which was robust in sensitivity analyses, with large differences between studies.
    zh-hans: 这项预先注册的荟萃分析纳入 64 项研究（68 个独立样本、631 个效应量），发现家庭数学环境与孩子的数学成绩之间存在统计上显著的正相关（平均 r = .13），敏感性分析显示结果稳健，但各研究之间差异很大。
    zh-hant: 這項預先登錄的統合分析納入 64 項研究（68 個獨立樣本、631 個效果量），發現家庭數學環境與孩子的數學成就之間有統計上顯著的正相關（平均 r = .13），敏感度分析顯示結果穩健，但各研究之間差異很大。
  key_facts:
    - '"The home math environment (HME), which includes all math-related activities, attitudes, beliefs, expectations, and utterances in the home"'
    - '"A multilevel correlated effects model using 631 effect sizes from 64 quantitative studies comprising 68 independent samples found a positive, statistically significant average weighted correlation of r = .13 (SE = .02, p < .001)."'
    - '"Our combined sensitivity analyses showed that the present findings were robust and that the sample of studies has evidential value."'
    - "\"no single feature of HME research was driving the large between-study differences found for the association between the HME and children's math achievement\""
    - "Note: correlational; the abstract does not state the children's ages."
  ages: children (ages not stated in the abstract)
  strength: consistent
  topics:
