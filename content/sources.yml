  lang: en
  finding:
    en: "In two experiments with children aged 3 to 9, labeled praise (naming the behavior) showed no advantage over unlabeled praise: only unlabeled praise increased immediate compliance in the first experiment, and in the second, two weeks of labeled praise reduced disruptive behavior about as much as unlabeled praise did."
    zh-hans: 两项针对 3 至 9 岁儿童的实验显示，具体表扬（说出表扬的是哪个行为）并不比笼统表扬更有优势：第一项实验中只有笼统表扬提高了孩子当下的配合度；第二项实验中，持续两周的具体表扬减少了破坏性行为，但幅度与笼统表扬相近。
    zh-hant: 兩項針對 3 至 9 歲兒童的實驗顯示，具體讚美（說出讚美的是哪個行為）並不比籠統讚美更有優勢：第一項實驗中只有籠統讚美提高了孩子當下的配合度；第二項實驗中，持續兩週的具體讚美減少了干擾行為，但幅度與籠統讚美相近。
  key_facts:
