  url: https://doi.org/10.1037/a0021890
  lang: en
  finding:
    en: A meta-analysis of 99 studies (N = 7,669) of leisure-time reading from preschool to university found moderate to strong correlations between print exposure and reading comprehension, technical reading and spelling; print exposure explained 12% of the variance in oral language skills in preschool and kindergarten and 13% in primary school, rising to 34% in college and university.
    zh-hans: 这项荟萃分析汇总了 99 项关于课外阅读的研究（共 7,669 人，从学龄前到大学），发现阅读量与阅读理解、字词解码和拼写之间存在中等到较强的相关；阅读量可以解释学龄前和幼儿园阶段口语能力差异的 12%、小学阶段的 13%，到大学阶段则升至 34%。
    zh-hant: 這項統合分析彙整了 99 項關於休閒閱讀的研究（共 7,669 人，從學齡前到大學），發現閱讀量與閱讀理解、識字解碼和拼字之間有中度到高度的相關；閱讀量可以解釋學齡前與幼兒園階段口語能力變異量的 12%、國小階段的 13%，到大學階段則升至 34%。
  key_facts:
    - '"We meta-analyzed 99 studies (N = 7,669) that focused on leisure time reading of (a) preschoolers and kindergartners, (b) children attending Grades 1-12, and (c) college and university students."'
