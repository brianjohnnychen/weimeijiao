  doi: 10.1097/dbp.0000000000000725
  pmid: "31513092"
- id: morawska-sanders-2011
  evidence_level: review
  authors: Morawska, A., & Sanders, M. R.
  year: 2011
  title: "Parental Use of Time Out Revisited: A Useful or Harmful Parenting Strategy?"
  venue: Journal of Child and Family Studies, 20, 1-8
  doi: 10.1007/s10826-010-9371-x
  url: https://doi.org/10.1007/s10826-010-9371-x
  lang: en
  finding:
    en: This review weighs the criticisms of time out and concludes that its judicious use within parent training programs is justified and beneficial for many children with conduct problems, while setting out what affects its effectiveness and when it should not be used.
    zh-hans: 这篇综述权衡了对暂停法的各种批评，结论是在家长培训课程中审慎使用暂停法是合理的，对许多有品行问题的孩子有益；文中也说明了影响效果的因素和不宜使用的情况。
    zh-hant: 這篇文獻回顧權衡了對暫停法的各種批評，結論是在親職訓練課程中審慎使用暫停法是合理的，對許多有行為規範問題的孩子有益；文中也說明了影響效果的因素和不宜使用的情況。
  key_facts:
    - Examines the controversy over time out as a strategy for reducing disruptive and oppositional behavior in young children.
    - Concludes that judicious use of time out in parent training programs is justified and beneficial for many children with conduct problems.
    - Discusses factors that influence the effectiveness of time out and contraindications for its use.
  topics:
    - time-out
  accessed: 2026-10-04
  verified_via: "link.springer.com/article/10.1007/s10826-010-9371-x (search restricted to Springer/PubMed): title, authors Alina Morawska and Matthew Sanders, Journal of Child and Family Studies 2011, volume 20, pages 1-8, DOI, abstract content. Issue number and PMID were not confirmed."
- id: sanders-2014
  evidence_level: meta-analysis
  authors: Sanders, M. R., Kirby, J. N., Tellegen, C. L., & Day, J. J.
  year: 2014
  title: "The Triple P-Positive Parenting Program: A systematic review and meta-analysis of a multi-level system of parenting support"
  venue: Clinical Psychology Review, 34(4), 337-357
  doi: 10.1016/j.cpr.2014.04.003
  pmid: "24842549"
  url: https://doi.org/10.1016/j.cpr.2014.04.003
  lang: en
  finding:
    en: A meta-analysis of 101 studies with 16,099 families found significant short- and long-term effects of the Triple P system on child and parent outcomes, including a short-term effect of d = 0.473 on children's social, emotional and behavioral outcomes.
    zh-hans: 一项纳入 101 项研究、16,099 个家庭的荟萃分析发现，Triple P（3P 正向教养）体系对孩子和家长的结果都有显著的短期和长期效果，对孩子社交、情绪和行为结果的短期效果量为 d = 0.473。
