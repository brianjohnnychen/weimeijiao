- id: cameron-2001
  evidence_level: meta-analysis
  authors: Cameron, J., Banko, K. M., & Pierce, W. D.
  year: 2001
  title: "Pervasive negative effects of rewards on intrinsic motivation: The myth continues"
  venue: The Behavior Analyst, 24(1), 1-44
  doi: 10.1007/bf03392017
  pmid: "22478353"
  url: https://doi.org/10.1007/bf03392017
  lang: en
  finding:
    en: "A meta-analysis that set out to resolve differences between earlier meta-analyses concluded that rewards are generally not harmful to motivation: rewards for low-interest tasks enhanced free-choice intrinsic motivation and, on high-interest tasks, verbal rewards had positive effects, while negative effects appeared on high-interest tasks when rewards were tangible, expected (offered beforehand) and loosely tied to level of performance."
    zh-hans: 这项荟萃分析旨在调和以往荟萃分析之间的分歧，结果显示奖励总体上不会损害动机：对低兴趣任务给予奖励能提升自由选择情境下的内在动机；在高兴趣任务上，口头奖励有正面效果；而当奖励是物质的、事先承诺的，并且与表现水平关联松散时，高兴趣任务上会出现负面效果。
    zh-hant: 這項統合分析旨在調和過去統合分析之間的分歧，結果顯示獎勵整體而言不會損害動機：對低興趣任務給予獎勵能提升自由選擇情境下的內在動機；在高興趣任務上，口頭獎勵有正面效果；而當獎勵是實質的、事先承諾的，並且與表現水準關聯鬆散時，高興趣任務上會出現負面效果。
  key_facts:
    - '"The purpose of the present article is to resolve differences in previous meta-analytic findings and to provide a meta-analysis of rewards and intrinsic motivation that permits tests of competing theoretical explanations."'
    - '"Our results suggest that in general, rewards are not harmful to motivation to perform a task."'
    - '"Rewards given for low-interest tasks enhance free-choice intrinsic motivation."'
    - '"On high-interest tasks, verbal rewards produce positive effects on free-choice motivation and self-reported task interest."'
    - '"Negative effects are found on high-interest tasks when the rewards are tangible, expected (offered beforehand), and loosely tied to level of performance."'
    - '"When rewards are linked to level of performance, measures of intrinsic motivation increase or do not differ from a nonrewarded control group."'
    - "Note: the abstract gives no number of studies, effect sizes or participant ages; it disputes Deci, Koestner and Ryan 1999 (same batch)."
  ages: not stated in the abstract
  strength: mixed
  topics:
