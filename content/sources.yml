  finding:
    en: A Cochrane review of 13 trials (1078 participants) found that behavioral and cognitive-behavioral group-based parenting programs significantly reduced conduct problems in children aged 3 to 12, whether rated by parents (SMD -0.53) or independently assessed (SMD -0.44), and also improved parents' mental health and positive parenting skills.
    zh-hans: 一项纳入 13 项试验（1078 名参与者）的 Cochrane 系统综述发现，行为和认知行为取向的团体家长培训显著减少了 3 至 12 岁孩子的品行问题，无论由家长评定（SMD -0.53）还是独立评估（SMD -0.44）都是如此，同时也改善了家长的心理健康和正向教养技巧。
    zh-hant: 一項納入 13 項試驗（1078 名參與者）的 Cochrane 系統性回顧發現，行為和認知行為取向的團體親職訓練顯著減少了 3 至 12 歲孩子的行為規範問題，無論由家長評定（SMD -0.53）或獨立評估（SMD -0.44）皆是如此，同時也改善了家長的心理健康和正向教養技巧。
  key_facts:
