  lang: en
  finding:
    en: A meta-analysis of 41 studies with child and adult samples found that providing choice enhanced intrinsic motivation, effort, task performance and perceived competence, and that the effect on intrinsic motivation was stronger for children than for adults, when 2 to 4 successive choices were given, and when no rewards were given after the choice.
    zh-hans: 一项涵盖 41 项研究、包含儿童和成人样本的荟萃分析发现，提供选择能提升内在动机、努力程度、任务表现和胜任感；选择对内在动机的促进作用在儿童身上比在成人身上更强，连续给予 2 至 4 次选择时、以及选择之后不给奖励时也更强。
    zh-hant: 一項涵蓋 41 項研究、包含兒童與成人樣本的統合分析發現，提供選擇能提升內在動機、努力程度、任務表現和勝任感；選擇對內在動機的促進效果在兒童身上比在成人身上更強，連續給予 2 至 4 次選擇時、以及選擇之後不給獎勵時也更強。
  key_facts:
    - '"A meta-analysis of 41 studies examined the effect of choice on intrinsic motivation and related outcomes in a variety of settings with both child and adult samples."'
    - '"providing choice enhanced intrinsic motivation, effort, task performance, and perceived competence, among other outcomes"'
    - 'Moderators, effect on intrinsic motivation stronger: "(a) for instructionally irrelevant choices compared to choices made between activities, versions of a task, rewards, and instructionally relevant options, (b) when 2 to 4 successive choices were given, (c) when rewards were not given after the choice manipulation"'
    - '"(d) when participants given choice were compared to the most controlling forms of control groups, (e) for children compared to adults"'
    - '"(f) for designs that yoked choice and control conditions compared to matched designs in which choice was reduced or designs in which nonyoked, nonmatched controls were used, and (g) when the experiment was conducted in a laboratory embedded in a natural setting"'
  topics:
    - choices
    - motivation
