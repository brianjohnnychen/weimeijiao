  lang: en
  finding:
    en: A meta-analysis of 17 studies (mean child ages 1-8 years) found that guided play had a greater positive effect than direct instruction on early math skills (g = 0.24), shape knowledge (g = 0.63) and task switching (g = 0.40), and than free play on spatial vocabulary (g = 0.93), but no differences were identified for other key outcomes.
    zh-hans: 这项荟萃分析纳入 17 项研究（儿童平均年龄 1 至 8 岁），发现与直接教学相比，引导式游戏对早期数学能力（g = 0.24）、形状知识（g = 0.63）和任务转换（g = 0.40）的正面效果更大；与自由游戏相比，对空间词汇的效果更大（g = 0.93）；其他主要结果则未发现差异。
    zh-hant: 這項統合分析納入 17 項研究（兒童平均年齡 1 至 8 歲），發現與直接教學相比，引導式遊戲對早期數學能力（g = 0.24）、形狀知識（g = 0.63）和任務轉換（g = 0.40）的正面效果較大；與自由遊戲相比，對空間詞彙的效果較大（g = 0.93）；其他主要結果則未發現差異。
  key_facts:
