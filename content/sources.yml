  url: https://doi.org/10.1016/j.amepre.2008.06.031
  lang: en
  finding:
    en: In an anonymous telephone survey of a representative sample of mothers in North and South Carolina, mothers who reported that their child was spanked were 2.7 times more likely to report physical abuse, more frequent spanking in the past year was also associated with higher odds of abuse (OR 1.03), and mothers who reported spanking with an object had markedly higher odds of reporting abuse (OR 8.9).
    zh-hans: 在北卡罗来纳州和南卡罗来纳州一项针对母亲的代表性匿名电话调查中，表示孩子被打过屁股的母亲，在调查中报告身体虐待的可能性是未表示打屁股的母亲的 2.7 倍；过去一年打屁股越频繁，报告虐待的比值也越高（比值比 1.03）；表示曾用物品打孩子的母亲，报告虐待的比值明显更高（比值比 8.9）。
    zh-hant: 在北卡羅來納州與南卡羅來納州一項針對母親、具代表性的匿名電話調查中，表示孩子被打過屁股的母親，在調查中回報身體虐待的可能性，是未表示打屁股的母親的 2.7 倍；過去一年打屁股越頻繁，回報虐待的勝算也越高（勝算比 1.03）；表示曾用物品打孩子的母親，回報虐待的勝算明顯更高（勝算比 8.9）。
