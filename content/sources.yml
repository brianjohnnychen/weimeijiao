    - '"links between physical punishment and detrimental outcomes for children are consistent across cultural, family, and neighborhood contexts"'
    - '"parents should avoid physical punishment, psychologists should advise and advocate against it, and policymakers should develop means of educating the public about the harms of and alternatives to physical punishment"'
