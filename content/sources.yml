  finding:
    en: Two meta-analyses, one of individual data from 13 European Incredible Years trials (1,696 children aged 2 to 11) and one of 156 trials of parenting programs (13,378 children), found no evidence that starting earlier in childhood made parenting programs more effective for disruptive behavior.
    zh-hans: 两项荟萃分析，一项汇总了欧洲 13 项“不可思议的岁月”（Incredible Years）试验中 1,696 名 2 至 11 岁儿童的个体数据，另一项纳入 156 项家长课程试验（13,378 名儿童），都没有发现越早开始家长课程、改善孩子破坏性行为的效果就越好的证据。
    zh-hant: 兩項統合分析，一項彙整了歐洲 13 項「不可思議的歲月」（Incredible Years）試驗中 1,696 名 2 至 11 歲兒童的個別資料，另一項納入 156 項親職課程試驗（13,378 名兒童），都沒有發現越早開始親職課程、改善孩子干擾行為的效果就越好的證據。
