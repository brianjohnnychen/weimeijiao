- id: diamond-lee-2011
  evidence_level: review
  authors: Diamond, A., & Lee, K.
  year: 2011
  title: Interventions Shown to Aid Executive Function Development in Children 4 to 12 Years Old
  venue: Science, 333(6045), 959-964
  doi: 10.1126/science.1204529
  pmid: "21852486"
  url: https://doi.org/10.1126/science.1204529
  lang: en
  finding:
    en: A review of interventions for children aged 4-12 reports that diverse activities, including computerized training, noncomputerized games, aerobics, martial arts, yoga, mindfulness and school curricula, have improved executive functions, that all successful programs involve repeated practice with progressively increasing challenge, and that children with worse executive functions benefit most.
    zh-hans: 这篇综述梳理了针对 4 至 12 岁儿童的干预，指出电脑化训练、非电脑游戏、有氧运动、武术、瑜伽、正念和学校课程等多种活动都能改善执行功能；所有成功的项目都包含反复练习，并逐步提高对执行功能的挑战；执行功能较弱的孩子获益最大。
    zh-hant: 這篇回顧文章整理了針對 4 至 12 歲兒童的介入方案，指出電腦化訓練、非電腦遊戲、有氧運動、武術、瑜珈、正念和學校課程等多種活動都能改善執行功能；所有成功的方案都包含反覆練習，並逐步提高對執行功能的挑戰；執行功能較弱的孩子獲益最多。
  key_facts:
    - "\"Diverse activities have been shown to improve children's executive functions: computerized training, noncomputerized games, aerobics, martial arts, yoga, mindfulness, and school curricula.\""
    - '"All successful programs involve repeated practice and progressively increase the challenge to executive functions."'
    - '"Children with worse executive functions benefit most from these activities"'
    - '"To improve executive functions, focusing narrowly on them may not be as effective as also addressing emotional and social development (as do curricula that improve executive functions) and physical development (shown by positive effects of aerobics, martial arts, and yoga)."'
    - "Note: Takacs and Kassai 2019 (same batch) found no convincing evidence that benefits remain at follow-up and found explicit training effects consistently weaker for nontypically developing children."
