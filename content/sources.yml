  lang: en
  finding:
    en: In two field experiments there was no evidence that labeled praise works better than unlabeled praise, and in the first experiment teaching parents labeled praise did not increase children's immediate compliance while teaching unlabeled praise did.
    zh-hans: 两项现场实验没有发现具体表扬（说明表扬的是什么行为）比笼统表扬更有效的证据；在第一项实验中，教家长具体表扬没有提高孩子当下的配合度，而教笼统表扬则提高了。
    zh-hant: 兩項現場實驗沒有發現具體讚美（說明讚美的是什麼行為）比籠統讚美更有效的證據；在第一項實驗中，教家長具體讚美沒有提高孩子當下的配合度，而教籠統讚美則有提高。
  key_facts:
    - "Experiment 1: 161 children aged 4-8; immediate effects of labeled praise, unlabeled praise and no praise."
    - "Experiment 2: 132 children aged 3-9 with varying levels of disruptive behavior; immediate and two-week effects."
    - In Experiment 1, teaching parents labeled praise did not increase immediate child compliance, whereas teaching them unlabeled praise did.
    - No evidence that labeled praise is superior to unlabeled praise.
