- id: takacs-kassai-2019
  evidence_level: meta-analysis
  authors: Takacs, Z. K., & Kassai, R.
  year: 2019
  title: "The efficacy of different interventions to foster children’s executive function skills: A series of meta-analyses"
  venue: Psychological Bulletin, 145(7), 653-697
  doi: 10.1037/bul0000195
  pmid: "31033315"
  url: https://doi.org/10.1037/bul0000195
  lang: en
  finding:
    en: A series of meta-analyses of 90 experimental studies (100 independent effect sizes, 8,925 children up to 12 years of age) found that executive function skills can be fostered in childhood but no convincing evidence that the benefits remain at follow-up; mindfulness had moderate benefits for typically developing children, self-regulation strategy programs worked best for nontypically developing children, and explicit computerized or noncomputer training had small to moderate effects that were consistently weaker for nontypically developing children.
    zh-hans: 这一系列荟萃分析纳入 90 项实验研究（100 个独立效应量，共 8,925 名 12 岁及以下儿童），发现儿童期的执行功能可以培养，但没有令人信服的证据表明效果能在追踪评估时维持；对一般发展的儿童，正念练习有中等程度的益处；对非典型发展的儿童，学习自我调节策略的项目效果最好；明确针对执行功能任务的电脑或非电脑训练有小到中等的效果，但对非典型发展的儿童一直较弱。
    zh-hant: 這一系列統合分析納入 90 項實驗研究（100 個獨立效果量，共 8,925 名 12 歲及以下兒童），發現兒童期的執行功能可以培養，但沒有令人信服的證據顯示效果能在追蹤評估時維持；對一般發展的兒童，正念練習有中等程度的益處；對非典型發展的兒童，學習自我調節策略的方案效果最好；明確針對執行功能任務的電腦或非電腦訓練有小到中等的效果，但對非典型發展的兒童一直較弱。
  key_facts:
    - "\"we included experimental studies aiming to enhance children's (up to 12 years of age) executive functioning with neurodevelopmental tests as outcome measures\""
    - '"The results of 100 independent effect sizes in 90 studies including data of 8,925 children confirmed that it is possible to foster these skills in childhood"'
    - '"We did not find convincing evidence, however, for the benefits to remain on follow-up assessment."'
    - '"For typically developing children we found evidence for the moderate beneficial effects of mindfulness practices."'
    - '"Although small to moderate effects of explicit training with tasks loading on executive function skills in the form of computerized and noncomputer training were found, these effects were consistently weaker for nontypically developing children who might actually be more in need of such training."'
    - "\"the approaches that implicitly foster executive functions are similarly or more effective, and these activities are more enjoyable and can be more easily embedded in children's everyday activities\""
  ages: children up to 12 years of age (extends beyond age 10)
  strength: mixed
  topics:
    - executive-function
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 31033315) read in full."
- id: levine-2010
  evidence_level: longitudinal
  authors: Levine, S. C., Suriyakham, L. W., Rowe, M. L., Huttenlocher, J., & Gunderson, E. A.
  year: 2010
  title: What counts in the development of young children's number knowledge?
  venue: Developmental Psychology, 46(5), 1309-1319
  doi: 10.1037/a0019671
  pmid: "20822240"
  url: https://doi.org/10.1037/a0019671
  lang: en
  finding:
    en: In a longitudinal study of 44 children, the amount of number talk parents produced at 14-30 months varied widely and predicted children's understanding of the cardinal meanings of number words at 46 months, even after controlling for socioeconomic status and other measures of parent and child talk.
    zh-hans: 这项纵向研究追踪了 44 名儿童，发现家长在孩子 14 至 30 个月大时谈论数字的多少差异很大，而且能预测孩子 46 个月大时对数词基数含义的理解（例如知道“四”指 4 个物品的集合），即使控制社会经济地位以及家长和孩子的其他说话情况后依然如此。
    zh-hant: 這項縱貫研究追蹤了 44 名兒童，發現家長在孩子 14 至 30 個月大時談論數字的多寡差異很大，而且能預測孩子 46 個月大時對數詞基數意義的理解（例如知道「四」指的是 4 個物品的集合），即使控制社經地位以及家長和孩子的其他說話情況後依然如此。
  key_facts:
    - '"In a longitudinal study of a diverse sample of 44 preschool children"'
    - "\"Results from 5 visits showed substantial variation in parents' number talk to children between the ages of 14 and 30 months.\""
    - "\"this variation predicted children's knowledge of the cardinal meanings of number words at 46 months, even when socioeconomic status and other measures of parent and child talk were controlled\""
  ages: 44 children; parents' number talk observed at 14-30 months (5 visits); cardinal-number knowledge tested at 46 months
  strength: single-study
  topics:
    - numeracy
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 20822240) read in full."
- id: gunderson-levine-2011
  evidence_level: longitudinal
  authors: Gunderson, E. A., & Levine, S. C.
  year: 2011
  title: "Some types of parent number talk count more than others: relations between parents’ input and children’s cardinal-number knowledge"
  venue: Developmental Science, 14(5), 1021-1032
  doi: 10.1111/j.1467-7687.2011.01050.x
  pmid: "21884318"
  url: https://doi.org/10.1111/j.1467-7687.2011.01050.x
  lang: en
  finding:
    en: Parents' number talk that involved counting or labeling sets of present, visible objects was related to children's later cardinal-number knowledge while other types of number talk were not, and talk about large sets of present objects (4-10 items) was more robustly predictive than talk about smaller sets, even after controlling for socioeconomic status and other parent talk.
    zh-hans: 研究发现，家长谈论数字时，如果是数一数或说出眼前看得见的物品有几个，与孩子日后对基数的理解有关，其他类型的数字谈话则无关；而且谈论眼前较大的物品集合（4 至 10 个）比谈论较小的集合更能稳定地预测孩子的基数理解，即使控制社会经济地位和家长的其他说话情况后依然显著。
    zh-hant: 研究發現，家長談論數字時，如果是數一數或說出眼前看得到的物品有幾個，與孩子日後對基數的理解有關，其他類型的數字談話則無關；而且談論眼前較大的物品集合（4 至 10 個）比談論較小的集合更能穩定預測孩子的基數理解，即使控制社經地位和家長的其他說話情況後依然顯著。
  key_facts:
    - "\"parents' number talk involving counting or labeling sets of present, visible objects is related to children's later cardinal-number knowledge, whereas other types of parent number talk are not\""
    - "\"number talk that refers to large sets of present objects (i.e. sets of size 4 to 10 that fall outside children's ability to track individual objects) is more robustly predictive of children's later cardinal-number knowledge than talk about smaller sets\""
    - "\"The relation between parents' number talk about large sets of present objects and children's cardinal-number knowledge remains significant even when controlling for factors such as parents' socioeconomic status and other measures of parents' number and non-number talk.\""
    - "Note: the abstract gives no sample size or ages and does not say whether the sample is the one in Levine et al. 2010."
  ages: not stated in the abstract (sample size also not given)
  strength: single-study
  topics:
    - numeracy
