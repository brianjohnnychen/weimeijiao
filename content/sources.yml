    en: A meta-analysis of 16 studies comparing dialogic reading, in which the child takes an active part, with typical shared reading found a moderate effect on expressive vocabulary (d = .59), but the effect was substantially smaller when children were older (4-5 years) or at risk for language and literacy impairments.
