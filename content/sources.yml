  finding:
    en: A meta-analysis of 59 studies found that coparenting (cooperation, agreement, conflict and triangulation) was associated with children's adjustment, with generally small effect sizes that remained significant after controlling for individual parenting or marital quality, and coparenting predicted change in child adjustment.
    zh-hans: 一项纳入 59 项研究的荟萃分析发现，共同养育（合作、一致、冲突和三角化）与孩子的适应状况相关，效果量总体较小，但在控制父母各自的教养方式或婚姻质量后仍然显著，而且共同养育能预测孩子适应状况的变化。
