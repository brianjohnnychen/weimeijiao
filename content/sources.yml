- id: wakschlag-2012
  evidence_level: cross-sectional
  authors: Wakschlag, L. S., et al.
  year: 2012
  title: "Defining the developmental parameters of temper loss in early childhood: implications for developmental psychopathology"
  venue: Journal of Child Psychology and Psychiatry, 53(11), 1099-1108
  doi: 10.1111/j.1469-7610.2012.02595.x
  pmid: "22928674"
  url: https://doi.org/10.1111/j.1469-7610.2012.02595.x
  lang: en
  finding:
    en: In a diverse community sample of 1,490 preschoolers, nearly all had tantrums sometimes (83.7%) but only 8.6% had daily tantrums, and clinically concerning temper loss tended to be unpredictable, prolonged and/or destructive rather than a reaction to frustration in expectable situations.
    zh-hans: 在一个包含 1,490 名学龄前儿童的多元社区样本中，几乎所有孩子都会偶尔发脾气（83.7%），但每天发脾气的只有 8.6%；需要临床关注的发脾气往往难以预料、持续时间长或带有破坏性，而不是在可预期的情境中受挫后的反应。
    zh-hant: 在一個包含 1,490 名學齡前兒童的多元社區樣本中，幾乎所有孩子都會偶爾鬧脾氣（83.7%），但每天鬧脾氣的只有 8.6%；需要臨床關注的鬧脾氣往往難以預料、持續很久或帶有破壞性，而不是在可預期的情境中受挫後的反應。
  key_facts:
    - Parent reports on 1,490 preschoolers using the Temper Loss scale of the Multidimensional Assessment of Preschool Disruptive Behavior (MAP-DB).
    - '"Nearly all (83.7%) preschoolers had tantrums sometimes but only 8.6% had daily tantrums."'
    - Normative misbehaviors occurred more frequently than clinically concerning temper loss behaviors; milder behaviors tended to reflect frustration in expectable contexts.
    - Clinically concerning problem indicators were "unpredictable, prolonged, and/or destructive".
    - In multivariate models, Temper Loss was associated with emotional and behavioral problems.
