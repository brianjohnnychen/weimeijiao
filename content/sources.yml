  authors: Lee, S. J., Grogan-Kaylor, A., & Berger, L. M.
  year: 2014
  title: Parental spanking of 1-year-old children and subsequent child protective services involvement
  venue: Child Abuse & Neglect, 38(5), 875-883
  doi: 10.1016/j.chiabu.2014.01.018
  pmid: "24602690"
  url: https://doi.org/10.1016/j.chiabu.2014.01.018
  lang: en
  finding:
    en: In a prospective study of 2,788 urban families, 30% of 1-year-olds had been spanked at least once in the past month, and spanking at age 1 was associated with higher odds of household involvement with child protective services between ages 1 and 5 (adjusted odds ratio 1.36), a 33% greater probability than for children who were not spanked.
    zh-hans: 这项针对 2,788 个城市家庭的前瞻性研究发现，30% 的 1 岁幼儿在过去一个月内至少被打过一次屁股；1 岁时被打屁股，与家庭在孩子 1 至 5 岁期间被儿童保护服务介入的可能性升高相关（调整后比值比 1.36）；与未被打屁股的孩子相比，这一可能性高出 33%。
    zh-hant: 這項針對 2,788 個城市家庭的前瞻性研究發現，30% 的 1 歲幼兒在過去一個月內至少被打過一次屁股；1 歲時被打屁股，與家庭在孩子 1 至 5 歲期間被兒童保護服務介入的可能性升高有關（調整後勝算比 1.36）；與沒有被打屁股的孩子相比，這個可能性高出 33%。
