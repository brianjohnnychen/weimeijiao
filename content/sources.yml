    zh-hant: 這項統合分析彙整了 1998 至 2011 年間在美國和加拿大進行的 41 項暑期閱讀介入方案（幼兒園至八年級），發現參加由教師主導讀寫課程的課堂方案，或以孩子自主讀書為主的居家方案的孩子，在多項閱讀結果上都比對照組有顯著進步；對低收入家庭孩子的益處明顯更大。
