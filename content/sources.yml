    zh-hans: 追踪 10,658 名 2 至 11 岁加拿大儿童的研究发现，大多数孩子在学步期偶尔或很少出现肢体攻击，到青春期前很少或几乎不再出现；约六分之一（16.6%）的孩子则一直维持在较高水平。
