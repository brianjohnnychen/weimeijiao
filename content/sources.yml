- id: baumrind-2002
  evidence_level: review
  authors: Baumrind, D., Larzelere, R. E., & Cowan, P. A.
  year: 2002
  title: "Ordinary physical punishment: Is it harmful? Comment on Gershoff (2002)"
  venue: Psychological Bulletin, 128(4), 580-589
  doi: 10.1037/0033-2909.128.4.580
  pmid: "12081082"
  url: https://doi.org/10.1037/0033-2909.128.4.580
  lang: en
  finding:
    en: In a comment on Gershoff (2002), Baumrind, Larzelere and Cowan argue that biases and confounds in her meta-analyses further limit causal conclusions about the detrimental "effects" of corporal punishment, suggest that it is linked to undesirable child outcomes because it marks inept, harsh parenting, and conclude that, although the harm of physical abuse and other extreme punishments is clear, the evidence Gershoff presented does not justify a blanket injunction against spanking.
    zh-hans: 在这篇评论 Gershoff（2002）的文章中，作者认为她的荟萃分析存在偏差和混杂因素，使关于体罚“不良影响”的因果推论更加受限；他们提出，体罚之所以与儿童的不良结果相关，是因为它反映了不得法的严厉教养，并得出结论：身体虐待和其他极端惩罚的危害固然明确，但 Gershoff 提出的证据不足以支持一概禁止打屁股。
    zh-hant: 在這篇評論 Gershoff（2002）的文章中，作者認為她的統合分析存在偏誤與干擾因素，使關於體罰「不良影響」的因果推論更加受限；他們提出，體罰之所以與兒童的不良結果有關，是因為它反映了不得法的嚴厲教養，並作出結論：身體虐待和其他極端懲罰的危害固然明確，但 Gershoff 提出的證據不足以支持一概禁止打屁股。
  key_facts:
