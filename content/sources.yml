  doi: 10.1146/annurev-psych-113011-143750
  pmid: "23020641"
  url: https://doi.org/10.1146/annurev-psych-113011-143750
  lang: en
  finding:
    en: A review identifies three core executive functions, inhibition (self-control and interference control), working memory and cognitive flexibility, notes that stress, lack of sleep, loneliness or lack of exercise each impair them, and discusses evidence that they can be trained and improved with practice.
    zh-hans: 这篇综述把核心执行功能归纳为三项：抑制控制（自我控制和干扰控制）、工作记忆和认知灵活性；文章指出，压力、睡眠不足、孤独或缺乏运动都会损害执行功能，并讨论了执行功能可以通过练习加以训练和提升的证据。
    zh-hant: 這篇回顧文章把核心執行功能歸納為三項：抑制控制（自我控制與干擾控制）、工作記憶和認知彈性；文章指出，壓力、睡眠不足、孤單或缺乏運動都會損害執行功能，並討論了執行功能可以透過練習加以訓練和提升的證據。
  key_facts:
    - "Core EFs named in the abstract: inhibition (response inhibition, or self-control, and interference control), working memory, and cognitive flexibility."
    - '"stress, lack of sleep, loneliness, or lack of exercise each impair EFs"'
    - '"That EFs are trainable and can be improved with practice is addressed, including diverse methods tried thus far."'
    - "Note: the abstract says the developmental progression of each EF is discussed but gives no details; Takacs and Kassai 2019 (same batch) found no convincing evidence that training benefits remain at follow-up."
