    zh-hans: 美国儿科学会关于虐待性头部创伤的政策声明更新了 2009 年版本，要求儿科医生对虐待性头部创伤的征兆保持警觉，彻底评估疑似个案，必要时会诊专科医生，并积极倡导相关议题。
    zh-hant: 美國兒科醫學會關於虐待性頭部外傷的政策聲明更新了 2009 年版本，要求兒科醫師對虐待性頭部外傷的徵兆保持警覺，徹底評估疑似個案，必要時會診次專科醫師，並積極倡議相關議題。
  key_facts:
