- id: cooper-2006-homework
  evidence_level: systematic-review
  authors: Cooper, H., Robinson, J. C., & Patall, E. A.
  year: 2006
  title: Does Homework Improve Academic Achievement? A Synthesis of Research, 1987-2003
  venue: Review of Educational Research, 76(1), 1-62
  doi: 10.3102/00346543076001001
  url: https://doi.org/10.3102/00346543076001001
  lang: en
  finding:
    en: A synthesis of US homework research from 1987 to 2003 found that all studies had design flaws but that the evidence was generally consistent in showing a positive influence of homework on achievement, and studies reporting simple correlations found a stronger homework-achievement link in Grades 7-12 than in kindergarten to Grade 6 (K-6).
    zh-hans: 一篇汇总 1987 至 2003 年美国作业研究的综述发现，所有研究都有设计缺陷，但证据总体上一致显示作业对学业成绩有正面影响；在报告简单相关的研究中，作业与成绩的关联在 7 至 12 年级比在幼儿园至 6 年级更强。
    zh-hant: 一篇彙整 1987 至 2003 年美國功課研究的文獻回顧發現，所有研究都有設計上的缺陷，但證據整體上一致顯示功課對學業成就有正面影響；在報告簡單相關的研究中，功課與成績的關聯在 7 至 12 年級比在幼兒園至 6 年級更強。
  key_facts:
    - '"In this article, research conducted in the United States since 1987 on the effects of homework is summarized. Studies are grouped into four research designs."'
    - '"The authors found that all studies, regardless of type, had design flaws."'
    - '"both within and across design types, there was generally consistent evidence for a positive influence of homework on achievement"'
    - 'Grade levels: "Studies that reported simple homework-achievement correlations revealed evidence that a stronger correlation existed (a) in Grades 7-12 than in K-6 and (b) when students rather than parents reported time on homework."'
    - '"No strong evidence was found for an association between the homework-achievement link and the outcome measure (grades as opposed to standardized tests) or the subject matter (reading as opposed to math)."'
  topics:
    - homework
    - school
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (OpenAlex) read in full."
- id: patall-2008-homework
  evidence_level: meta-analysis
  authors: Patall, E. A., Cooper, H., & Robinson, J. C.
  year: 2008
  title: "Parent Involvement in Homework: A Research Synthesis"
  venue: Review of Educational Research, 78(4), 1039-1101
  doi: 10.3102/0034654308325185
  url: https://doi.org/10.3102/0034654308325185
  lang: en
  finding:
    en: Meta-analyses found that training parents to be involved in their child's homework resulted in higher homework completion, fewer homework problems and possibly improved academic performance among elementary school children (14 studies), and that parent involvement in homework was positively associated with achievement-related outcomes for elementary and high school students but negatively for middle school students (22 samples from 20 studies).
    zh-hans: 两项荟萃分析发现，培训家长参与孩子的作业，能提高作业完成率、减少作业问题，并可能改善小学生的学业表现（14 项研究）；家长参与作业与学业相关结果的关联，在小学生和高中生中为正，在初中生中则为负（20 项研究中的 22 个样本）。
    zh-hant: 兩項統合分析發現，訓練家長參與孩子的功課，能提高功課完成率、減少功課問題，並可能改善國小學童的學業表現（14 項研究）；家長參與功課與學業相關結果的關聯，在國小和高中學生中為正，在國中學生中則為負（20 項研究中的 22 個樣本）。
  key_facts:
    - 'Experimental studies: "a meta-analysis of 14 studies that manipulated parent training for homework involvement reveals that training parents to be involved in their child’s homework results in (a) higher rates of homework completion, (b) fewer homework problems, and (c) possibly, improved academic performance among elementary school children"'
    - 'Correlational studies, grade levels: "A meta-analysis of 22 samples from 20 studies correlating parent involvement and achievement-related outcomes reveals (a) positive associations for elementary school and high school students but a negative association for middle school students"'
    - '"(b) a stronger association for parent rule-setting compared with other involvement strategies, and (c) a negative association for mathematics achievement but a positive association for verbal achievement outcomes"'
    - '"the type of parent involvement changes as children move through the school grades"'
  topics:
    - homework
    - school
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (OpenAlex) read in full."
- id: hill-tyson-2009
  evidence_level: meta-analysis
  authors: Hill, N. E., & Tyson, D. F.
  year: 2009
  title: "Parental involvement in middle school: A meta-analytic assessment of the strategies that promote achievement"
  venue: Developmental Psychology, 45(3), 740-763
  doi: 10.1037/a0015362
  pmid: "19413429"
  url: https://doi.org/10.1037/a0015362
  lang: en
  finding:
    en: A meta-analysis of 50 studies of parental involvement in middle school found that involvement was positively associated with achievement, with the exception of parental help with homework, and that involvement reflecting academic socialization had the strongest positive association.
    zh-hans: 一项纳入 50 项研究、聚焦初中阶段家长参与的荟萃分析发现，家长参与与学业成绩呈正相关，但家长辅导作业是例外；体现学业社会化的参与方式与成绩的正相关最强。
    zh-hant: 一項納入 50 項研究、聚焦國中階段家長參與的統合分析發現，家長參與和學業成就呈正相關，但家長指導孩子寫功課是例外；體現學業社會化的參與方式與學業成就的正相關最強。
  key_facts:
    - '"The authors conducted a meta-analysis on the existing research on parental involvement in middle school to determine whether and which types of parental involvement are related to achievement."'
    - '"Across 50 studies, parental involvement was positively associated with achievement, with the exception of parental help with homework."'
    - '"Involvement that reflected academic socialization had the strongest positive association with achievement."'
    - '"strategies reflecting academic socialization are most consistent with the developmental stage of early adolescence"'
  topics:
    - homework
    - school
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 19413429) read in full."
- id: barger-2019
  evidence_level: meta-analysis
  authors: Barger, M. M., Kim, E. M., Kuncel, N. R., & Pomerantz, E. M.
  year: 2019
  title: "The relation between parents’ involvement in children’s schooling and children’s adjustment: A meta-analysis"
  venue: Psychological Bulletin, 145(9), 855-890
  doi: 10.1037/bul0000201
  pmid: "31305088"
  url: https://doi.org/10.1037/bul0000201
  lang: en
  finding:
    en: A meta-analysis of 448 studies including 480,830 families found small positive associations (rs = .13 to .23) between parents' naturally occurring involvement in children's schooling and children's achievement, engagement and motivation, the only exception being that parents' homework assistance was negatively associated with achievement (r = -.15) but not with engagement (r = .07) or motivation (r = .05).
    zh-hans: 一项纳入 448 项研究、480,830 个家庭的荟萃分析发现，家长平时参与孩子的学校教育，与孩子的学业成绩、学习投入和学习动机呈小幅正相关（rs = .13 至 .23）；唯一的例外是家长辅导作业与学业成绩呈负相关（r = -.15），但与学习投入（r = .07）和学习动机（r = .05）没有负相关。
    zh-hant: 一項納入 448 項研究、480,830 個家庭的統合分析發現，家長平時參與孩子的學校教育，與孩子的學業成就、學習投入和學習動機呈小幅正相關（rs = .13 至 .23）；唯一的例外是家長指導功課與學業成就呈負相關（r = -.15），但與學習投入（r = .07）和學習動機（r = .05）沒有負相關。
  key_facts:
    - "\"This quantitative synthesis of 448 independent studies including 480,830 families revealed small positive associations (rs = .13 to .23) between parents' naturally occurring involvement in children's schooling and children's academic adjustment (i.e., achievement, engagement, and motivation) that were maintained over time.\""
    - "\"Parents' involvement was also positively related to children's social (r = .12) and emotional adjustment (r = .17) and negatively related to their delinquency (r = -.15), concurrently.\""
    - "\"different types of involvement (e.g., parents' participation in school events and discussion of school with children) were similarly positively associated with such adjustment\""
    - "\"The only exception was that parents' homework assistance was negatively associated with children's achievement (r = -.15), but not engagement (r = .07) or motivation (r = .05).\""
    - "\"There was little variation due to age, ethnicity, or socioeconomic status in the links between different types of involvement and children's academic adjustment.\""
