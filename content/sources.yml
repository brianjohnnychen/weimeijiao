  lang: en
  finding:
    en: In 976 two-parent families, mothers' and fathers' harsh verbal discipline at age 13 predicted increases in adolescents' conduct problems and depressive symptoms between ages 13 and 14, these links were not moderated by parental warmth, and adolescents' misconduct at 13 also predicted increases in parents' harsh verbal discipline.
    zh-hans: 在 976 个双亲家庭中，孩子 13 岁时父母严厉的言语管教，预测孩子在 13 至 14 岁之间品行问题和抑郁症状增加，且这些关联不因父母温暖程度不同而改变；同时，孩子 13 岁时的不当行为也预测父母严厉的言语管教随后增加。
    zh-hant: 在 976 個雙親家庭中，孩子 13 歲時父母嚴厲的言語管教，預測孩子在 13 至 14 歲之間行為規範問題和憂鬱症狀增加，且這些關聯不因父母溫暖程度不同而改變；同時，孩子 13 歲時的不當行為，也預測父母嚴厲的言語管教隨後增加。
