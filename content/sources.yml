- id: wolke-2017
  evidence_level: meta-analysis
  authors: Wolke, D., Bilgin, A., & Samara, M.
  year: 2017
  title: "Systematic Review and Meta-Analysis: Fussing and Crying Durations and Prevalence of Colic in Infants"
  venue: The Journal of Pediatrics, 185, 55-61.e4
  doi: 10.1016/j.jpeds.2017.02.020
  pmid: "28385295"
  url: https://doi.org/10.1016/j.jpeds.2017.02.020
  lang: en
  finding:
    en: Pooling 28 diary studies of 8,690 infants, this meta-analysis found average fussing and crying of 117-133 minutes a day in the first 6 weeks, falling to 68 minutes by 10-12 weeks, with no statistical evidence for a universal crying peak at 6 weeks.
    zh-hans: 这项荟萃分析汇总了 28 项日记研究、8,690 名婴儿，发现出生后头 6 周平均每天哭闹 117 至 133 分钟，到 10 至 12 周降到 68 分钟，没有统计证据支持所有婴儿都在 6 周时达到哭闹高峰。
    zh-hant: 這項統合分析彙整了 28 項日誌研究、8,690 名嬰兒，發現出生後頭 6 週平均每天哭鬧 117 至 133 分鐘，到 10 至 12 週降到 68 分鐘，沒有統計證據支持所有嬰兒都在 6 週時達到哭鬧高峰。
  key_facts:
    - 28 diary studies (33 samples) with 8,690 infants were meta-analyzed, out of 5,687 articles reviewed.
    - Mean fuss/cry duration was stable at 117-133 minutes in the first 6 weeks and dropped to 68 minutes by 10-12 weeks of age.
    - No statistical evidence for a universal crying peak at 6 weeks of age was found.
    - Colic (modified Wessel criteria) was much more frequent in the first 6 weeks (17%-25%) than at 8-9 weeks (11%) or 10-12 weeks (0.6%).
