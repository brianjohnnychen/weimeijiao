  pmid: "25898050"
  url: https://doi.org/10.1001/jama.2015.3150
  lang: en
  finding:
    en: In a 24-week randomized trial of 180 children aged 3 to 7 with autism spectrum disorder and disruptive behavior, parent training reduced parent-reported disruptive behavior more than parent education (Aberrant Behavior Checklist-Irritability down 47.7% versus 31.8%) and a blinded clinician rated more children as positive responders, although the clinical significance of the improvement is unclear.
    zh-hans: 一项为期 24 周、纳入 180 名 3 至 7 岁有破坏性行为的孤独症（自闭症）谱系障碍儿童的随机试验发现，家长培训比家长教育更能减少家长报告的破坏性行为（异常行为量表易怒分量表分别下降 47.7% 和 31.8%），盲评临床医生判定有效的比例也更高，但这种改善的临床意义尚不明确。
    zh-hant: 一項為期 24 週、納入 180 名 3 至 7 歲有干擾行為的自閉症類群障礙兒童的隨機試驗發現，親職訓練比家長衛教更能減少家長回報的干擾行為（異常行為檢核表易怒分量表分別下降 47.7% 和 31.8%），盲評臨床醫師判定有效的比例也較高，但這種改善的臨床意義仍不明確。
  key_facts:
