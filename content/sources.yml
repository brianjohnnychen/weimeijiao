    zh-hant: 研究為 146 名 2 至 36 個月大的嬰幼兒連續 6 個月每月進行一次全天居家錄音，發現在控制社經地位後，18 至 24 個月時大人與孩子一來一往的對話次數，可以解釋 10 年後（9 至 14 歲時）智商、語文理解和詞彙分數變異量的 14% 至 27%；而大人說話的字詞數與語言結果的關聯，在控制社經地位後明顯減弱。
