    - '"in preschool and kindergarten print exposure explained 12% of the variance in oral language skills, in primary school 13%, in middle school 19%, in high school 30%, and in college and university 34%"'
    - '"Interestingly, poor readers also appear to benefit from independent leisure time reading."'
    - "Note: the data are correlational; the \"upward spiral of causality\" is the authors' interpretation."
