  url: https://doi.org/10.1111/cdev.13225
  lang: en
  finding:
    en: A meta-analysis of 19 randomized controlled trials (N = 2,594; mean child ages 1-6 years) found that interventions training parents to share picture books had small effects on children's expressive language (d = 0.41) and receptive language (d = 0.26) and a large effect on caregivers' book-sharing competence (d = 1.01), with minimal impact on child language at lower doses.
    zh-hans: 这项荟萃分析汇总了 19 项随机对照试验（共 2,594 人，儿童平均年龄 1 至 6 岁），发现培训家长与孩子共读绘本的干预，对孩子的表达性语言（d = 0.41）和接受性语言（d = 0.26）有小幅效果，对照顾者共读能力的效果很大（d = 1.01）；干预剂量较低时，对孩子语言的影响微乎其微。
    zh-hant: 這項統合分析彙整了 19 項隨機對照試驗（共 2,594 人，兒童平均年齡 1 至 6 歲），發現訓練家長與孩子共讀繪本的介入方案，對孩子的表達性語言（d = 0.41）和接收性語言（d = 0.26）有小幅效果，對照顧者共讀能力的效果很大（d = 1.01）；介入劑量較低時，對孩子語言的影響微乎其微。
  key_facts:
    - '"We conducted meta-analyses using robust variance estimation modeling on results from 19 RCTs (N total = 2,594; M childage = 1-6 years)."'
    - '"Overall, book-sharing interventions had a small sized effect on both expressive language (d = 0.41) and receptive language (d = 0.26)."'
    - '"They had a large effect on caregiver book-sharing competence (d = 1.01)."'
    - '"The impact of the intervention on child language was moderated by intervention dosage, with lower dosage associated with a minimal impact."'
    - '"Child age and caregiver education level were unrelated to child outcome."'
