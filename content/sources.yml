- id: galloway-2006
  evidence_level: experiment
  authors: Galloway, A. T., Fiorito, L. M., Francis, L. A., & Birch, L. L.
  year: 2006
  title: "‘Finish your soup’: Counterproductive effects of pressuring children to eat on intake and affect"
  venue: Appetite, 46(3), 318-323
  doi: 10.1016/j.appet.2006.01.019
  pmid: "16626838"
  url: https://doi.org/10.1016/j.appet.2006.01.019
  lang: en
  finding:
    en: In a repeated-measures experiment, preschoolers ate significantly more food and made far fewer negative comments about it when they were not pressured to eat than when they were pressured by a request to finish their food.
    zh-hans: 一项重复测量实验发现，与被要求把食物吃完时相比，学龄前孩子在没有被施压进食时吃得显著更多，对食物的负面评论也少得多。
    zh-hant: 一項重複測量實驗發現，與被要求把食物吃完時相比，學齡前孩子在沒有被施壓進食時吃得顯著較多，對食物的負面評論也少得多。
  key_facts:
    - '"The authors examined whether pressuring preschoolers to eat would affect food intake and preferences, using a repeated-measures experimental design."'
    - '"In the experimental condition, children were pressured to eat by a request to finish their food."'
    - '"Children consumed significantly more food when they were not pressured to eat and they made overwhelmingly fewer negative comments."'
    - '"Children who were pressured to eat at home had lower body mass index percentile scores and were less affected by the pressure in the lab setting than children who were not pressured at home."'
