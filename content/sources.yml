  lang: en
  finding:
    en: A meta-analysis of 16 studies with 1,003 children aged 2.5 to 6 with ADHD or ADHD symptoms found moderate parent-rated effects of parent training on ADHD symptoms (g = 0.51), conduct problems (g = 0.4) and negative parenting (g = 0.63), sustained at follow-ups of 3 to 12 months, but on independent assessment only negative parenting improved significantly.
    zh-hans: 一项纳入 16 项研究、1,003 名 2.5 至 6 岁患有注意缺陷多动障碍（ADHD）或有 ADHD 症状儿童的荟萃分析发现，按家长评定，家长培训对 ADHD 症状（g = 0.51）、品行问题（g = 0.4）和负面教养（g = 0.63）有中等效果，并在 3 至 12 个月的追踪中维持，但按独立评估，只有负面教养的改善达到显著。
    zh-hant: 一項納入 16 項研究、1,003 名 2.5 至 6 歲患有注意力不足過動症（ADHD）或有 ADHD 症狀兒童的統合分析發現，依家長評定，親職訓練對 ADHD 症狀（g = 0.51）、行為規範問題（g = 0.4）和負面教養（g = 0.63）有中等效果，並在 3 至 12 個月的追蹤中維持，但依獨立評估，只有負面教養的改善達到顯著。
