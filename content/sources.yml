  finding:
    en: In 146 infants and toddlers (aged 2-36 months) recorded at home for a full day each month for 6 months, the number of adult-child conversational turns at 18-24 months accounted for 14%-27% of the variance in IQ, verbal comprehension and vocabulary scores 10 years later (at ages 9-14) after controlling for socioeconomic status, while the link between adult word counts and language outcomes was considerably weakened by that control.
