  venue: Developmental Psychology, 54(3), 397-409
  doi: 10.1037/dev0000444
  pmid: "29172567"
  url: https://doi.org/10.1037/dev0000444
  lang: en
  finding:
    en: Following the same 53 children, a higher proportion of process praise (praise for effort and strategies) from parents at ages 1-3 predicted better math and reading comprehension achievement in fourth grade via children's incremental motivational frameworks, specifically their belief that intelligence is malleable rather than their preference for challenging tasks.
    zh-hans: 研究继续追踪同样的 53 名孩子，发现孩子 1 至 3 岁时父母的表扬中过程表扬（表扬努力和策略）的比例越高，孩子小学四年级时的数学和阅读理解成绩越好；这一关联经由孩子的成长型思维传递：起作用的是孩子相信智力可以改变的信念，而不是对挑战性任务的偏好。
    zh-hant: 研究持續追蹤同樣的 53 名孩子，發現孩子 1 至 3 歲時父母的讚美中過程讚美（讚美努力與策略）的比例越高，孩子國小四年級時的數學和閱讀理解成績越好；這項關聯是經由孩子的成長型思維傳遞：發揮作用的是孩子相信智力可以改變的信念，而不是對挑戰性任務的偏好。
  key_facts:
    - "\"The current study examines these same children's (n = 53) academic achievement 1 to 2 years later, in 4th grade.\""
