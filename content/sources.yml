  finding:
    en: A meta-analysis of 23 studies (1144 participants) found that Parent-Child Interaction Therapy (PCIT) reduced child externalizing behavior more than control conditions (SMD -0.87), with greater reductions in studies that required skill mastery (SMD -1.09) than in those that did not (SMD -0.51).
    zh-hans: 一项纳入 23 项研究（1144 名参与者）的荟萃分析发现，亲子互动治疗（PCIT）比对照组更能减少孩子的外化行为（SMD -0.87）；要求达到技能熟练标准的研究，减少幅度（SMD -1.09）大于没有这项要求的研究（SMD -0.51）。
    zh-hant: 一項納入 23 項研究（1144 名參與者）的統合分析發現，親子互動治療（PCIT）比對照組更能減少孩子的外化行為（SMD -0.87）；要求達到技巧熟練標準的研究，減少幅度（SMD -1.09）大於沒有這項要求的研究（SMD -0.51）。
  key_facts:
    - '"We included 23 studies (1144 participants)."'
