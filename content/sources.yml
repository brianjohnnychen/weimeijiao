- id: belden-2008
  evidence_level: cross-sectional
  authors: Belden, A. C., Thomson, N. R., & Luby, J. L.
  year: 2008
  title: "Temper Tantrums in Healthy Versus Depressed and Disruptive Preschoolers: Defining Tantrum Behaviors Associated with Clinical Problems"
  venue: The Journal of Pediatrics, 152(1)
  url: https://eedp.wustl.edu/app/uploads/2016/07/Belden-Thomson-Luby-Temper-tantrums-in-healthy-vs-depressed-2008.pdf
  lang: en
  finding:
    en: Among 279 preschoolers aged 3 to 6, tantrums involving violence, self-harm or aggression toward people and objects, and tantrums at school or daycare, were more typical of children with disruptive or depressive disorders than of healthy children.
    zh-hans: 在 279 名 3 至 6 岁的学龄前儿童中，发脾气时出现暴力、自伤或攻击他人和物品，以及在幼儿园或托育机构发脾气，较常见于有破坏性行为障碍或抑郁障碍的孩子，而非健康的孩子。
    zh-hant: 在 279 名 3 至 6 歲的學齡前兒童中，鬧脾氣時出現暴力、自傷或攻擊他人和物品，以及在學校或托育機構鬧脾氣，較常見於有干擾行為障礙或憂鬱症的孩子，而非健康的孩子。
  key_facts:
    - Caregivers of 279 children aged 3 to 6 completed the Preschool-Age Psychiatric Assessment; children were grouped as healthy, depressed only, disruptive only, or comorbid depressed and disruptive.
    - Disruptive preschoolers showed violence during tantrums significantly more often than depressed and healthy preschoolers, and had significantly more tantrums at school or daycare.
    - Depressed preschoolers were more aggressive toward objects and other people than healthy children, and showed significantly more self-harmful tantrum behaviors than healthy and disruptive children.
