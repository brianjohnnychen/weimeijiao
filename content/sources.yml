  finding:
    en: A Cochrane review of 22 randomized and two quasi-randomized trials involving 3161 parents of young children (maximum mean age 3 years 11 months) found evidence that group-based behavioral, cognitive-behavioral or videotape-modeling parenting programs reduce children's overall emotional and behavioral problems.
    zh-hans: 一项 Cochrane 系统综述纳入 22 项随机对照试验和 2 项准随机对照试验，共 3161 位幼儿家长（孩子平均年龄最大为 3 岁 11 个月），发现团体形式的行为、认知行为或录像示范家长课程能减少孩子整体的情绪和行为问题。
