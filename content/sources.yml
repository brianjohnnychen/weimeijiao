  lang: en
  finding:
    en: A systematic review of 67 studies of school-aged children and adolescents, published from 1999 to early 2014, found that screen time was adversely associated with sleep, mainly shorter duration and later timing, in 90% of studies, although a causal link was not confirmed.
    zh-hans: 一项系统综述纳入 1999 年至 2014 年初发表的 67 项研究，发现 90% 的研究显示，学龄儿童和青少年的屏幕时间与较差的睡眠结果相关，主要是睡眠时间变短和睡得更晚，但因果关系尚未确认。
    zh-hant: 一篇系統性回顧納入 1999 年至 2014 年初發表的 67 項研究，發現 90% 的研究顯示，學齡兒童與青少年的螢幕時間和較差的睡眠結果有關，主要是睡眠時間變短和睡得較晚，但因果關係尚未確認。
  key_facts:
    - '"We reviewed 67 studies published from 1999 to early 2014."'
    - 'Screens covered: "(e.g., television, computers, video games, and mobile devices)"'
    - '"We found that screen time is adversely associated with sleep outcomes (primarily shortened duration and delayed timing) in 90% of studies."'
    - '"Some of the results varied by type of screen exposure, age of participant, gender, and day of the week."'
    - 'Limitations listed: "1) causal association not confirmed; 2) measurement error (of both screen time exposure and sleep measures); 3) limited data on simultaneous use of multiple screens, characteristics and content of screens used"'
    - '"Youth should be advised to limit or reduce screen time exposure, especially before or during bedtime hours to minimize any harmful effects of screen time on sleep and well-being."'
