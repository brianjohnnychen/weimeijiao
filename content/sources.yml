  year: 2020
  title: Abusive Head Trauma in Infants and Children
  venue: Pediatrics, 145(4), e20200203
  doi: 10.1542/peds.2020-0203
  url: https://doi.org/10.1542/peds.2020-0203
  lang: en
  finding:
    en: The American Academy of Pediatrics policy statement on abusive head trauma updates its 2009 statement and asks pediatricians to stay alert to the signs of abusive head trauma, evaluate suspected cases thoroughly, consult subspecialists when needed, and advocate strongly on the issue.
    zh-hans: 美国儿科学会关于虐待性头部创伤的政策声明更新了 2009 年版本，要求儿科医生对虐待性头部创伤的征兆保持警觉，彻底评估疑似个案，必要时会诊专科医生，并积极倡导相关议题。
    zh-hant: 美國兒科醫學會關於虐待性頭部外傷的政策聲明更新了 2009 年版本，要求兒科醫師對虐待性頭部外傷的徵兆保持警覺，徹底評估疑似個案，必要時會診次專科醫師，並積極倡議相關議題。
  key_facts:
    - Revises the AAP's 2009 policy statement on abusive head trauma to incorporate the growing body of knowledge on the topic.
    - Recommends that pediatric practitioners remain vigilant for the signs and symptoms of abusive head trauma, conduct thorough medical evaluations, consult pediatric medical subspecialists when necessary, and embrace the need for strong advocacy.
    - "\"The role of the pediatric practitioner is not to apportion blame or investigate potential criminal activity but to identify the medical problem, evaluate and treat the child's injuries, and offer honest medical information to parents, families, investigators, and attorneys/judges.\""
    - The AAP article page notes that the statement was reaffirmed in April 2025 with reference and data updates.
