- id: larzelere-2000-review
  evidence_level: review
  authors: Larzelere, R. E.
  year: 2000
  title: "Child outcomes of nonabusive and customary physical punishment by parents: An updated literature review"
  venue: Clinical Child and Family Psychology Review, 3(4), 199-221
  doi: 10.1023/a:1026473020315
  pmid: "11225737"
  url: https://doi.org/10.1023/a:1026473020315
  lang: en
  finding:
    en: This review by a leading proponent reports that all six clinical-sample studies and all three sequential-analysis studies found beneficial outcomes, such as less noncompliance and fighting, mainly when nonabusive spanking backed up milder discipline with 2- to 6-year-olds, while five of eight controlled longitudinal studies found mainly detrimental outcomes, which the author attributes chiefly to overly frequent use and to residual confounding.
    zh-hans: 这篇由主要支持者撰写的综述指出，6 项临床样本研究和 3 项序列分析研究都发现了有益结果（例如不服从和打架减少），主要出现在对 2 至 6 岁孩子把非虐待性的打屁股用作温和管教的后备手段时；而 8 项控制了初始行为问题的纵向研究中，有 5 项主要发现不良结果，作者认为这主要源于使用过于频繁和残余混杂。
    zh-hant: 這篇由主要支持者撰寫的文獻回顧指出，6 項臨床樣本研究和 3 項序列分析研究都發現了有益結果（例如不服從和打架減少），主要出現在對 2 至 6 歲孩子把非虐待性的打屁股當作溫和管教的後備手段時；而 8 項控制了初始行為問題的縱貫研究中，有 5 項主要發現不良結果，作者認為這主要源於使用過於頻繁和殘餘干擾。
  key_facts:
    - '"All six studies that used clinical samples (including four randomized clinical studies) and all three sequential-analysis studies found beneficial outcomes, such as reduced noncompliance and fighting, primarily when nonabusive spanking was used to back up milder disciplinary tactics in 2- to 6-year olds."'
    - '"Five of eight longitudinal studies that controlled for initial child misbehavior found predominantly detrimental outcomes of spanking."'
    - '"those detrimental outcomes were primarily due to overly frequent use of physical punishment"'
    - '"apparently detrimental outcomes have been found for every alternative disciplinary tactic when investigated with similar analyses"'
    - '"Such detrimental associations of frequent use of any disciplinary tactic may be due to residual confounding from initial child misbehavior."'
  topics:
    - physical-punishment
  side: minority
