    - "Low desisting trajectory (31.1%): infrequent physical aggression in toddlerhood and virtually none by pre-adolescence."
    - "Moderate desisting trajectory (52.2%): occasional physical aggression in toddlerhood and infrequent use by pre-adolescence."
    - "High stable trajectory: 16.6% of children."
