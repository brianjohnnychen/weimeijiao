- id: paruthi-2016
  evidence_level: position-statement
  authors: Paruthi, S., et al.
  year: 2016
  title: "Recommended Amount of Sleep for Pediatric Populations: A Consensus Statement of the American Academy of Sleep Medicine"
  venue: Journal of Clinical Sleep Medicine, 12(6), 785-786
  doi: 10.5664/jcsm.5866
  pmid: "27250809"
  url: https://doi.org/10.5664/jcsm.5866
  lang: en
  finding:
    en: The American Academy of Sleep Medicine recommends, per 24 hours and on a regular basis, 12-16 hours of sleep (including naps) for infants 4-12 months, 11-14 hours for children 1-2 years, 10-13 hours for children 3-5 years, and 9-12 hours for children 6-12 years.
    zh-hans: 美国睡眠医学会建议，每 24 小时内规律地睡足：4 至 12 个月婴儿 12 至 16 小时（含小睡），1 至 2 岁 11 至 14 小时，3 至 5 岁 10 至 13 小时，6 至 12 岁 9 至 12 小时。
    zh-hant: 美國睡眠醫學會建議，每 24 小時內規律地睡足：4 至 12 個月嬰兒 12 至 16 小時（含小睡），1 至 2 歲 11 至 14 小時，3 至 5 歲 10 至 13 小時，6 至 12 歲 9 至 12 小時。
  key_facts:
    - "Infants 4 to 12 months: 12 to 16 hours per 24 hours, including naps."
    - "Children 1 to 2 years: 11 to 14 hours per 24 hours, including naps."
    - "Children 3 to 5 years: 10 to 13 hours per 24 hours, including naps."
    - "Children 6 to 12 years: 9 to 12 hours per 24 hours (teenagers 13 to 18: 8 to 10 hours). The age bands start at 4 months."
    - Regularly sleeping the recommended hours is associated with better outcomes including improved attention, behavior, learning, memory, emotional regulation, quality of life, and mental and physical health.
    - Developed by a 13-member AASM panel using a modified RAND Appropriateness Method after reviewing 864 published articles; endorsed by the American Academy of Pediatrics.
  topics:
    - sleep
  accessed: 2026-10-04
  verified_via: "WebSearch results: https://pubmed.ncbi.nlm.nih.gov/27250809/ and https://jcsm.aasm.org/doi/abs/10.5664/jcsm.5866 confirmed title, DOI and journal; result text (including the copy at https://depts.washington.edu/dbpeds/pediatricsleepdurationconsensus.pdf) gave JCSM 2016;12(6):785-786 and the hour ranges; AASM pages (https://aasm.org/?p=2098) and the companion methodology paper (https://pmc.ncbi.nlm.nih.gov/articles/PMC5078711/, JCSM 12(11), from p. 1549) gave the method, the panel, the 864 articles, the outcomes and the AAP endorsement. Shalini Paruthi confirmed as first author; co-authors not shown, so given as et al."
- id: mindell-2009
  evidence_level: rct
  authors: Mindell, J. A., Telofski, L. S., Wiegand, B., & Kurtz, E. S.
  year: 2009
  title: "A Nightly Bedtime Routine: Impact on Sleep in Young Children and Maternal Mood"
  venue: Sleep, 32(5), 599-606
  pmid: "19480226"
  url: https://doi.org/10.1093/sleep/32.5.599
  lang: en
  finding:
    en: In a 3-week randomized study of 405 mothers and their infants or toddlers, starting a consistent nightly bedtime routine improved children's sleep (shorter time to fall asleep, fewer and shorter night wakings) and improved mothers' mood compared with keeping the usual routine.
    zh-hans: 在一项为期 3 周、涉及 405 位母亲及其婴幼儿的随机研究中，与维持原有习惯相比，开始固定的每晚睡前程序改善了孩子的睡眠（入睡更快、夜醒更少更短），也改善了母亲的情绪。
    zh-hant: 在一項為期 3 週、涉及 405 位母親及其嬰幼兒的隨機研究中，與維持原有習慣相比，開始固定的每晚睡前流程改善了孩子的睡眠（入睡更快、夜醒更少更短），也改善了母親的情緒。
  key_facts:
    - 405 mothers with an infant (7-18 months, n = 206) or toddler (18-36 months, n = 199) took part in two age-specific 3-week studies, randomly assigned to a routine or a control group.
    - Week 1 was a baseline with the usual bedtime routine; the routine group then followed a specific bedtime routine in weeks 2 and 3, while controls continued as usual.
    - The routine produced significant reductions in problematic sleep behaviors, with improvements in sleep onset latency and in the number and duration of night wakings; sleep continuity increased.
    - Significantly fewer mothers rated their child's sleep as problematic, and maternal mood significantly improved.
  topics:
    - sleep
    - routines
  accessed: 2026-10-04
