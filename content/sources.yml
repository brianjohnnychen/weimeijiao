- id: gershoff-grogan-kaylor-2016
  evidence_level: meta-analysis
  authors: Gershoff, E. T., & Grogan-Kaylor, A.
  year: 2016
  title: "Spanking and child outcomes: Old controversies and new meta-analyses"
  venue: Journal of Family Psychology, 30(4), 453-469
  doi: 10.1037/fam0000191
  pmid: "27055181"
  url: https://doi.org/10.1037/fam0000191
  lang: en
  finding:
    en: Meta-analyses focused specifically on spanking, covering 111 unique effect sizes representing 160,927 children, found that 13 of 17 mean effect sizes were significantly different from zero, all indicating a link between spanking and increased risk of detrimental child outcomes, and that effect sizes did not substantially differ between spanking and physical abuse or by study design.
    zh-hans: 这组专门针对打屁股的荟萃分析纳入了代表 160,927 名儿童的 111 个效应量，发现 17 个平均效应量中有 13 个与零有显著差异，且都显示打屁股与儿童不良结果的风险升高有关；打屁股与身体虐待的效应量没有实质差异，效应量也不因研究设计特征而有实质差异。
    zh-hant: 這組專門針對打屁股的統合分析納入代表 160,927 名兒童的 111 個效果量，發現 17 個平均效果量中有 13 個與零有顯著差異，而且都顯示打屁股與兒童不良結果的風險升高有關；打屁股與身體虐待的效果量沒有實質差異，效果量也不因研究設計特徵而有實質差異。
  key_facts:
