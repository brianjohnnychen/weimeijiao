  url: https://doi.org/10.1901/jaba.1972.5-111
  lang: en
  finding:
    en: In 20 institutionalized residents with intellectual disabilities, time-out in an isolation room significantly reduced deviant behavior such as aggression, tantrums and self-injury; on average, 15 and 30 minutes produced a 35% decrease with little difference between them, while 1 minute was most effective when it came before the longer durations and less reliable when it came later.
    zh-hans: 在 20 名住在机构中的智力障碍者身上，把他们隔离在暂停室中的暂停法显著减少了攻击、发脾气和自伤等偏差行为；15 分钟和 30 分钟平均减少了 35%，两者差别不大；1 分钟在先于较长时长使用时效果最好，排在后面时效果则不稳定。
    zh-hant: 在 20 名住在教養機構的智能障礙者身上，將他們隔離在暫停室的暫停法顯著減少了攻擊、鬧脾氣和自傷等偏差行為；15 分鐘和 30 分鐘平均減少了 35%，兩者差別不大；1 分鐘在先於較長時間使用時效果最好，排在後面時效果則不穩定。
  key_facts:
    - '"a group of 20 retarded, institutionalized subjects" (1972 wording for intellectual disability; the abstract gives no ages)'
    - '"Each subject received 1, 15, and 30 min of timeout in a design that was counterbalanced in terms of the order in which timeout durations were presented."'
    - '"Displays of deviant behavior-such as aggression, tantrums, and self-destruction-were followed by periods of isolation in a timeout room."'
    - '"On the average, 15 and 30 min produced a 35% decrease in deviant behavior with little difference between the effectiveness of 15 and 30 min."'
    - '"The range of effects in all timeout conditions varied widely."'
    - '"When it preceded the use of longer durations, 1 min was most effective. As it came later in the sequence, its suppressive characteristics became less reliable."'
  topics:
