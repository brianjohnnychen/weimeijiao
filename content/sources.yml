- id: heilmann-2021
  evidence_level: review
  authors: Heilmann, A., Mehay, A., Watt, R. G., Kelly, Y., Durrant, J. E., van Turnhout, J., & Gershoff, E. T.
  year: 2021
  title: "Physical punishment and child outcomes: a narrative review of prospective studies"
  venue: The Lancet, 398(10297), 355-364
  doi: 10.1016/s0140-6736(21)00582-1
  pmid: "34197808"
  url: https://doi.org/10.1016/s0140-6736(21)00582-1
  lang: en
  finding:
    en: This narrative review of 69 prospective longitudinal studies found that physical punishment consistently predicted increases in child behavior problems over time, was not associated with positive outcomes over time, increased the risk of involvement with child protective services and predicted worsening behavior in quasi-experimental studies, with associations robust across child and parent characteristics and some evidence of a dose-response relationship.
    zh-hans: 这篇叙述性综述汇总了 69 项前瞻性纵向研究，发现体罚一致地预测儿童行为问题随时间增加，长期来看与正面结果无关，会增加儿童保护服务介入的风险，在准实验研究中也预测行为随时间恶化；这些关联在不同的儿童和父母特征下都很稳健，并有一些证据显示存在剂量反应关系。
    zh-hant: 這篇敘述性文獻回顧彙整了 69 項前瞻性縱貫研究，發現體罰一致地預測兒童行為問題隨時間增加，長期來看與正向結果無關，會增加兒童保護服務介入的風險，在準實驗研究中也預測行為隨時間惡化；這些關聯在不同的兒童與父母特徵下都很穩健，並有部分證據顯示存在劑量反應關係。
  key_facts:
