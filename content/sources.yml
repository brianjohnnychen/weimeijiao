    - '"undesirable child outcomes are associated with CP because the construct marks inept harsh parenting"'
    - '"although the harmful effects of physical abuse and other extreme punishments are clear, a blanket injunction against spanking is not justified by the evidence presented by Gershoff"'
  side: minority
  topics:
