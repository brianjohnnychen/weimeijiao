  evidence_level: review
  authors: Mindell, J. A., Kuhn, B., Lewin, D. S., Meltzer, L. J., & Sadeh, A.
  year: 2006
  title: Behavioral Treatment of Bedtime Problems and Night Wakings in Infants and Young Children
  venue: Sleep, 29(10), 1263-1276
