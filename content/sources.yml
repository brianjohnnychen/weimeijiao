- id: aap-2016-media
  evidence_level: position-statement
  authors: American Academy of Pediatrics, Council on Communications and Media
  year: 2016
  title: Media and Young Minds
  venue: Pediatrics, 138(5), e20162591
  doi: 10.1542/peds.2016-2591
  url: https://doi.org/10.1542/peds.2016-2591
  lang: en
  finding:
    en: For children younger than 18 months the AAP discouraged screen media other than video-chatting; for 18 to 24 months it advised parents who introduce media to choose high-quality content and use it together with the child; for children older than 2 it advised limiting media to 1 hour or less a day of high-quality programming, shared with a parent.
    zh-hans: 美国儿科学会建议：18 个月以下避免使用视频通话以外的屏幕媒体；18 至 24 个月如果要接触，家长应选择高质量内容并陪孩子一起使用；2 岁以上每天限制在 1 小时以内的高质量节目，并由家长陪同观看。
    zh-hant: 美國兒科醫學會建議：18 個月以下避免使用視訊通話以外的螢幕媒體；18 至 24 個月如果要接觸，家長應選擇高品質內容並陪孩子一起使用；2 歲以上每天限制在 1 小時以內的高品質節目，並由家長陪同觀看。
  key_facts:
    - "Under 18 months: discourage use of screen media 'other than video-chatting'."
    - "18 to 24 months: parents who want to introduce digital media should choose high-quality programs or apps and use them together with the child, because this is how toddlers learn best."
    - "Older than 2 years: limit media to '1 hour or less per day of high-quality programming', with shared parent-child use to promote learning, interaction and limit setting."
    - Screen-free mealtimes and no screens in the hour before bedtime.
    - "Casts parents as media mentors: choosing content, co-viewing and co-using, and helping children apply what they see to the world around them."
  topics:
    - screens
  accessed: 2026-10-04
  verified_via: WebSearch restricted to publications.aap.org, pubmed, aap.org and healthychildren.org returned the AAP article page https://publications.aap.org/pediatrics/article/138/5/e20162591/60503/Media-and-Young-Minds and full-text PDF https://publications.aap.org/pediatrics/article-pdf/doi/10.1542/peds.2016-2591/1061988/peds_20162591.pdf (title, Pediatrics 138(5) e20162591, DOI in the PDF path, the under-18-month, 18-24-month and over-2-years recommendations, screen-free meals and the hour before bed). An unrestricted search confirmed Council on Communications and Media authorship and the November 2016 issue. AAP News summary https://publications.aap.org/aapnews/news/12960/ also returned.
- id: aap-2026-digital-ecosystems
  evidence_level: position-statement
  authors: Munzer, T., Parga-Belinkie, J., Milkovich, L. M., Tomopoulos, S., Ajumobi, T., Cross, C., Gerwin, R., Madigan, S., & American Academy of Pediatrics Council on Communications and Media
  year: 2026
  title: "Digital Ecosystems, Children, and Adolescents: Policy Statement"
  venue: Pediatrics, 157(2), e2025075320
  doi: 10.1542/peds.2025-075320
  pmid: "41556917"
  url: https://doi.org/10.1542/peds.2025-075320
  lang: en
  finding:
    en: The AAP's newest media policy treats television, the internet, social media, video games and interactive assistants as one digital ecosystem and calls for a systems-wide response, including changes to how platforms are designed, alongside guidance for families and clinicians.
    zh-hans: 美国儿科学会最新的媒体政策把电视、互联网、社交媒体、电子游戏和互动式助手视为一个数字生态系统，呼吁整个系统共同应对，包括改变平台的设计方式，同时为家庭和临床人员提供指引。
    zh-hant: 美國兒科醫學會最新的媒體政策把電視、網路、社群媒體、電玩遊戲和互動式助理視為一個數位生態系，呼籲整個系統共同因應，包括改變平台的設計方式，同時為家庭和臨床人員提供指引。
  key_facts:
    - Defines the digital ecosystem as including television, the internet, social media, video games, and interactive assistants; when designed around children's developmental needs it can support learning and well-being.
    - "Framed by a socioecological model: the child's own characteristics, caregivers, the digital ecosystem, and broader societal systems."
    - AAP says most platforms are designed to boost engagement and profit, not to support children's health and development.
    - Recommendations are addressed to families, pediatricians and other clinicians, educators, researchers, industry and policymakers.
    - "Companion technical report: Pediatrics 157(2), e2025075321, DOI 10.1542/peds.2025-075321, PMID 41556931."
  topics:
    - screens
  accessed: 2026-10-04
  verified_via: WebSearch restricted to publications.aap.org and pubmed returned https://pubmed.ncbi.nlm.nih.gov/41556917/ and https://publications.aap.org/pediatrics/article/157/2/e2025075320/206129/Digital-Ecosystems-Children-and-Adolescents-Policy (title, authors, council, volume/issue/article number, DOI, 2026-01-20 online date, abstract wording on the digital ecosystem and socioecological model). https://www.healthychildren.org/English/news/Pages/creating-a-child-friendly-digital-world-AAP-releases-new-media-recommendations.aspx confirmed the systems-wide approach, the engagement/profit point and the audiences. https://pubmed.ncbi.nlm.nih.gov/41556931/ confirmed the technical report.
- id: comer-2013
  evidence_level: meta-analysis
  authors: Comer, J. S., Chow, C., Chan, P. T., Cooper-Vince, C., & Wilson, L. A. S.
  year: 2013
  title: "Psychosocial Treatment Efficacy for Disruptive Behavior Problems in Very Young Children: A Meta-Analytic Examination"
  venue: Journal of the American Academy of Child & Adolescent Psychiatry, 52(1), 26-36
  doi: 10.1016/j.jaac.2012.10.001
  pmid: "23265631"
  url: https://doi.org/10.1016/j.jaac.2012.10.001
  lang: en
  finding:
    en: A meta-analysis of 36 controlled trials with 3,042 young children (mean age 4.7 years) found that psychosocial treatments had a large and sustained effect on early disruptive behavior problems (Hedges' g = 0.82), with the largest effects for behavioral treatments (g = 0.88).
    zh-hans: 一项纳入 36 项对照试验、3,042 名幼儿（平均 4.7 岁）的荟萃分析发现，心理社会治疗对幼儿早期的破坏性行为问题有大而持久的效果（Hedges' g = 0.82），其中行为治疗的效果最大（g = 0.88）。
    zh-hant: 一項納入 36 項對照試驗、3,042 名幼兒（平均 4.7 歲）的統合分析發現，心理社會治療對幼兒早期的干擾行為問題有大且持久的效果（Hedges' g = 0.82），其中行為治療的效果最大（g = 0.88）。
  key_facts:
    - '"Thirty-six controlled trials, evaluating 3,042 children, met selection criteria (mean sample age, 4.7 years; 72.0% male; 33.1% minority youth)."'
    - "\"Psychosocial treatments collectively demonstrated a large and sustained effect on early disruptive behavior problems (Hedges' g = 0.82)\""
    - "\"the largest effects associated with behavioral treatments (Hedges' g = 0.88)\""
    - "\"effects were largest for general externalizing problems (Hedges' g = 0.90) and problems of oppositionality and noncompliance (Hedges' g = 0.76), and were weakest, relatively speaking, for problems of impulsivity and hyperactivity (Hedges' g = 0.61)\""
    - '"psychosocial treatments should constitute first-line treatment for early disruptive behavior problems"'
  topics:
    - parenting-programs
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC) read in full. The abstract does not name specific programs (such as PMT or PCIT) or an age cutoff."
- id: lundahl-2006
  evidence_level: meta-analysis
  authors: Lundahl, B., Risser, H. J., & Lovejoy, M. C.
  year: 2006
  title: "A meta-analysis of parent training: Moderators and follow-up effects"
  venue: Clinical Psychology Review, 26(1), 86-104
  doi: 10.1016/j.cpr.2005.07.004
  pmid: "16280191"
  url: https://doi.org/10.1016/j.cpr.2005.07.004
  lang: en
  finding:
    en: A meta-analysis of 63 peer-reviewed studies found small to moderate effects of parent training on disruptive child behavior and on parents' behavior and perceptions right after treatment, and small effects at follow-up for behavioral programs; parent training worked least well for economically disadvantaged families, who benefited significantly more from individual than from group delivery.
    zh-hans: 一项纳入 63 项同行评审研究的荟萃分析发现，家长培训刚结束时，对孩子的破坏性行为以及家长的行为和看法有小到中等的效果，行为取向课程在追踪期的效果较小；经济困难家庭的效果最差，但他们接受一对一培训的获益明显多于团体培训。
    zh-hant: 一項納入 63 項同儕審查研究的統合分析發現，親職訓練剛結束時，對孩子的干擾行為以及家長的行為和看法有小到中等的效果，行為取向課程在追蹤期的效果較小；經濟弱勢家庭的效果最差，但他們接受一對一訓練的獲益明顯多於團體訓練。
  key_facts:
    - '"A meta-analysis of 63 peer-reviewed studies evaluated the ability of parent training programs to modify disruptive child behaviors and parental behavior and perceptions."'
    - '"Effects immediately following treatment for behavioral and nonbehavioral programs were small to moderate."'
    - '"For behavioral programs, follow-up effects were small in magnitude."'
    - '"Parent training was least effective for economically disadvantaged families; importantly, such families benefited significantly more from individually delivered parent training compared to group delivery."'
    - '"Including children in their own therapy, separate from parent training, did not enhance outcomes."'
  topics:
    - parenting-programs
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC) read in full."
