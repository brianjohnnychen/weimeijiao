- id: bean-roberts-1981
  evidence_level: experiment
  authors: Bean, A. W., & Roberts, M. W.
  year: 1981
  title: The effect of time-out release contingencies on changes in child noncompliance
  venue: Journal of Abnormal Child Psychology, 9(1), 95-105
  doi: 10.1007/bf00917860
  pmid: "7217541"
  url: https://doi.org/10.1007/bf00917860
  lang: en
  finding:
    en: In a study of 24 noncompliant, clinic-referred preschoolers, time-out for noncompliance increased compliance both with parent-controlled release (time and behavior requirements, backed by a spanking procedure for premature escape) and with child release (no such requirements), but the gains under child release were judged clinically insignificant.
    zh-hans: 一项针对 24 名转介来诊、不听从指令的学龄前儿童的研究发现，孩子不听从时使用暂停法，无论由家长决定何时结束（有时间和行为要求，孩子提前离开时以打屁股阻止），还是由孩子自行结束（没有这些要求），配合度都有所提高，但孩子自行结束时的改善被认为没有临床意义。
    zh-hant: 一項針對 24 名轉介就診、不聽從指令的學齡前兒童的研究發現，孩子不聽從時使用暫停法，無論由家長決定何時結束（有時間和行為要求，孩子提早離開時以打屁股阻止），或由孩子自行結束（沒有這些要求），配合度都有提高，但孩子自行結束時的改善被認為不具臨床意義。
  key_facts:
