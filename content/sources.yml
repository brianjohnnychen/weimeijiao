  authors: Brummelman, E., Thomaes, S., Overbeek, G., Orobio de Castro, B., van den Hout, M. A., & Bushman, B. J.
  year: 2014
  title: "On feeding those hungry for praise: Person praise backfires in children with low self-esteem"
  venue: "Journal of Experimental Psychology: General, 143(1), 9-14"
  doi: 10.1037/a0031917
  pmid: "23421441"
  url: https://doi.org/10.1037/a0031917
  lang: en
  finding:
    en: In a study of 313 children (mean age 10.4 years), person praise (praise for personal qualities), but not process praise (praise for behavior), predisposed children, especially those with low self-esteem, to feel ashamed after failure; a separate study of 357 adults found that adults tend to give children with low self-esteem more person praise and less process praise.
    zh-hans: 一项针对 313 名儿童（平均 10.4 岁）的研究发现，人格表扬（称赞孩子的个人特质）会让孩子在失败后更容易感到羞耻，过程表扬（称赞孩子的行为）则不会，低自尊的孩子尤其如此；另一项针对 357 名成人的研究发现，成人往往给低自尊的孩子更多人格表扬、更少过程表扬。
    zh-hant: 一項針對 313 名兒童（平均 10.4 歲）的研究發現，人格讚美（稱讚孩子的個人特質）會讓孩子在失敗後更容易感到羞愧，過程讚美（稱讚孩子的行為）則不會，低自尊的孩子尤其如此；另一項針對 357 名成人的研究發現，大人往往給低自尊的孩子較多人格讚美、較少過程讚美。
  key_facts:
    - '"Study 1 (N = 357) showed that adults are inclined to give children with low self-esteem more person praise (i.e., praise for personal qualities) but less process praise (i.e., praise for behavior) than they give children with high self-esteem."'
    - '"Study 2 (N = 313; M(age) = 10.4 years) showed that person praise, but not process praise, predisposes children, especially those with low self-esteem, to feel ashamed following failure."'
    - '"person praise seems to make children attribute failure to the self"'
