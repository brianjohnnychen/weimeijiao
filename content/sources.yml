- id: reyno-mcgrath-2005
  evidence_level: meta-analysis
  authors: Reyno, S. M., & McGrath, P. J.
  year: 2005
  title: Predictors of parent training efficacy for child externalizing behavior problems - a meta-analytic review
  venue: Journal of Child Psychology and Psychiatry, 47(1), 99-111
  doi: 10.1111/j.1469-7610.2005.01544.x
  pmid: "16405646"
  url: https://doi.org/10.1111/j.1469-7610.2005.01544.x
  lang: en
  finding:
    en: A meta-analytic review of parent training studies for child externalizing problems published from 1980 to 2004 found that low family income was the only predictor of treatment response with a large effect size, while low education or occupation, more severe pretreatment child problems and maternal psychopathology had moderate effect sizes.
    zh-hans: 一项针对 1980 至 2004 年间发表、以孩子外化行为问题为对象的家长培训研究所做的荟萃分析发现，家庭低收入是唯一具有大效果量的疗效预测因素；教育程度或职业层级低、孩子治疗前问题较严重以及母亲的精神心理问题，则为中等效果量。
    zh-hant: 一項針對 1980 至 2004 年間發表、以孩子外化行為問題為對象的親職訓練研究所做的統合分析發現，家庭低收入是唯一具有大效果量的療效預測因子；教育程度或職業層級低、孩子治療前問題較嚴重以及母親的精神心理問題，則為中等效果量。
  key_facts:
    - '"A literature review was conducted spanning articles published from 1980 to 2004 of indicated prevention (children with symptoms) and treatment (children with diagnosis) studies."'
    - '"Many of the predictors of treatment response examined in this meta-analysis resulted in moderate standardized effect sizes when study results were subjected to meta-analytic procedures (i.e., low education/occupation, more severe child behavior problems pretreatment, maternal psychopathology)."'
    - '"Only low family income resulted in a large standardized effect size."'
    - '"Predictors of drop-out resulted in standardized effect sizes in the small or insubstantial range."'
    - '"Response to parent training is often influenced by variables not directly involving the child, with socioeconomic status and maternal mental health being particularly salient factors."'
  topics:
    - parenting-programs
