  lang: en
  finding:
    en: Among 292 mothers and their children aged 8-12 in China, India, Italy, Kenya, the Philippines and Thailand, mothers' use of corporal punishment, expressing disappointment and yelling were significantly related to more child aggression symptoms, while giving a time-out, corporal punishment, expressing disappointment and shaming were significantly related to more child anxiety symptoms, with some moderation by children's perceptions of how normal the techniques were.
    zh-hans: 在中国、印度、意大利、肯尼亚、菲律宾和泰国的 292 名母亲及其 8 至 12 岁孩子中，母亲使用体罚、表达失望和吼叫与孩子更多的攻击症状显著相关，而使用暂停法、体罚、表达失望和羞辱则与孩子更多的焦虑症状显著相关；孩子对这些做法是否普遍正常的看法，对部分关联有调节作用。
    zh-hant: 在中國、印度、義大利、肯亞、菲律賓和泰國的 292 位母親及其 8 至 12 歲孩子中，母親使用體罰、表達失望和吼叫，與孩子較多的攻擊症狀顯著相關；使用暫停法、體罰、表達失望和羞辱，則與孩子較多的焦慮症狀顯著相關；孩子對這些做法是否普遍正常的看法，對部分關聯有調節作用。
