  finding:
    en: Two meta-analyses found that both the relationship between students' growth mindsets and academic achievement (k = 273, N = 365,915) and the effect of mindset interventions on achievement (k = 43, N = 57,155) were weak overall, although some results suggested that students with low socioeconomic status or who are academically at risk might benefit from mindset interventions.
    zh-hans: 两项荟萃分析发现，学生的成长型思维与学业成绩之间的关系（k = 273，N = 365,915），以及思维模式干预对学业成绩的效果（k = 43，N = 57,155），总体上都很弱；不过部分结果显示，社会经济地位较低或有学业失败风险的学生可能会从干预中受益。
    zh-hant: 兩項統合分析發現，學生的成長型思維與學業成就之間的關係（k = 273，N = 365,915），以及思維模式介入對學業成就的效果（k = 43，N = 57,155），整體而言都很弱；不過部分結果顯示，社經地位較低或學業上有落後風險的學生，可能會從介入中受益。
