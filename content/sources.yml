  finding:
    en: In a randomized controlled trial with mothers of newborns (1374 intervention, 1364 control), The Period of PURPLE Crying materials led to higher knowledge about infant crying (69.5 versus 63.3) and the dangers of shaking (84.8 versus 83.5) and more sharing of information about walking away if frustrated and the dangers of shaking, while mothers' reported responses to crying were similar to those of controls.
    zh-hans: 一项针对新生儿母亲的随机对照试验（干预组 1374 人，对照组 1364 人）发现，The Period of PURPLE Crying（紫色哭泣期）教育材料提高了母亲对婴儿哭闹（69.5 比 63.3）和摇晃婴儿危险（84.8 比 83.5）的认识，也让更多母亲向他人分享“受挫时先走开”和摇晃危险的信息，但母亲自述对哭闹的应对方式与对照组相近。
    zh-hant: 一項針對新生兒母親的隨機對照試驗（介入組 1374 人，對照組 1364 人）發現，The Period of PURPLE Crying（紫色哭泣期）衛教材料提高了母親對嬰兒哭鬧（69.5 比 63.3）和搖晃嬰兒危險（84.8 比 83.5）的認識，也讓更多母親向他人分享「感到挫折時先走開」和搖晃危險的資訊，但母親自述對哭鬧的回應方式與對照組相近。
