  title: Association Between Screen Time and Children’s Performance on a Developmental Screening Test
  venue: JAMA Pediatrics, 173(3), 244
  doi: 10.1001/jamapediatrics.2018.5056
  pmid: "30688984"
  url: https://doi.org/10.1001/jamapediatrics.2018.5056
  lang: en
  finding:
    en: In a longitudinal study of 2441 mothers and children in Calgary, Canada, more screen time at 24 and 36 months was significantly associated with poorer performance on a developmental screening test at 36 months (β, -0.06; 95% CI, -0.10 to -0.01) and 60 months (β, -0.08; 95% CI, -0.13 to -0.02), respectively, with screen time and development both reported by mothers.
    zh-hans: 一项在加拿大卡尔加里追踪 2441 位母亲及其孩子的纵向研究发现，孩子 24 个月和 36 个月大时屏幕时间较多，分别与 36 个月（β, -0.06；95% CI, -0.10 至 -0.01）和 60 个月（β, -0.08；95% CI, -0.13 至 -0.02）大时发育筛查测试表现较差显著相关；屏幕时间和发育结果都由母亲报告。
    zh-hant: 一項在加拿大卡加利追蹤 2441 位母親及其孩子的縱貫研究發現，孩子 24 個月和 36 個月大時螢幕時間較多，分別與 36 個月（β, -0.06；95% CI, -0.10 至 -0.01）和 60 個月（β, -0.08；95% CI, -0.13 至 -0.02）大時發展篩檢測驗表現較差顯著相關；螢幕時間和發展結果都由母親填報。
  key_facts:
    - '"This longitudinal cohort study used a 3-wave, cross-lagged panel model in 2441 mothers and children in Calgary, Alberta, Canada, drawn from the All Our Families study."'
    - '"Data were available when children were aged 24, 36, and 60 months."'
    - "\"children's screen-time behavior (total hours per week) and developmental outcomes (Ages and Stages Questionnaire, Third Edition) were assessed via maternal report\""
    - '"higher levels of screen time at 24 and 36 months were significantly associated with poorer performance on developmental screening tests at 36 months (β, -0.06; 95% CI, -0.10 to -0.01) and 60 months (β, -0.08; 95% CI, -0.13 to -0.02), respectively"'
    - '"These within-person (time-varying) associations statistically controlled for between-person (stable) differences."'
    - '"Recommendations include encouraging family media plans, as well as managing screen time, to offset the potential consequences of excess use."'
  topics:
