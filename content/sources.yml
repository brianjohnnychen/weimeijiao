  finding:
    en: In a randomized trial with mothers of 120 term and 144 very low birth weight infants, a 10-home-visit program teaching responsive behaviors increased mothers' responsiveness more than a comparison program across assessments from 6 to 13 months, and the increased responsiveness facilitated greater growth in infants' social, emotional, communication and cognitive competence.
    zh-hans: 一项随机试验纳入 120 名足月儿和 144 名极低出生体重儿的母亲，通过 10 次家访教导回应式育儿行为，结果母亲在孩子 6 至 13 个月期间的回应性比对照组提高得更多，而回应性的提升促进了婴儿社交、情绪、沟通和认知能力的更大发展。
    zh-hant: 一項隨機試驗納入 120 名足月兒和 144 名極低出生體重兒的母親，透過 10 次家訪教導回應式教養行為，結果母親在孩子 6 至 13 個月期間的回應性比對照組提升更多，而回應性的提升促進了嬰兒在社交、情緒、溝通和認知能力上更大的成長。
