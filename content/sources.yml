  finding:
    en: In a clinical report, the American Academy of Pediatrics states that research shows developmentally appropriate play with parents and peers is a singular opportunity to promote the social-emotional, cognitive, language and self-regulation skills that build executive function, gives pediatricians the information they need to write a prescription for play at well visits, and says pediatricians can play an important role in emphasizing a balanced early-childhood curriculum that includes playful learning.
    zh-hans: 美国儿科学会在一份临床报告中指出，研究表明，与父母和同伴进行适龄的游戏，是促进社会情绪、认知、语言和自我调节能力的独特机会，而这些能力是执行功能的基础；报告为儿科医生在儿童健康检查时开出“游戏处方”提供所需信息，并指出儿科医生可以在倡导包含游戏化学习的均衡幼教课程方面发挥重要作用。
    zh-hant: 美國兒科醫學會在一份臨床報告中指出，研究顯示，與父母和同儕進行適齡的遊戲，是促進社會情緒、認知、語言和自我調節能力的獨特機會，而這些能力是執行功能的基礎；報告提供兒科醫師在兒童健康檢查時開立「遊戲處方」所需的資訊，並指出兒科醫師可以在倡導納入遊戲化學習的均衡幼教課程上扮演重要角色。
