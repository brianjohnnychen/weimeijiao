- id: talwar-lee-2008
  evidence_level: cross-sectional
  authors: Talwar, V., & Lee, K.
  year: 2008
  title: Social and Cognitive Correlates of Children’s Lying Behavior
  venue: Child Development, 79(4), 866-881
  doi: 10.1111/j.1467-8624.2008.01164.x
  pmid: "18717895"
  url: https://doi.org/10.1111/j.1467-8624.2008.01164.x
  lang: en
  finding:
    en: When children aged 3-8 were told not to peek at a toy, most peeked and later lied about it; their first denials were related to first-order belief understanding (understanding what another person believes) and inhibitory control, and their ability to keep the lie going was related to second-order belief understanding.
    zh-hans: 研究让 3 至 8 岁的孩子不要偷看一个玩具，大多数孩子偷看了，事后还撒谎否认；孩子最初的否认与一阶信念理解（理解别人怎么想）和抑制控制有关，能否把谎圆下去则与二阶信念理解有关。
    zh-hant: 研究要求 3 至 8 歲的孩子不要偷看一個玩具，多數孩子偷看了，事後還說謊否認；孩子一開始的否認與一階信念理解（理解別人怎麼想）和抑制控制有關，能否把謊圓下去則與二階信念理解有關。
  key_facts:
    - '"Children (3-8 years) were told not to peek at a toy. Most children peeked and later lied about peeking."'
    - "\"Children's subsequent verbal statements were not always consistent with their initial denial and leaked critical information revealing their deceit.\""
    - "Assessed: \"Children's conceptual moral understanding of lies, executive functioning, and theory-of-mind understanding were also assessed.\""
    - "\"Children's initial false denials were related to their first-order belief understanding and their inhibitory control.\""
    - "\"Children's ability to maintain their lies was related to their second-order belief understanding.\""
    - "\"Children's lying was related to their moral evaluations.\""
  topics:
    - lying
    - development
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 18717895) read in full."
- id: talwar-lee-2011
  evidence_level: experiment
  authors: Talwar, V., & Lee, K.
  year: 2011
  title: "A Punitive Environment Fosters Children’s Dishonesty: A Natural Experiment"
  venue: Child Development, 82(6), 1751-1758
  doi: 10.1111/j.1467-8624.2011.01663.x
  pmid: "22023095"
  url: https://doi.org/10.1111/j.1467-8624.2011.01663.x
  lang: en
  finding:
    en: In a natural experiment with 84 West African 3- and 4-year-olds, most children at a punitive school who peeked at a toy they had been told not to look at lied about it, significantly fewer children at a nonpunitive school did so, and the punitive-school children were better at keeping up the lie under follow-up questions.
    zh-hans: 一项自然实验比较了西非一所惩罚性学校和一所非惩罚性学校的 84 名 3 岁和 4 岁孩子：惩罚性学校里偷看了玩具的孩子大多撒谎否认，非惩罚性学校这样做的孩子则显著更少；面对追问时，惩罚性学校的孩子也更能把谎圆下去。
    zh-hant: 一項自然實驗比較了西非一所懲罰性學校和一所非懲罰性學校的 84 名 3 歲和 4 歲孩子：懲罰性學校裡偷看了玩具的孩子多半說謊否認，非懲罰性學校這樣做的孩子則顯著較少；面對追問時，懲罰性學校的孩子也更能把謊圓下去。
  key_facts:
    - '"The present study compared the lie-telling behavior of 3- and 4-year-old West African children (N = 84) from either a punitive or a nonpunitive school."'
    - '"When the experimenter asked them if they had peeked, the majority of the punitive school peekers lied about peeking at the toy while significantly fewer nonpunitive school children did so."'
    - '"The punitive school children were better able to maintain their deception than nonpunitive school children when answering follow-up questions."'
    - "Authors' conclusion: \"a punitive environment not only fosters increased dishonesty but also children's abilities to lie to conceal their transgressions\""
  topics:
    - lying
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 22023095) read in full."
- id: talwar-2015
  evidence_level: experiment
  authors: Talwar, V., Arruda, C., & Yachison, S.
  year: 2015
  title: The effects of punishment and appeals for honesty on children’s truth-telling behavior
  venue: Journal of Experimental Child Psychology, 130, 209-217
  doi: 10.1016/j.jecp.2014.09.011
  pmid: "25447716"
  url: https://doi.org/10.1016/j.jecp.2014.09.011
  lang: en
  finding:
    en: In an experiment with 372 children aged 4-8, those who heard that the experimenter would be happy if they told the truth were significantly more likely to tell the truth than those who heard no appeal, and those who heard that they would be happy with themselves for telling the truth were significantly less likely to lie when no punishment was expected than when punishment was expected.
    zh-hans: 一项针对 372 名 4 至 8 岁孩子的实验发现，被告知说实话会让实验人员高兴的孩子，比没有听到任何劝说的孩子显著更常说实话；被告知说实话会让自己高兴的孩子，在预期不会受罚时撒谎的可能性，显著低于预期会受罚时。
    zh-hant: 一項針對 372 名 4 至 8 歲孩子的實驗發現，被告知說實話會讓實驗人員高興的孩子，比沒有聽到任何勸說的孩子顯著更常說實話；被告知說實話會讓自己高興的孩子，在預期不會受罰時說謊的可能性，顯著低於預期會受罰時。
  key_facts:
    - "\"This study examined the effectiveness of two types of verbal appeals (external and internal motivators) and expected punishment in 372 children's (4- to 8-year-olds) truth-telling behavior about a transgression.\""
    - '"External appeals to tell the truth emphasized social approval by stating that the experimenter would be happy if the children told the truth."'
    - '"Internal appeals to tell the truth emphasized internal standards of behavior by stating that the children would be happy with themselves if they told the truth."'
    - '"Results indicate that with age children are more likely to lie and maintain their lie during follow-up questioning."'
    - '"Overall, children in the External Appeal conditions told the truth significantly more compared with children in the No Appeal conditions."'
    - '"Children who heard internal appeals with no expected punishment were significantly less likely to lie compared with children who heard internal appeals when there was expected punishment."'
  topics:
    - lying
  accessed: 2026-10-04
  verified_via: "2026-10-04 CI source check (GitHub Actions run 37140330171): Crossref metadata and abstract (Europe PMC, PMID 25447716) read in full."
- id: evans-lee-2013
  evidence_level: cross-sectional
  authors: Evans, A. D., & Lee, K.
  year: 2013
  title: Emergence of lying in very young children
  venue: Developmental Psychology, 49(10), 1958-1963
  doi: 10.1037/a0031409
  pmid: "23294150"
  url: https://doi.org/10.1037/a0031409
  lang: en
  finding:
    en: Among 65 children aged 2-3 who were asked not to peek at a toy, 80% peeked; most 2-year-old peekers confessed, but with increasing age more peekers denied peeking and thus lied, and children's executive functioning skills significantly predicted their tendency to lie after controlling for age.
    zh-hans: 在 65 名被要求不要偷看玩具的 2 至 3 岁孩子中，80% 偷看了；偷看的 2 岁孩子大多诚实承认，但随着年龄增长，否认偷看、也就是撒谎的孩子越来越多；在控制年龄后，执行功能能显著预测孩子撒谎的倾向。
    zh-hant: 在 65 名被要求不要偷看玩具的 2 至 3 歲孩子中，80% 偷看了；偷看的 2 歲孩子多半誠實承認，但隨著年齡增長，否認偷看、也就是說謊的孩子越來越多；在控制年齡後，執行功能能顯著預測孩子說謊的傾向。
  key_facts:
    - '"Sixty-five 2- to 3-year-olds were asked not to peek at a toy when the experimenter was not looking."'
    - '"The majority of children (80%) transgressed and peeked at the toy."'
    - '"most 2-year-old peekers were honest and confessed to their peeking, but with increased age, more peekers denied peeking and thus lied"'
    - "\"most children failed to conceal their lie by pretending to be ignorant of the toy's identity\""
    - "\"after controlling for age, children's executive functioning skills significantly predicted young children's tendency to lie\""
    - 'Background on earlier studies, as stated in the abstract: "from the age of 42 months onward, children become increasingly capable of telling lies in various social situations"'
  topics:
    - lying
    - development
  accessed: 2026-10-04
