    - '"We identified 21 treatment elements that were common to multiple evidence-based treatment programs."'
    - '"These included therapeutic content (e.g., principles of positive reinforcement, problem-solving skills training), treatment techniques (e.g., role-playing, assigning homework), aspects of the working alliance, and other parameters such as treatment duration."'
