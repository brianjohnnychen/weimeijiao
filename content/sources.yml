  url: https://doi.org/10.1080/17470210600823595
  lang: en
  finding:
    en: In two experiments with preschool children learning names for toys, expanding retrieval practice doubled recall while a reward incentive did not significantly improve learning, and, with recall tested after 1 minute, 1 day and 2 days, it produced a very large benefit over elaborative study (d = 1.9), about half from spaced scheduling and half from retrieval practice.
    zh-hans: 两项实验让学龄前儿童学习玩具的名字，发现扩展式提取练习（回忆间隔逐步拉长）使回忆量翻倍，而奖励激励并没有显著提升学习效果；在 1 分钟、1 天和 2 天后的回忆测试中，扩展式提取练习比精细化学习的效果大得多（d = 1.9），其中大约一半来自间隔安排，一半来自提取练习本身。
    zh-hant: 兩項實驗讓學齡前兒童學習玩具的名字，發現擴展式提取練習（回憶間隔逐步拉長）讓回憶量加倍，而獎勵誘因並沒有顯著提升學習效果；在 1 分鐘、1 天和 2 天後的回憶測驗中，擴展式提取練習比精緻化學習的效果大得多（d = 1.9），其中約一半來自間隔安排，一半來自提取練習本身。
  key_facts:
