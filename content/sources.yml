    en: In 36 children aged 4-6 from a range of socioeconomic backgrounds, those who had more conversational turns with adults in home audio recordings showed greater activation in Broca's area (left inferior frontal region) during a story-listening functional MRI task, independent of socioeconomic status, IQ and the number of adult and child utterances alone, and this activation significantly explained the link between their language exposure and verbal skill.
    zh-hans: 研究对 36 名 4 至 6 岁、家庭社会经济背景各异的儿童进行家庭录音，发现与成人对话轮次越多的孩子，在功能性磁共振成像中听故事时，左侧额下回（布洛卡区）的激活越强；这一关联不受社会经济地位、智商以及成人和孩子各自话语数量的影响，而且这种脑区激活能显著解释语言接触与言语能力之间的关系。
    zh-hant: 研究為 36 名 4 至 6 歲、家庭社經背景各異的兒童進行居家錄音，發現與大人一來一往對話次數越多的孩子，在功能性磁振造影中聽故事時，左側額下迴（布洛卡區）的活化越強；這項關聯不受社經地位、智商以及大人和孩子各自說話句數的影響，而且這種腦區活化能顯著解釋語言接觸與語文能力之間的關係。
  key_facts:
