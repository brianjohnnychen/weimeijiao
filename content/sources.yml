    - '"We compared a fixed-duration time-out procedure to a release contingency time-out procedure with 4 young children (3- and 4-year-olds) using a reversal and multielement design."'
    - '"both time-out procedures were effective at reducing problem behavior outside time-out, problem behavior occurred in time-out during both procedures, and problem behavior in time-out was not predictive of problem behavior outside time-out"'
