    en: "In six studies, praise for intelligence had more negative consequences for children's achievement motivation than praise for effort: fifth graders praised for intelligence cared more about performance goals relative to learning goals and, after failure, showed less persistence, less enjoyment, more low-ability attributions and worse performance than children praised for effort."
    zh-hans: 六项研究显示，与表扬努力相比，夸孩子聪明对孩子的成就动机有更多负面影响：被夸聪明的小学五年级学生更看重表现目标而非学习目标，失败后坚持得更少、更不享受任务、更倾向于把失败归因于能力不足，表现也更差。
    zh-hant: 六項研究顯示，與讚美努力相比，誇孩子聰明對孩子的成就動機有更多負面影響：被誇聰明的國小五年級學生更看重表現目標而非學習目標，失敗後較不堅持、較不享受任務、更傾向把失敗歸因於能力不足，表現也較差。
  key_facts:
