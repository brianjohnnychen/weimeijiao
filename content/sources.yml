- id: aap-2018-discipline
  evidence_level: position-statement
  authors: Sege, R. D., Siegel, B. S., Council on Child Abuse and Neglect, & Committee on Psychosocial Aspects of Child and Family Health
  year: 2018
  title: Effective Discipline to Raise Healthy Children
  venue: Pediatrics, 142(6), e20183112
  doi: 10.1542/peds.2018-3112
  pmid: "30397164"
  url: https://doi.org/10.1542/peds.2018-3112
  lang: en
  finding:
    en: The American Academy of Pediatrics advises parents and other adults not to use any corporal punishment, including hitting and spanking, or verbal abuse such as threatening, insulting, humiliating or shaming, stating that such aversive strategies are minimally effective in the short term and not effective in the long term.
    zh-hans: 美国儿科学会建议家长和其他成年人不要使用任何体罚（包括打和打屁股），也不要使用威胁、侮辱、羞辱等言语虐待，并指出这类厌恶性管教方式短期效果很小，长期无效。
    zh-hant: 美國兒科醫學會建議家長和其他成年人不要使用任何體罰（包括打和打屁股），也不要使用威脅、侮辱、羞辱等言語虐待，並指出這類嫌惡式管教方式短期效果很小，長期無效。
  key_facts:
    - '"Aversive disciplinary strategies, including all forms of corporal punishment and yelling at or shaming children, are minimally effective in the short-term and not effective in the long-term."'
    - 'Recommendation: "Parents, other caregivers, and adults interacting with children and adolescents should not use corporal punishment (including hitting and spanking)"; the statement "supports the need for adults to avoid physical punishment and verbal abuse of children."'
    - Corporal punishment is linked to "an increased risk of negative behavioral, cognitive, psychosocial, and emotional outcomes for children"; the AAP adds that harsh verbal abuse is linked to mental health problems in preteens and adolescents.
    - "AAP: striking a child, yelling at or shaming them can elevate stress hormones and lead to changes in the brain's architecture."
    - "Alternatives the AAP recommends: positive reinforcement of appropriate behaviors, limit setting, redirecting, and setting future expectations."
    - Published in the December 2018 issue of Pediatrics; it updated the AAP's 1998 guidance "Guidance for Effective Discipline".
  topics:
    - physical-punishment
    - position-statement
  side: majority
  accessed: 2026-10-04
  verified_via: "WebSearch restricted to AAP and PubMed domains returned the article page https://publications.aap.org/pediatrics/article/142/6/e20183112/37452/Effective-Discipline-to-Raise-Healthy-Children (title; Pediatrics 142(6) e20183112; abstract sentences on aversive strategies, negative outcomes and avoiding physical punishment and verbal abuse) and PubMed https://pubmed.ncbi.nlm.nih.gov/30397164/ (PMID). AAP News (publications.aap.org/aapnews/news/6955 and /7019) gave the DOI 10.1542/peds.2018-3112, the December 2018 issue and the update of the 1998 guidance. A Pediatrics item at https://publications.aap.org/pediatrics/article-abstract/143/2/e20183609/37315/ is titled with the full citation 'Sege RD, Siegel BS; Council on Child Abuse and Neglect; Committee on Psychosocial Aspects of Child and Family Health ...', which confirms the author line (it appears to be an erratum; what it corrects was not checked). The recommendation sentence 'should not use corporal punishment (including hitting and spanking)' was confirmed in an AAP-domain search. HealthyChildren.org (AAP) pages 'Where We Stand: Spanking' and 'American Academy of Pediatrics Updates Policy on Corporal Punishment' confirmed the no spanking, hitting, slapping, threatening, insulting, humiliating or shaming summary, the recommended alternatives, the stress-hormone and brain-architecture statement and the harsh verbal abuse link. REAFFIRMATION STATUS UNRESOLVED: no reaffirmation, revision or retirement notice was found; AAP policy statements automatically expire 5 years after publication unless reaffirmed, revised or retired (confirmed on AAP 'Publications Reaffirmed or Retired' pages). AAP sites still present the 2018 policy as AAP's position. Human check of the article page for a reaffirmation note is needed."
- id: larzelere-2024
  evidence_level: meta-analysis
  authors: Larzelere, R. E., Gunnoe, M. L., Pritsker, J., & Ferguson, C. J.
  year: 2024
  title: "Resolving the Contradictory Conclusions from Three Reviews of Controlled Longitudinal Studies of Physical Punishment: A Meta-Analysis"
  venue: Marriage & Family Review, 60(7), 395-433
  doi: 10.1080/01494929.2024.2392672
  url: https://doi.org/10.1080/01494929.2024.2392672
  lang: en
  finding:
    en: A meta-analysis of controlled longitudinal studies found that customary spanking explained less than 1% of the remaining variance in each child outcome after controlling for earlier adjustment; the authors attribute harmful-looking results to residual confounding and, pointing to large effects of spanking used to enforce time-out in clinic programs for defiant young children, discourage blanket anti-spanking injunctions.
    zh-hans: 这项针对有对照纵向研究的荟萃分析发现，在控制孩子原有的适应状况后，惯常打屁股对每项儿童结果的解释力都不到剩余变异的 1%；作者认为以往看似有害的结果来自残余混杂，并以诊所课程中用打屁股强制执行暂停、对叛逆幼儿效果很大为由，反对一概禁止打屁股。
    zh-hant: 這項針對有對照縱貫研究的統合分析發現，在控制孩子原有的適應狀況後，慣常打屁股對每項兒童結果的解釋力都不到剩餘變異的 1%；作者認為過去看似有害的結果來自殘餘干擾，並以診所課程中用打屁股強制執行暫停、對叛逆幼兒效果很大為由，反對一概禁止打屁股。
  key_facts:
    - 'Abstract: "Regardless of statistical method, customary spanking explained less than 1% of the remaining variance in each child outcome (after controlling for baseline adjustment)."'
    - 'Abstract: "The oft-reported harmful-looking outcomes of customary physical punishment in ANCOVA-type analyses are likely due to residual confounding."'
    - "Hypothesis reported as supported: \"spanking to enforce timeout in randomized studies of clinically defiant young children would predict large improvements in children's cooperation with timeout and parental commands.\""
    - Four child outcomes; child age 18 months to 11 years examined as a moderator.
    - "Authors' conclusion: \"blanket anti-spanking injunctions are discouraged.\""
    - The number of studies (47) was reported by the research pass from search results, not from the abstract; do not state it until checked in the full text.
  topics:
    - physical-punishment
  side: minority
  accessed: 2026-10-04
  verified_via: "WebSearch restricted to tandfonline.com returned the abstract page https://www.tandfonline.com/doi/abs/10.1080/01494929.2024.2392672 (listed as 'Marriage & Family Review: Vol 60, No 7') and the full-text page https://www.tandfonline.com/doi/full/10.1080/01494929.2024.2392672, confirming the exact title, the author order (Robert E. Larzelere, Marjorie Lindner Gunnoe, Joshua Pritsker & Christopher J. Ferguson), volume 60, issue 7, pages 395-433, the three-reviews aim, the 'two types of change-scores and two sensitivity tests' design, the ANCOVA-type versus simple-difference-score hypothesis, the four child outcomes and the 18-month to 11-year age range. The figure of 47 studies and the authors' conclusion came from a non-restricted search whose top results were the publisher PDF (https://www.tandfonline.com/doi/pdf/10.1080/01494929.2024.2392672) and an author-hosted copy (christopherjferguson.com); moderately confident, recheck both in the PDF. The pooled effect sizes and whether the hypothesis was supported were NOT verified, so the entry does not report them. The brief's claim that spanking explained under 1% of variance was NOT found on any source page and is deliberately not recorded. | 2026-10-04 CI source check: abstract (OpenAlex) read in full; it does report the \"less than 1% of the remaining variance\" result, correcting the earlier research note."
- id: kaminski-2008
  evidence_level: meta-analysis
  authors: Kaminski, J. W., Valle, L. A., Filene, J. H., & Boyle, C. L.
  year: 2008
  title: A Meta-analytic Review of Components Associated with Parent Training Program Effectiveness
  venue: Journal of Abnormal Child Psychology, 36(4), 567-589
  doi: 10.1007/s10802-007-9201-9
  pmid: "18205039"
  url: https://doi.org/10.1007/s10802-007-9201-9
  lang: en
  finding:
    en: Across 77 published evaluations of parent training programs for children aged 0 to 7, programs that taught positive parent-child interaction and emotional communication, time out and parenting consistency, and that had parents practice new skills with their child during sessions had larger effects.
    zh-hans: 在 77 项针对 0 至 7 岁儿童家长培训课程的已发表评估中，教授积极亲子互动与情绪沟通、教授暂停法（time-out）与教养一致性，并让家长在课程中和孩子一起练习新技能的课程，效果更大。
    zh-hant: 在 77 項針對 0 至 7 歲兒童親職訓練課程的已發表評估中，教導正向親子互動與情緒溝通、教導暫停法（time-out）與管教一致性，並讓家長在課程中和孩子一起練習新技巧的課程，效果較大。
  key_facts:
    - Component analysis of 77 published evaluations of parent training programs for children aged 0-7.
    - 'Consistently associated with larger effects: "increasing positive parent-child interactions and emotional communication skills", "teaching parents to use time out and the importance of parenting consistency", and "requiring parents to practice new skills with their children during parent training sessions".'
    - "Consistently associated with smaller effects: \"teaching parents problem solving\"; \"teaching parents to promote children's cognitive, academic, or social skills\"; and \"providing other, additional services\"."
    - The journal has since been renamed Research on Child and Adolescent Psychopathology, and Springer now lists the article under that name.
  topics:
    - parenting-programs
    - time-out
    - connection
  accessed: 2026-10-04
  verified_via: "link.springer.com/article/10.1007/s10802-007-9201-9 (search restricted to Springer/PubMed): title, four authors, Journal of Abnormal Child Psychology 36(4):567-589, 2008, DOI, and the component findings; pubmed.ncbi.nlm.nih.gov/18205039 (search result): title, PMID, and abstract wording (77 evaluations, ages 0-7, components linked to larger and smaller effects)."
- id: leijten-2019
  evidence_level: meta-analysis
  authors: Leijten, P., Gardner, F., Melendez-Torres, G. J., et al.
  year: 2019
  title: "Meta-Analyses: Key Parenting Program Components for Disruptive Child Behavior"
  venue: Journal of the American Academy of Child & Adolescent Psychiatry, 58(2), 180-190
  doi: 10.1016/j.jaac.2018.07.900
  pmid: "30738545"
  url: https://doi.org/10.1016/j.jaac.2018.07.900
  lang: en
  finding:
    en: "Two meta-analyses of randomized parenting program trials found that only three of 26 parenting techniques were linked to stronger effects on disruptive child behavior: positive reinforcement, praise in particular, and natural/logical consequences."
    zh-hans: 两项针对家长课程随机试验的荟萃分析发现，在 26 种教养技巧中，只有 3 种与改善孩子破坏性行为的更强效果相关：正向强化、特别是表扬，以及自然后果和逻辑后果。
    zh-hant: 兩項針對親職課程隨機試驗的統合分析發現，在 26 種教養技巧中，只有 3 種與改善孩子干擾行為的較強效果有關：正向增強、特別是讚美，以及自然後果與邏輯後果。
  key_facts:
    - '"Three of 26 parenting techniques were associated with stronger program effects: positive reinforcement, praise in particular, and natural/logical consequences."'
    - Several additional techniques, for example relationship building and parental self-management, were associated with stronger effects in treatment but weaker effects in prevention.
    - No technique was associated with stronger longer-term effects.
    - "Program effects grew with level of need: universal d = -0.21, selective d = -0.27, indicated d = -0.55, treatment d = -0.69 (negative d means less disruptive behavior)."
    - Time-out and ignoring are not among the techniques the abstract links to stronger effects; the full list of 26 coded techniques was not checked.
  topics:
    - parenting-programs
    - praise
    - consequences
  accessed: 2026-10-04
  verified_via: "pubmed.ncbi.nlm.nih.gov/30738545 and sciencedirect.com/science/article/abs/pii/S0890856718319804 (search restricted to PubMed/JAACAP/ScienceDirect): title, first three authors, JAACAP February 2019, abstract results; research.bangor.ac.uk research portal entry (Bangor University): volume 58(2), pages 180-190 and DOI 10.1016/j.jaac.2018.07.900. The portal misspells two co-author names, so authors after the third are given as et al."
- id: leijten-2018
  evidence_level: meta-analysis
  authors: Leijten, P., et al.
  year: 2018
  title: Are Relationship Enhancement and Behavior Management "The Golden Couple" for Disruptive Child Behavior? Two Meta-analyses
  venue: Child Development, 89(6)
  doi: 10.1111/cdev.13051
  pmid: "29557553"
  url: https://doi.org/10.1111/cdev.13051
  lang: en
  finding:
    en: "Two meta-analyses of randomized trials found that combining relationship enhancement with behavior management was not better overall than behavior management alone: it was better in treatment settings, worse in prevention settings, and no different up to 3 years later."
    zh-hans: 两项随机试验荟萃分析发现，把增进亲子关系和行为管理结合起来，总体上并不比单做行为管理更好：在治疗情境中更好，在预防情境中较差，三年内的长期效果没有差别。
    zh-hant: 兩項隨機試驗統合分析發現，把增進親子關係和行為管理結合起來，整體上並不比單做行為管理更好：在治療情境中較好，在預防情境中較差，三年內的長期效果沒有差別。
  key_facts:
    - Two meta-analyses of 156 and 41 RCTs with 15,768 participants in total and average child ages of 1 to 11 years.
    - The integrative approach showed no overall superiority over behavior management alone.
    - Relative to behavior management, the integrative approach was superior in treatment settings but inferior in prevention settings.
    - The two approaches did not have different sustained effects up to 3 years after the program.
    - The authors argue against implementing the same parenting programs in treatment and prevention settings.
  topics:
    - parenting-programs
    - connection
  accessed: 2026-10-04
  verified_via: "pubmed.ncbi.nlm.nih.gov/29557553 and srcd.onlinelibrary.wiley.com/doi/10.1111/cdev.13051 (search restricted to PubMed/Wiley): title, first author Patty Leijten, Child Development November 2018, DOI, abstract numbers and findings; volume 89, issue 6 also stated in an unrestricted search led by the Utrecht University research portal entry. Co-authors and page range were not confirmed."
- id: owen-2012
  evidence_level: systematic-review
  authors: Owen, D. J., Slep, A. M. S., & Heyman, R. E.
  year: 2012
  title: "The Effect of Praise, Positive Nonverbal Response, Reprimand, and Negative Nonverbal Response on Child Compliance: A Systematic Review"
  venue: Clinical Child and Family Psychology Review, 15(4), 364-385
  doi: 10.1007/s10567-012-0120-0
  pmid: "22918669"
  url: https://doi.org/10.1007/s10567-012-0120-0
  lang: en
  finding:
    en: A systematic review of 41 studies of children aged 1.5 to 11 found that reprimands and negative nonverbal responses consistently increased compliance, while praise and positive nonverbal responses had mixed effects.
    zh-hans: 一项涵盖 41 项研究、儿童年龄 1.5 至 11 岁的系统综述发现，口头责备和负面的非语言回应一致地提高了孩子的配合度，而表扬和正面的非语言回应效果不一。
    zh-hant: 一項涵蓋 41 項研究、兒童年齡 1.5 至 11 歲的系統性回顧發現，口頭責備和負面的非語言回應一致地提高了孩子的配合度，而讚美和正面的非語言回應效果不一。
  key_facts:
    - 41 studies; children aged 1.5 to 11 years.
    - '"Reprimand and negative nonverbal responses consistently resulted in greater compliance".'
    - '"praise and positive nonverbal responses resulted in mixed child outcomes".'
    - The authors propose a mechanism that may increase children's sensitivity to both positive and negative behavioral contingencies.
  topics:
    - praise
    - instructions
  accessed: 2026-10-04
  verified_via: "pubmed.ncbi.nlm.nih.gov/22918669 (search restricted to PubMed/Springer/NCBI): title, authors Daniela J Owen, Amy M S Slep and Richard E Heyman, 15(4):364-85, December 2012, abstract findings; link.springer.com/article/10.1007/s10567-012-0120-0: title, journal, volume, pages, DOI."
- id: dadds-tully-2019
  evidence_level: review
  authors: Dadds, M. R., & Tully, L. A.
  year: 2019
  title: "What is it to discipline a child: What should it be? A reanalysis of time-out from the perspective of child mental health, attachment, and trauma"
  venue: American Psychologist, 74(7), 794-808
  doi: 10.1037/amp0000449
  pmid: "30802080"
  url: https://doi.org/10.1037/amp0000449
  lang: en
  finding:
    en: This reanalysis answers attachment-based criticism of time-out and argues that time-out used in line with current models of learning, attachment, self-regulation and family systems can quickly remedy children's problems and generally enhances child well-being.
    zh-hans: 这篇重新分析回应了从依恋理论出发对暂停法的批评，认为只要按照当前关于学习、依恋、自我调节和家庭系统的理论来使用，暂停法能较快改善孩子的问题，总体上有益于孩子的身心健康。
    zh-hant: 這篇重新分析回應了從依附理論出發對暫停法的批評，認為只要依照目前關於學習、依附、自我調節和家庭系統的理論來使用，暫停法能較快改善孩子的問題，整體上有益於孩子的身心健康。
  key_facts:
    - Describes time-out from positive reinforcement as one of the most common and well-researched discipline procedures in the world.
    - Responds to criticism from writers drawing on attachment theory that time-out breaks attachment security and may harm children with trauma histories.
    - Derives five axioms for judging the worth and acceptability of any discipline strategy and uses them to specify how time-out should be used to maximize positive child outcomes.
    - Concludes that time-out used this way is a "positive perturbation" that "generally enhances child well-being".
  topics:
    - time-out
  accessed: 2026-10-04
  verified_via: "pubmed.ncbi.nlm.nih.gov/30802080 (searches restricted to PubMed/APA PsycNet): title, authors Mark R Dadds and Lucy A Tully, American Psychologist October 2019, PMID, DOI, abstract points; the restricted search also returned volume 74, issue 7, pages 794-808."
- id: knight-2020
  evidence_level: longitudinal
  authors: Knight, R. M., Albright, J., Deling, L., Dore-Stites, D., & Drayton, A. K.
  year: 2020
  title: Longitudinal Relationship Between Time-Out and Child Emotional and Behavioral Functioning
  venue: Journal of Developmental & Behavioral Pediatrics, 41(1), 31-37
  url: https://doi.org/10.1097/dbp.0000000000000725
  lang: en
  finding:
    en: In Early Head Start Research and Evaluation study data that followed families from child age 0-3 to fifth grade, children whose parents reported using time-out at 36 months did not differ significantly from other children on any emotional, behavioral or parent-child relationship outcome.
    zh-hans: 美国早期开端计划（Early Head Start）研究评估项目追踪家庭从孩子 0 至 3 岁直到五年级，数据显示，家长报告在孩子 36 个月大时使用暂停法的孩子，在各项情绪、行为和亲子关系结果上都与其他孩子没有显著差异。
    zh-hant: 美國早期啟蒙計畫（Early Head Start）研究評估專案追蹤家庭從孩子 0 至 3 歲直到五年級，資料顯示，家長表示在孩子 36 個月大時使用暫停法的孩子，在各項情緒、行為和親子關係結果上都與其他孩子沒有顯著差異。
  key_facts:
    - '"This study tracked families with children in Early Head Start at 3 different time points as follows: baseline (aged 0-3 years), pre-kindergarten, and fifth grade."'
    - '"Parent interviews, including questions on the use of time-out, were conducted when the children were 36 months old."'
    - '"Analyses for all outcome variables suggest no significant difference for children whose parents reported using time-out versus those who did not."'
    - '"Parental reported use of time-out was not associated with long-term negative outcomes."'
  topics:
    - time-out
  accessed: 2026-10-04
