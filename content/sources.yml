  pmid: "36227318"
  url: https://doi.org/10.1037/bul0000368
  lang: en
  finding:
    en: A meta-analysis of 53 independent samples from randomized growth mindset intervention studies found effects of d = 0.14 on academic achievement and d = 0.32 on mental health for targeted subgroups with high-fidelity implementation, with wide expected variation across future interventions (95% prediction interval from -0.08 to 0.35 for academic achievement).
    zh-hans: 这项荟萃分析纳入 53 个采用随机设计的成长型思维干预独立样本，发现针对特定目标群体且执行到位的干预，对学业成绩的效果为 d = 0.14，对心理健康的效果为 d = 0.32；但未来干预的效果预计差异很大（学业成绩的 95% 预测区间为 -0.08 至 0.35）。
    zh-hant: 這項統合分析納入 53 個採用隨機設計的成長型思維介入獨立樣本，發現針對特定目標族群且確實執行的介入，對學業成就的效果為 d = 0.14，對心理健康的效果為 d = 0.32；但未來介入的效果預期差異很大（學業成就的 95% 預測區間為 -0.08 至 0.35）。
  key_facts:
    - '"Our search yielded 53 independent samples testing distinct interventions."'
