  finding:
    en: A Cochrane review of 98 studies of home safety education for those aged 19 and under, with or without low-cost, discounted or free safety equipment, found a lack of evidence that it reduced burns and scalds (thermal injuries) or poisoning, and only some evidence that it may reduce injury rates (IRR 0.89, 95% CI 0.78 to 1.01) after controlled before-and-after studies were adjusted for baseline injury rates.
    zh-hans: 一项纳入 98 项研究的 Cochrane 系统综述评估了针对 19 岁及以下人群的居家安全教育（无论是否同时提供低价、折扣或免费的安全设备），发现缺乏证据表明这类干预能减少烧烫伤或中毒，只有部分证据显示，在对前后对照研究按基线伤害率校正后，它可能降低伤害发生率（IRR 0.89，95% CI 0.78 至 1.01）。
    zh-hant: 一項納入 98 項研究的 Cochrane 系統性回顧評估了針對 19 歲以下（含）族群的居家安全教育（無論是否同時提供低價、折扣或免費的安全設備），發現缺乏證據顯示這類介入能減少燒燙傷或中毒，只有部分證據顯示，在對前後對照研究依基準傷害率校正後，它可能降低傷害發生率（IRR 0.89，95% CI 0.78 至 1.01）。
