name: Deploy to GitHub Pages

# Runs on every push to main (so a merged pull request goes live on its own) and on manual
# dispatch (Brian's instruction of 2026-10-04, SPEC §2). The custom domain (xn--3ys368f86s.com)
# is attached to Pages, so every deploy is public: nothing merges into main until CI is green.
# Sessions never dispatch it by hand. The smoke job then checks the live site and the redirect
# domains.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build, render PDFs and OG images, run QA, the link test and the anchor test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run build
          node scripts/link-test.mjs
          node scripts/anchor-test.mjs

      - name: Check CNAME
        run: test "$(cat dist/CNAME)" = "xn--3ys368f86s.com"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the live site and redirect domains
        run: node scripts/smoke-test.mjs
