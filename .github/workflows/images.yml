name: Generate images

# Generates illustration candidates (content/images.yml, SPEC §9) with Cloudflare Workers AI and commits
# them to the review branch images/incoming for a full-size review. Nothing goes live from here: the
# chosen candidate per image is copied to src/assets/ai/<id>.jpg on a batch branch, logged in
# docs/IMAGES.md and merged through a pull request; deploys are deploy.yml's business.
# Manual dispatch only (the daily schedule and the push trigger are gone with the photo plan): runs cost
# usage on the Workers Paid plan, so each one is deliberate. The review branch is created from the
# triggering branch if missing, otherwise kept merged with it.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Image ids to generate (comma separated); empty = every id without an approved illustration
        required: false
        default: ''
      candidates:
        description: Candidates per image
        required: false
        default: '3'
      max:
        description: At most this many ids in this run (empty = all)
        required: false
        default: ''
      steps:
        description: Inference steps (empty = the script's default, 28)
        required: false
        default: ''
      probe_only:
        description: Only print the model catalog, the schema and the usage report
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the review branch
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin images/incoming 2>/dev/null; then
            git checkout -B images/incoming origin/images/incoming
            if ! git merge --no-edit "origin/${GITHUB_REF_NAME}"; then
              echo "::error::images/incoming does not merge cleanly with ${GITHUB_REF_NAME}; resolve it by hand."
              exit 1
            fi
            echo "Writing to images/incoming (merged with ${GITHUB_REF_NAME})."
          else
            git checkout -B images/incoming
            echo "Writing to a new images/incoming branch from ${GITHUB_REF_NAME}."
          fi
          echo "name=images/incoming" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (runtime dependencies only)
        run: npm ci --omit=dev

      - name: Probe the catalog and generate candidates
        id: generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          IMAGE_IDS: ${{ github.event.inputs.ids }}
          CANDIDATES: ${{ github.event.inputs.candidates || '3' }}
          MAX_IMAGES: ${{ github.event.inputs.max }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only }}
          IMAGE_STEPS: ${{ github.event.inputs.steps }}
        run: node scripts/generate-images.mjs

      - name: Commit the candidates for review
        if: always()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git add image-candidates
          if git diff --cached --quiet; then
            echo "No new candidates."
            exit 0
          fi
          git commit -m "Generate illustration candidates for review"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" 2>/dev/null || true
            git push origin "HEAD:$BRANCH" && break
            sleep $((i * 5))
          done
          echo "Pushed to $BRANCH. Review each candidate at full size, copy the cleanest to src/assets/ai/<id>.jpg on a batch branch and log it in docs/IMAGES.md."
