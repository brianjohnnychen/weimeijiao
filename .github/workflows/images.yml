name: Generate images

# Generates illustration candidates (content/images.yml, SPEC §9) with Cloudflare Workers AI and commits
# them to the review branch images/incoming for a full-size review. Nothing goes live from here: the
# chosen candidate per image is copied to src/assets/ai/<id>.jpg on the working branch, logged in
# docs/IMAGES.md and merged through a pull request; deploys are deploy.yml's business.
# Manual dispatch only: runs cost usage on the Workers Paid plan, so each one is deliberate.
# The run generates from the branch it was dispatched on (its prompts and script), then adds only the
# new files under image-candidates/ on top of images/incoming: the review branch stores candidates and is
# never merged with the working branch, so it cannot conflict with it.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Image ids to generate (comma separated); empty = every id without an approved illustration
        required: false
        default: ''
      candidates:
        description: Candidates per image
        required: false
        default: '3'
      max:
        description: At most this many ids in this run (empty = all)
        required: false
        default: ''
      steps:
        description: Inference steps (empty = the script's default, 28)
        required: false
        default: ''
      probe_only:
        description: Only print the model catalog, the schema and the usage report
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (runtime dependencies only)
        run: npm ci --omit=dev

      - name: Probe the catalog and generate candidates
        id: generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          IMAGE_IDS: ${{ github.event.inputs.ids }}
          CANDIDATES: ${{ github.event.inputs.candidates || '3' }}
          MAX_IMAGES: ${{ github.event.inputs.max }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only }}
          IMAGE_STEPS: ${{ github.event.inputs.steps }}
        run: node scripts/generate-images.mjs

      - name: Commit the candidates to the review branch
        if: always()
        run: |
          shopt -s nullglob
          files=(image-candidates/*.jpg)
          if [ ${#files[@]} -eq 0 ] && [ ! -f image-candidates/run-ids.txt ]; then
            echo "No new candidates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/candidates"
          if [ ${#files[@]} -gt 0 ]; then mv image-candidates/*.jpg "$RUNNER_TEMP/candidates/"; fi
          if [ -f image-candidates/run-ids.txt ]; then mv image-candidates/run-ids.txt "$RUNNER_TEMP/run-ids.txt"; fi
          git reset --hard --quiet
          git clean -fdq
          if git fetch origin images/incoming 2>/dev/null; then
            git checkout -B images/incoming origin/images/incoming
          else
            git checkout -B images/incoming
          fi
          mkdir -p image-candidates
          # The review branch holds only the latest run's candidates for each id: the earlier files of the ids this run
          # worked on go first (an id whose pictures were all discarded as framed would otherwise keep the old ones).
          if [ -f "$RUNNER_TEMP/run-ids.txt" ]; then
            while read -r id; do
              if [ -n "$id" ]; then git ls-files image-candidates | grep -E "^image-candidates/${id}-[0-9]+\.jpg$" | xargs -r git rm -q --; fi
            done < "$RUNNER_TEMP/run-ids.txt"
          fi
          new=("$RUNNER_TEMP"/candidates/*.jpg)
          if [ ${#new[@]} -gt 0 ]; then cp "${new[@]}" image-candidates/; fi
          git add -A image-candidates
          if git diff --cached --quiet; then
            echo "Candidates identical to the ones already on the review branch."
            exit 0
          fi
          git commit -m "Generate illustration candidates for review (run ${GITHUB_RUN_ID} from ${GITHUB_REF_NAME})"
          for i in 1 2 3; do
            git push origin HEAD:images/incoming && break
            git pull --rebase origin images/incoming || true
            sleep $((i * 5))
          done
          echo "Pushed to images/incoming. Review each candidate at full size, copy the cleanest to src/assets/ai/<id>.jpg on the working branch and log it in docs/IMAGES.md."
